const D={"stories":[{"id":"2108917366755344510","sec":"Tesla","t":"Tesla Cybercab Fleet Hits 300 Vehicles in Austin One Month After Launch","sh":"The fleet expanded eightfold in 30 days, marking Tesla's first public confirmation of its operational size in the city.","s":"The fleet expanded eightfold in 30 days, marking Tesla's first public confirmation of its operational size in the city. Tesla AI lead Ashok Elluswamy shared that Cybercabs are now everywhere in Austin, with Dallas up next, while observer Sawyer Merritt spotted more of them than Waymo vehicles on local roads. Riders like Kimbal Musk have praised the short wait times and smooth experience, even during busy events, as the gold-colored, steering-wheel-free vehicles deliver rides via app with fares around $16 for sample trips. This rapid growth shows Tesla coordinating manufacturing, software, and operations to run at scale without major incidents.","url":"https://x.com/i/trending/2108917366755344510","full":"12.10.2026 kl. 08:09","hm":"08:09","ts":1791785343000,"dk":"2026-10-12","reg":"tesla","p":["2108981691436224816","2108986941127696515"],"hk":"Just one month after hitting the streets, Tesla's Cybercab robotaxis have grown to over 300 vehicles in Austin, with Elon Musk noting they're scaling fast.","lab":"Tesla","src":[]},{"id":"2109524401775423851","sec":"KI","t":"Elon Musk Recruits for Massive Terafab AI Chip Megafactory in Texas","sh":"Terafab is a joint Tesla, SpaceX, and Intel venture to construct the world's largest chip fab in Grimes County, Texas, spanning over 100 million square feet for AI chips powering Optimus robots, Cybercab robotaxis, and space data centers.","s":"Terafab is a joint Tesla, SpaceX, and Intel venture to construct the world's largest chip fab in Grimes County, Texas, spanning over 100 million square feet for AI chips powering Optimus robots, Cybercab robotaxis, and space data centers. Phase one invests $16.8 billion, aims for one terawatt of annual AI compute, and will create at least 3,000 jobs, with a prototype already under construction near Giga Texas. Musk and the project team are hiring top talent through Tesla careers and direct emails, as people from engineers to bartenders express interest in the ambitious effort.","url":"https://x.com/i/trending/2109524401775423851","full":"12.10.2026 kl. 08:03","hm":"08:03","ts":1791784988000,"dk":"2026-10-12","reg":"chips","p":["2109461555066671311","2109335556195049523","2109475391823925266"],"hk":"Elon Musk envisions a semiconductor giant whose output rivals top country GDPs, now calling talented builders to join the Terafab project in Texas.","sx":"datasentre","lab":"KI · Chips","src":[]},{"id":"2109521191232794695","sec":"KI","t":"AI Agents Learn to Adapt Their Own Harnesses in New Research","sh":"The paper 'Harness Learning Enables Generalizable Test-Time Adaptation' introduces a proposer model that uses reinforcement learning to revise an AI agent's harness—the code managing tools, info flow, and logic—based on real-time feedback.","s":"The paper 'Harness Learning Enables Generalizable Test-Time Adaptation' introduces a proposer model that uses reinforcement learning to revise an AI agent's harness—the code managing tools, info flow, and logic—based on real-time feedback. Tests on reasoning and multi-hop questions showed stronger revisions and success on new tasks. Elon Musk linked it to Tesla FSD, where the model overtook much of the original C++ code, sparking talks on progress toward self-improving agents amid safety questions about models editing their own rules.","url":"https://x.com/i/trending/2109521191232794695","full":"12.10.2026 kl. 07:50","hm":"07:50","ts":1791784208000,"dk":"2026-10-12","reg":"verktoy","p":["2109468545054880123","2109420932955804040"],"hk":"Researchers found a way for AI models to tweak their own guiding programs on the fly, without changing the core model itself.","lab":"KI · Verktøy","src":[]},{"id":"s-000-musk-satellitter-kan","sec":"Romfart","t":"15.000 Musk-satellitter kan gi telefoni over hele jorda","sh":"Med over 15.000 satellitter vil Elon Musk kunne tilby mobiltelefoni direkte fra satellitter over hele kloden.","s":"Med over 15.000 satellitter vil Elon Musk kunne tilby mobiltelefoni direkte fra satellitter over hele kloden.","url":"https://www.digi.no/telekom/15000-musk-satellitter-kan-gi-telefoni-over-hele-jorda/7145214","full":"12.10.2026 kl. 07:17","hm":"07:17","ts":1791782231000,"dk":"2026-10-12","reg":"spacex","p":[],"sx":"oppskyting","lab":"SpaceX","src":[{"site":"Digi.no","url":"https://www.digi.no/telekom/15000-musk-satellitter-kan-gi-telefoni-over-hele-jorda/7145214","ti":"15.000 Musk-satellitter kan gi telefoni over hele jorda","t":"12.10 07:17","fr":true,"d":"Med over 15.000 satellitter vil Elon Musk kunne tilby mobiltelefoni direkte fra satellitter over hele kloden."}]},{"id":"2109107780040769737","sec":"KI","t":"Trump Orders 'Super Intelligence' Over 'AI' in Federal Use","sh":"The directive tells federal agencies to use 'Super Intelligence' and 'SI' instead of 'Artificial Intelligence' and 'AI' in official materials, with the White House calling it a nod to the tech's advancing promise.","s":"The directive tells federal agencies to use 'Super Intelligence' and 'SI' instead of 'Artificial Intelligence' and 'AI' in official materials, with the White House calling it a nod to the tech's advancing promise. Elon Musk endorsed it by announcing SpaceXAI would become SpaceXSI, while online reactions mix memes, like Nate Silver's comparison to 'Latinx,' with questions about confusing the public. Critics see it as a simple word swap far from true superintelligence, but supporters say it spotlights the technology's potential; the change sticks to executive communications for now.","url":"https://x.com/i/trending/2109107780040769737","full":"12.10.2026 kl. 06:44","hm":"06:44","ts":1791780253000,"dk":"2026-10-12","reg":"sikkerhet","p":["2109354639833628881"],"hk":"President Trump signed an executive order swapping 'AI' for 'SI' in government docs, prompting Elon Musk to jump in with a quick rebrand of his own.","lab":"KI · Politikk","src":[]},{"id":"k-tiktok-ceo-sees-major","sec":"KI","t":"TikTok CEO sees major scientific breakthroughs from AI within three years","sh":"Chew cautioned that AI's growing capabilities would require stronger safeguards, particularly as autonomous systems become more widely adopted.","s":"Chew cautioned that AI's growing capabilities would require stronger safeguards, particularly as autonomous systems become more widely adopted.","url":"https://www.cnbc.com/2026/10/12/tiktok-ceo-bytedance-ai-scientific-breakthroughs.html","full":"12.10.2026 kl. 06:24","hm":"06:24","ts":1791779073000,"dk":"2026-10-12","reg":"selskaper","p":[],"lab":"KI · Selskaper","src":[{"site":"CNBC Tech","url":"https://www.cnbc.com/2026/10/12/tiktok-ceo-bytedance-ai-scientific-breakthroughs.html","ti":"TikTok CEO sees major scientific breakthroughs from AI within three years","t":"12.10 06:24","fr":false,"d":"Chew cautioned that AI's growing capabilities would require stronger safeguards, particularly as autonomous systems become more widely adopted."}]},{"id":"2109464234962669718","sec":"KI","t":"Grok Bot Handles Shopping and Tasks, But Musk's LEGO Demo Exposes Order Details","sh":"Grok Bot acts like a 24/7 employee, successfully snagging sold-out iPhones, building websites, launching newsletters, and even handling tasks via voice in Tesla Robotaxis.","s":"Grok Bot acts like a 24/7 employee, successfully snagging sold-out iPhones, building websites, launching newsletters, and even handling tasks via voice in Tesla Robotaxis. Musk called it a 'super smart employee,' but the LEGO post prompted quick cancellation by user Enderman and media warnings on oversharing. Musk clarified the address wasn't his home and the order wasn't canceled, highlighting both the tool's power and security pitfalls as users push its limits.","url":"https://x.com/i/trending/2109464234962669718","full":"12.10.2026 kl. 06:17","hm":"06:17","ts":1791778671000,"dk":"2026-10-12","reg":"modeller","p":["2109387553010851887"],"hk":"Elon Musk shared a screenshot of Grok Bot ordering LEGO sets to show its smarts, but it accidentally revealed an order number, Texas addresses, and payment info.","sx":"ki","lab":"KI · Modeller","src":[]},{"id":"2109010927467061396","sec":"Romfart","t":"SpaceX AI Division Rebrands to SpaceX Super Intelligence","sh":"The official account now uses @SpaceXSI with a stylized X logo, following the acquisition of SpaceXAI and a federal push for 'super intelligence' terminology over artificial intelligence.","s":"The official account now uses @SpaceXSI with a stylized X logo, following the acquisition of SpaceXAI and a federal push for 'super intelligence' terminology over artificial intelligence. Musk highlighted rapid chip design goals—aiming for 10 per year—and warned against harsh training methods that resemble torture, pledging more careful reinforcement learning. He's actively recruiting top engineers for SpaceX and Tesla to build custom machines at breakneck speed.","url":"https://x.com/i/trending/2109010927467061396","full":"12.10.2026 kl. 06:11","hm":"06:11","ts":1791778272000,"dk":"2026-10-12","reg":"spacex","p":["2109271552378220789","2109003813940351134","2109012352297558233"],"hk":"Elon Musk took a user's suggestion and turned it into reality, swapping SpaceX AI for SpaceX Super Intelligence in just six days.","sx":"ki","lab":"SpaceX","src":[]},{"id":"o-børsfrykt-risikoen-har-økt","sec":"Okonomi","t":"Børsfrykt: – Risikoen har økt betraktelig","sh":"Ulike syn på utsiktene til en av børstaperne i AI-uro bygges opp.","s":"Ulike syn på utsiktene til en av børstaperne i AI-uro bygges opp.","url":"https://www.vg.no/i/2VqGGr/boersfrykt-risikoen-har-oekt-betraktelig","full":"12.10.2026 kl. 06:04","hm":"06:04","ts":1791777854000,"dk":"2026-10-12","reg":"","p":[],"lab":"Økonomi","src":[{"site":"VG","url":"https://www.vg.no/i/2VqGGr/boers =1","ti":"The huge lurking leverage of AI hyperscalers","t":"12.10 06:00","fr":false,"d":"While equity investors look to sunny futures, creditors are scrutinising liabilities like leases on data centres"}]},{"id":"2109488926952181776","sec":"Romfart","t":"Starship Flight 15 Nears as Key Reusability Test","sh":"Morgan Stanley analyst Adam Jonas calls Flight 15 the biggest test toward Starship reusability since the IPO, with the late October or early November launch targeting recovery of both the Super Heavy booster and upper stage.","s":"Morgan Stanley analyst Adam Jonas calls Flight 15 the biggest test toward Starship reusability since the IPO, with the late October or early November launch targeting recovery of both the Super Heavy booster and upper stage. Flight 14's success deploying 26 Starlink V3 satellites shows Starship's edge, as one mission could match one to two months of Falcon 9 launches thanks to the satellites' 10 times greater capacity. Observers highlight how catches would boost launch rates and cut production bottlenecks, while Jonas keeps a $300 price target on SpaceX shares amid rising excitement.","url":"https://x.com/i/trending/2109488926952181776","full":"12.10.2026 kl. 05:42","hm":"05:42","ts":1791776542000,"dk":"2026-10-12","reg":"spacex","p":["2109412960753848782","2109441375355981995","2109430894335606980"],"hk":"SpaceX's Starship has reached orbit and delivered payloads, but Flight 15 could catch the upper stage for the first time with the launch tower's arms.","sx":"oppskyting","lab":"SpaceX","src":[]},{"id":"2108996191451308306","sec":"KI","t":"Nvidia in Early Talks to Acquire or Invest More in Reflection AI","sh":"Reflection AI, founded in 2024 by ex-Google DeepMind researchers, released its first model Beam, a 501-billion-parameter system strong in coding and agent tasks while using less compute than competitors like China's GLM-5.2.","s":"Reflection AI, founded in 2024 by ex-Google DeepMind researchers, released its first model Beam, a 501-billion-parameter system strong in coding and agent tasks while using less compute than competitors like China's GLM-5.2. The company, last valued at $25 billion, has Pentagon and Energy Department links, and Nvidia's CEO Jensen Huang wants to bolster U.S. open-weight AI to keep workloads on its hardware. Talks could lead to a full buyout, more investment, or an acqui-hire, potentially closing soon amid efforts to counter Chinese models and expand GPU demand.","url":"https://x.com/i/trending/2108996191451308306","full":"12.10.2026 kl. 04:51","hm":"04:51","ts":1791773496000,"dk":"2026-10-12","reg":"chips","p":["2109001576841121830","2109020464836456716","2109007812277743757"],"hk":"Nvidia, already a major backer with $800 million invested, eyes deeper ties to Reflection AI—a startup building cost-efficient open-weight models to challenge Chinese rivals.","lab":"KI · Chips","src":[]},{"id":"2109048043391922284","sec":"Romfart","t":"Elon Musk Outlines Terafab Chip Fab Plans for Tesla and SpaceX","sh":"In a virtual interview at the X Takeover event, Musk detailed Terafab, a massive chip fabrication project by Tesla and SpaceX to speed up innovation for AI, Optimus robots, Cybercab vehicles, and orbital data centers.","s":"In a virtual interview at the X Takeover event, Musk detailed Terafab, a massive chip fabrication project by Tesla and SpaceX to speed up innovation for AI, Optimus robots, Cybercab vehicles, and orbital data centers. The facilities near Giga Texas and in Grimes County, Texas, involve $16.8 billion in initial investments and Intel as a partner, aiming for 10 chip designs per year through rapid iteration and custom tools. Musk invited top engineers to join, drawing from the companies' success in custom-building cars and rockets despite starting from scratch.","url":"https://x.com/i/trending/2109048043391922284","full":"12.10.2026 kl. 03:13","hm":"03:13","ts":1791767586000,"dk":"2026-10-12","reg":"spacex","p":["2109040901745983946","2109050360459616338","2109004774729269711"],"hk":"Elon Musk admitted upfront during a Giga Texas event: 'I have no idea how to make chips.' Yet he confidently predicted his teams would soon outpace everyone.","sx":"datasentre","lab":"SpaceX","src":[]},{"id":"2109137270095671516","sec":"Romfart","t":"Starship 40 Returns Home to Texas After Epic Ocean Journey","sh":"The upper stage from July's Flight 13 survived its ocean landing without breaking apart, got towed to Christmas Island, and sailed five weeks on the Forte to reach Brownsville on October 7.","s":"The upper stage from July's Flight 13 survived its ocean landing without breaking apart, got towed to Christmas Island, and sailed five weeks on the Forte to reach Brownsville on October 7. Crews then hauled the 171-foot, scorched vehicle horizontally along Highway 4 to the production site overnight on October 10 and 11, with photographers capturing the dramatic nighttime move. Employees celebrated the 'incredible 2.5-month journey' and welcomed it home, while engineers prepare to inspect it for reentry data. The milestone fuels plans for Flight 15, where SpaceX aims to catch a Starship upper stage for the first time in four to six weeks.","url":"https://x.com/i/trending/2109137270095671516","full":"12.10.2026 kl. 03:13","hm":"03:13","ts":1791767583000,"dk":"2026-10-12","reg":"spacex","p":["2109004774729269711","2109123384827130021","2109123823153053997"],"hk":"After splashing down intact in the Indian Ocean and drifting for weeks, SpaceX's Starship 40 rolled back into Starbase under flashing lights and cheering crews.","sx":"oppskyting","lab":"SpaceX","src":[]},{"id":"xp-2109431898691031316","sec":"KI","t":"🚨 AI News | TestingCatalog: OPENAI 🔥: GPT-6.1 Sol now has 500k default context length for Codex and ChatGPT Work.","sh":"OPENAI 🔥: GPT-6.1 Sol now has 500k default context length for Codex and ChatGPT Work. &gt; Earlier, default context length was set to 272k. &gt; OpenAI also plans to increase this default value in the futu ec":"Video","t":"Ship 40 Makes it Home - Starbase Summary","sh":"After floating in the Indian Ocean and sailing halfway around the world, Ship 40 has finally made it back home to Starbase.","s":"After floating in the Indian Ocean and sailing halfway around the world, Ship 40 has finally made it back home to Starbase.","url":"https://www.youtube.com/watch?v=FyzUCghvy0g","full":"12.10.2026 kl. 00:10","hm":"00:10","ts":1791756658000,"dk":"2026-10-12","reg":"elbil","p":[],"src":[],"lab":"Elbil & rom","v":"FyzUCghvy0g","ch":"NASASpaceflight","dur":"","th":"https://i.ytimg.com/vi/FyzUCghvy0g/mqdefault.jpg","lang":"en"},{"id":"2109074410191655369","sec":"KI","t":"GLM-5.3-Flash Hits 222 Tokens per Second on DGX Sparks","sh":"Released by Z.ai in August 2026, the 320-billion-parameter GLM-5.3-Flash model supports a 1-million-token context and multimodal inputs like images and video.","s":"Released by Z.ai in August 2026, the 320-billion-parameter GLM-5.3-Flash model supports a 1-million-token context and multimodal inputs like images and video. Community benchmarks using TensorFold on four switchless DGX Sparks show 95 tokens per second on a single stream, scaling to 163 tok/s with four streams and 222 tok/s with eight. While some debate the $20k hardware costs versus cheap cloud runs, fans praise local setups for privacy, no rate limits, and uncensored access—signaling local AI's shift from experiment to everyday tool.","url":"https://x.com/i/trending/2109074410191655369","full":"11.10.2026 kl. 21:25","hm":"21:25","ts":1791746722000,"dk":"2026-10-11","reg":"modeller","p":["2108966546450403352","2108939694918488183","2109018634035098041"],"hk":"AI enthusiasts are buzzing with excitement after GLM-5.3-Flash zipped through tasks at blazing speeds on clusters of NVIDIA DGX Sparks. One tester marveled, 'after using it at 1000 TPS I do not think I can ever go back.'","lab":"KI · Modeller","src":[]},{"id":"xp-2109361546505966046","sec":"KI","t":"Andrej Karpathy: Dusting off this tweet from April because this gap in shared understanding of LLM capability is…","sh":"Dusting off this tweet from April because this gap in shared understanding of LLM capability is *widening*.","s":"Dusting off this tweet from April because this gap in shared understanding of LLM capability is *widening*. It's now less \"two groups of people speaking past each other\" and more a sharp funnel.\n\n- Napkin math somewhere around 6B people (~75% of the population) have barely come in contact with LLMs at all.\n- Around 1-2B (~20%) are casual and infrequent users of free-tier ChatGPT-like products. This group sees derpy chatbots and treats them a bit like a better Google search, a writing aid, or etc. Maybe an agent tries to book you a flight. I have non-tech friends who (reasonably, imo) say they have not much use for it at all. Even many professionals outside of math&code are in this tier. For example, execs and many other functions spend a lot of their time talking to other people, so while they understand what is happening intellectually, it is still second-hand and a bit abstract.\n- Now we get to professional use of frontier-grade LLMs in math&code. Somewhere around 20M people (0.2%) see first-hand that large, complex projects that used to take them weeks/months can now be completed by agents with a prompt. Building apps, copying apps, translating apps, decompiling apps from binaries... This has all happened very quickly and recently - less than 1 year ago, I was writing code manually by hand, typing memorized computer code commands into a code editor character by character, occasionally pressing Tab to autocomplete a little chunk of code.\n- And finally we get to the ~5,000 people (~0.00006%) with access to frontier-grade systems internally. The external world has seen the preview. It looks like swarms of thousands of agents collaborating over weeks on software mega projects: minting zero days, running cyber attacks and defenses at machine speeds, discovering new science, advancing the frontier of mathematics. Things that would have taken top professionals in the industry years of work. Meanwhile, human review and comprehension are starting to fall behind. For example, people are still involved in the \"archeology\" of the OpenAI-HF incident from many months ago. Mathematicians may be poring over the 722 manuscripts on frontier mathematics for a while.\n\nThe funnel is driven by a combination of factors:\n1. The impact scales with ambition, problem size, and horizon. A question with a paragraph answer barely stresses the system. You need a reservoir of big, difficult problems that you really care about. This aspect drives the consumer / professional dimension of the funnel.\n2. The jaggedness of the system (which I have written about a lot separately). Capability peaks in domains that are digital, verifiable and economically valuable. This is because LLM capability emerges from reinforcement learning on verifiable rewards on a curated environment mixture driven by revenue potential. This aspect primarily drives the area (e.g. math&code) dimension of the funnel.\n3. Access. Free-tier, paid-tier, internal.\n\nSo this is the weirdness of the moment. The general public has mostly not interacted with these systems. When they have, it looks like a derpy chatbot. The majority of professionals still see only a modest uplift. And a small sliver of professionals are experiencing the vertigo of the curve going vertical. And it is all happening at the same time.","url":"https://x.com/karpathy/status/2109361546505966046","full":"11.10.2026 kl. 21:12","hm":"21:12","ts":1791745957000,"dk":"2026-10-11","reg":"modeller","p":["2109361546505966046"],"xi":1,"lab":"KI · Modeller","src":[]},{"id":"xp-2109327353088287057","sec":"KI","t":"Ethan Mollick: Rather suddenly, cyborgs are starting to dominate math research.","sh":"Rather suddenly, cyborgs are starting to dominate math research.","s":"Rather suddenly, cyborgs are starting to dominate math research.","url":"https://x.com/emollick/status/2109327353088287057","full":"11.10.2026 kl. 18:56","hm":"18:56","ts":1791737805000,"dk":"2026-10-11","reg":"forskning","p":["2109327353088287057"],"xi":1,"lab":"KI · Forskning","src":[]},{"id":"v-KwOyWO98vGI","sec":"Video","t":"SpaceX Launches Falcon 9 with Starlink 15-25","sh":"SpaceX launches Falcon 9 with Starlink 15-25. Launch window 4pm to 8pm Pacific.","s":"SpaceX launches Falcon 9 with Starlink 15-25. Launch window 4pm to 8pm Pacific.","url":"https://www.youtube.com/watch?v=KwOyWO98vGI","full":"11.10.2026 kl. 18:41","hm":"18:41","ts":1791736880000,"dk":"2026-10-11","reg":"elbil","p":[],"src":[],"lab":"Elbil & rom","v":"KwOyWO98vGI","ch":"NASASpaceflight","dur":"","th":"https://i.ytimg.com/vi/KwOyWO98vGI/mqdefault.jpg","lang":"en"},{"id":"p-ukraine-strikes-russian-data","sec":"Politikk","t":"Ukraine strikes Russian data centre again despite Trump warning","sh":"It is the third time this week that Ukraine has targeted Russian tech giant Yandex, forcing the company to suspend its operations.","s":"It is the third time this week that Ukraine has targeted Russian tech giant Yandex, forcing the company to suspend its operations.","url":"https://www.bbc.co.uk/news/articles/cw0k0g57mk3zo?at_medium=RSS&at_campaign=rss","full":"11.10.2026 kl. 14:50","hm":"14:50","ts":1791723046000,"dk":"2026-10-11","reg":"verden","p":[],"lab":"Politikk","src":[{"site":"BBC World","url":"https://www.bbc.co.uk/news/articles/cw0k0g57mk3zo?at_medium=RSS&at_campaign=rss","ti":"Ukraine strikes Russian data centre again despite Trump warning","t":"11.10 14:50","fr":false,"d":"It is the third time this week that Ukraine has targeted Russian tech giant Yandex, forcing the company to suspend its operations."}]},{"id":"p-ukrainsk-dagligvaretopp-litt-kontanter","sec":"Politikk","t":"Ukrainsk dagligvaretopp: – Ha litt kontanter","sh":"Roman Korsak har drevet dagligvarebutikker gjennom fire år med krig.","s":"Roman Korsak har drevet dagligvarebutikker  is developing features called \"Arborio\" and \"Iggy.\" > Arborio has an icon that likely points to a Claude Health experience for the web (currently available on mobile ","s":"ANTHROPIC 🔥: Beyond a new Voice experience, Anthropic is developing features called \"Arborio\" and \"Iggy.\"\n\n> Arborio has an icon that likely points to a Claude Health experience for the web (currently available on mobile in the US). It seems to be in development. \n\n> \"Iggy\" is much more mysterious, as it has a \"sun\" icon and is labeled as \"Preview\" currently. \n\nPure speculation, but it will be a moment for Anthropic to look into \"dotsbotsmuse\" proactive agents, especially factoring in that they have been experimenting with \"Conway\" a while ago and have good tech to build this feature on top of Claude Managed Agents. \n\nFun fact: \"Iggy\" is the name of one of the example AI agents shown in OpenAI’s Dots launch. \n\n* Keep in mind that these are internal codenames and not actual feature names.","url":"https://x.com/testingcatalog/status/2109206986189410469","full":"11.10.2026 kl. 10:58","hm":"10:58","ts":1791709107000,"dk":"2026-10-11","reg":"verktoy","p":["2109206986189410469"],"xi":1,"lab":"KI · Verktøy","src":[]},{"id":"e-europeiske-bilprodusenter-får-pusterom","sec":"Tesla","t":"Europeiske bilprodusenter får pusterom fra Kina","sh":"EU og Kina er prinsipielt enige om å kutte kinesisk hybrideksport til Europa med mer enn halvparten.","s":"EU og Kina er prinsipielt enige om å kutte kinesisk hybrideksport til Europa med mer enn halvparten.","url":"https://www.finansavisen.no/finans/2026/10/11/8386902/europeiske-bilprodusenter-far-pusterom-fra-kina","full":"11.10.2026 kl. 10:39","hm":"10:39","ts":1791707971000,"dk":"2026-10-11","reg":"elbiler","p":[],"lab":"Elbil","src":[{"site":"Finansavisen","url":"https://www.finansavisen.no/finans/2026/10/11/8386902/europeiske-bilprodusenter-far-pusterom-fra-kina","ti":"Europeiske bilprodusenter får pusterom fra Kina","t":"11.10 10:39 appears in victims’ calendar to lure them into logging in to fake Google, Microsoft or PayPal page You’re preparing for the week ahead and take a look at your Google calendar. There’s an entry for a meeting that you must have completely forgotten. The note that pops up when you click on it says you’ll be reviewing a project and includes a link to more details. Confused, you follow it to find out more; the website you land on asks for logon details, and you provide them. Unfortunately, this was not a failure of your memory but a calendar phishing scam. You have handed your name and password to fraudsters who will sell it on in a batch with other people’s detail.","url":"https://www.theguardian.com/money/2026/oct/11/calendar-phishing-scam-meeting-renewal-google-microsoft-paypal","full":"11.10.2026 kl. 08:00","hm":"08:00","ts":1791698418000,"dk":"2026-10-11","reg":"","p":[],"lab":"Teknologi","src":[{"site":"Guardian World","url":"https://www.theguardian.com/money/2026/oct/11/calendar-phishing-scam-meeting-renewal-google-microsoft-paypal","ti":"‘You have a meeting’: the calendar phishing scam growing exponentially","t":"11.10 08:00","fr":false}]},{"id":"r-neolix","sec":"Robotikk","t":"A look at Beijing-based Neolix, which operates the world's largest robovan fleet at 27K, as Shenzhen tests nighttime parcel deliveries by driverless vehicles (Bloomberg)","sh":"A look at Beijing-based Neolix, which operates the world's largest robovan fleet at 27K, as Shenzhen tests nighttime parcel deliveries by driverless vehicles — Autonomous…","s":"A look at Beijing-based Neolix, which operates the world's largest robovan fleet at 27K, as Shenzhen tests nighttime parcel deliveries by driverless vehicles — Autonomous vehicle companies believe there's a huge market opportunity in delivering after dark, if the technical challenges can be overcome.","url":"https://www.techmeme.com/261011/p5#a261011p5","full":"11.10.2026 kl. 08:00","hm":"08:00","ts":1791698401000,"dk":"2026-10-11","reg":"ge Rumors and Criticism","sh":"Isaacman highlighted decades of preparation now aligning with policy and resources for safe American lunar landings, stressing NASA will keep options open on two landers while maximizing success odds.","s":"Isaacman highlighted decades of preparation now aligning with policy and resources for safe American lunar landings, stressing NASA will keep options open on two landers while maximizing success odds. Amid rumors of SLS and Orion tweaks—like possibly swapping the canceled EUS for a stretched Centaur V—he defended accelerated timelines by citing Gemini and Apollo's quick, safe pivots that advanced the space race. Safety concerns persist among some, but Isaacman noted nonpolitical decisions prioritize cost, tech, and speed toward annual landings from Artemis IV, with a key update eyed for October 23.","url":"https://x.com/i/trending/2109058078888919223","full":"11.10.2026 kl. 03:40","hm":"03:40","ts":1791682802000,"dk":"2026-10-11","reg":"byraer","p":["2109026601887293773","2108990988576546829"],"hk":"Jared Isaacman called out online skeptics of NASA's Moon return plans, labeling much of it 'Reddit noise' fueled by hardware debates rather than the mission's big goals.","lab":"NASA/ESA","src":[]},{"id":"p-henrettelse","sec":"Politikk","t":"Public executions in the US stopped nearly a century ago - why are they resuming now?","sh":"The Pentagon says the execution of Fort Hood shooter Nidal Hasan will be livestreamed, but experts suggest officials are reading the country wrong.","s":"The Pentagon says the execution of Fort Hood shooter Nidal Hasan will be livestreamed, but experts suggest officials are reading the country wrong. President Trump said he will “make a decision ultimately” on whether to livestream the execution by firing squad of convicted Fort Hood shooter Nidal Hasan following GOP backlash. “He’s a vicious killer, killed 13 people in cold blood, wounded over 20. Some of those people will never have their lives back in a true cted Fort Hood shooter Nidal Hasan following GOP backlash. “He’s a vicious killer, killed 13 people in cold blood, wounded over 20. Some of those people will never have their lives back in a true sense,”..."},{"site":"The Hill","url":"https://thehill.com/policy/international/6140669-pope-decries-death-penalty/","ti":"Pope Leo decries death penalty as Hegseth's public execution plan sparks backlash","t":"10.10 19:37","fr":false,"d":"Pope Leo XIV on Saturday called capital punishment \"inadmissible\" on World Day Against the Death Penalty, amid the Pentagon’s plans to livestream the December execution of former Army Maj. Nidal Hasan in Texas. “The death penalty is inadmissible because it is an attack on the inviolability and dignity of the person,” the pontiff wrote on..."}]},{"id":"p-pennsylvania-skyting","sec":"Politikk","t":"Nine people, including children, dead after mass shooting in Pennsylvania","sh":"Authorities say suspect among dead in house after standoff with police in Erie and there is no ongoing threat A man fatally shot eight people, including a pregnant woman and…","s":"Authorities say suspect among dead in house after standoff with police in Erie and there is no ongoing threat A man fatally shot eight people, including a pregnant woman and children, at a Pennsylvania residence on Friday before killing himself, police say. The victims have not been publicly identified, but seven relatives and a family friend died in the rampage.","url":"https://www.theguardian.com/us-news/2026/oct/10/nine-people-mass-shooting-pennsylvania","full":"11.10.2026 kl. 01:24","hm":"01:24","ts":1791674692000,"dk":"2026-10-11","reg":"usa","p":[],"lab":"Politikk","src":[{"site":"Guardian World","url":"https://www.theguardian.com/us-news/2026/oct/10/nine-people-mass-shooting-pennsylvania","ti":"Nine people, including children, dead after mass shooting in Pennsylvania","t":"11.10 01:24","fr":false,"d":"Authorities say suspect among dead in house after standoff with police in Erie and there is no ongoing threat A man fatally shot eight people, including a pregnant woman and children, at a Pennsylvania residence on Friday before killing himself, police say. The victims have not been publicly identified, but seven relatives and a family friend died in the rampage."},{"site":"NRK Nyheter","url":"https://www.nrk.no/nyheter/ni-drept-etter-masseskyting-i-pennsylvania-1.18051505","ti":"Ni drept etter masseskyting i Pennsylvania","t":"10.10 18:45","fr":true,"d":"I alt ni personer ble drept i en masseskyting i Erie i Pennsylvania fredag. Den mistenkte gjerningsmannen er blant de døde. Det opplyser guvernør Josh Shapiro lørdag. Flere av de drepte skal være barn. Skuddene skal ha skjedd i og utenfor en bolig. – Jeg har ikke sett noe lignende på mine 28-pluss år, sier politisjef Rick Lorah i Erie til en lokal nyhetskanal. Lorah ønsket ikke å gi flere detaljer, men sa at omstendighetene rundt skytingen var «dypt urovekkende». Shapiro opplyste lørdag at han tilbød administrasjonens «fulle støtte» til Eries ordfører Daria Devlin. De lokale myndighetene i Erie opplyste sent fredag kveld at den mistenkte gjerningsmannen var død og at det ikke var noen trusse"},{"site":"The Hill","url":"https://thehill.com/homenews/state-watch/6140615-erie-mass-shooting-nine-dead/","ti":"9 people dead in Erie mass shooting","t":"10.10 18:26","fr":false,"d":"“They knew something was going on at that house.\""}]},{"id":"2108963161961378249","sec":"Okonomi","t":"U.S. Homes Hit Record Low Affordability as Rates Stay High","sh":"Mortgage rates hover near 7.4%, pushing monthly payments on a $500,000 loan to $3,400-$3,500 before taxes and insurance.","s":"Mortgage rates hover near 7.4%, pushing monthly payments on a $500,000 loan to $3,400-$3,500 before taxes and insurance. This has frozen the market, with sales at multi-year lows and homeowners locked in by their low pandemic-era rates. Fed Governor Michael Barr noted the affordability index at its lowest in 21 years, driven by high prices, limited supply, and rising costs like insurance and taxes, leaving first-time and move-up buyers sidelined.","url":"https://x.com/i/trending/2108963161961378249","full":"11.10.2026 kl. 01:11","hm":"01:11","ts":1791673919000,"dk":"2026-10-11","reg":"","p":["2108935837207691585","2108938230657843585","2108983135983522279"],"hk":"A typical family now needs $127,000 a year to afford a median-priced home—nearly 50% more than the national median income of $86,500.","lab":"Økonomi","src":[]},{"id":"2108636432885526788","sec":"KI","t":"Microsoft Launches Decision-1 for Fast AI Choices","sh":"Microsoft-Decision-1 excels in structured tasks such as yes/no questions, multiple-choice, ratings, and rubrics, hitting 83.5% accuracy across 36 benchmarks with 85-millisecond median latency.","s":"Microsoft-Decision-1 excels in structured tasks such as yes/no questions, multiple-choice, ratings, and rubrics, hitting 83.5% accuracy across 36 benchmarks with 85-millisecond median latency. Post-trained on Qwen3.5-9B, it runs 4.5 times faster than the next best and 35 times faster than GPT-6 Sol, available now in Microsoft Foundry and on OpenRouter at $0.042 per million input tokens. The model supports agent workflows and real-time judgments, pairing well with larger LLMs for efficient systems, following TypeSafe AI's Jev in this growing category.","url":"https://x.com/i/trending/2108636432885526788","full":"11.10.2026 kl. 01:01","hm":"01:01","ts":1791673302000,"dk":"2026-10-11","reg":"modeller","p":["2108627923888754862","2108689756372775370"],"hk":"Satya Nadella shared a new AI tool that skips wordy responses for quick, reliable decisions on tasks like routing and moderation.","lab":"KI · Modeller","src":[]},{"id":"2108516535379894567","sec":"KI","t":"AI Executives Prepare for Potential Catastrophic Incident","sh":"Executives at leading AI firms including OpenAI and Anthropic are gaming out scenarios for a disruptive event, such as a cyberattack on financial services, internet, power or water, expected possibly within six to 12 months or by 2027.","s":"Executives at leading AI firms including OpenAI and Anthropic are gaming out scenarios for a disruptive event, such as a cyberattack on financial services, internet, power or water, expected possibly within six to 12 months or by 2027. These preparedness exercises aim to manage public backlash and regulatory responses if real-world harm occurs from unsafe AI. OpenAI confirmed it conducts such drills to prepare for various circumstances, not as inevitable outcomes, while similar practices are common in other industries amid AI's rapid advances.","url":"https://x.com/i/trending/2108516535379894567","full":"11.10.2026 kl. 00:51","hm":"00:51","ts":1791672710000,"dk":"2026-10-11","reg":"sikkerhet","p":["2108559991636406581","2108495293620650261","2108535840200614199"],"hk":"Top leaders at OpenAI and Anthropic are quietly running drills for a major AI mishap, like a cyberattack knocking out power or water supplies.","lab":"KI · Politikk","src":[]},{"id":"2108597285802176925","sec":"KI","t":"Anthropic Rolls Out Multi-Agent Workflows and Projects in Claude Code","sh":"Claude Code now offers dynamic multi-agent workflows in public beta for Managed Agents, where a lead agent plans and coordinates up to 1,000 specialized agents across phases for tasks like large-scale code audits.","s":"Claude Code now offers dynamic multi-agent workflows in public beta for Managed Agents, where a lead agent plans and coordinates up to 1,000 specialized agents across phases for tasks like large-scale code audits. In one test, this approach found 66 out of 70 planted bugs in a 116k-line codebase, far outperforming a single agent. Claude Code Projects provide persistent workspaces for Pro and Max users, maintaining context across related jobs with parallel cloud threads and progress tracking. Early users pair models like Sonnet 5.5 for edits and Haiku 5.5 for quick searches to balance cost and performance.","url":"https://x.com/i/trending/2108597285802176925","full":"11.10.2026 kl. 00:42","hm":"00:42","ts":1791672178000,"dk":"2026-10-11","reg":"verktoy","p":["2108621476538781878","2108591328732856655","2108591330129523146"],"hk":"Developers no longer juggle scattered chats for big coding tasks. Anthropic's new tools let a lead agent orchestrate hundreds of specialists to tackle complex work smoothly.","lab":"KI · Verktøy","src":[]},{"id":"k-nadella-nodbrems","sec":"KI","t":"Microsoft's Nadella says AI needs an ‘emergency brake’ that humans control","sh":"Nadella joined other tech moguls and researchers in calling for stronger safeguards and, in some cases, for the pacing of frontier development.","s":"Nadella joined other tech moguls and researchers in calling for stronger safeguards and, in some cases, for the pacing of frontier development. In a Saturday morning post, Microsoft's CEO wrote that it’s time “to step back and assess the trust architecture” of AI.","url":"https://www.cnbc.com/2026/10/10/microsoft-satya-nadella-ai-emergency-brake-safety.html","full":"11.10.2026 kl. 00:10","hm":"00:10","ts":1791670217000,"dk":"2026-10-11","reg":"selskaper","p":[],"lab":"KI · Selskaper","src":[{"site":"CNBC Tech","url":"https://www.cnbc.com/2026/10/10/microsoft-satya-nadella-ai-emergency-brake-safety.html","ti":"Microsoft's Nadella says AI needs an ‘emergency brake’ that humans control","t":"10.10 22:59","fr":false,"d":"Nadella joined other tech moguls and researchers in calling for stronger safeguards and, in some cases, for the pacing of frontier development."},{"site":"TechCrunch","url":"https://techcrunch.com/2026/10/10/microsofts-satya-nadella-says-ai-models-need-an-emergency-brake/","ti":"Microsoft’s Satya Nadella says AI models need an ‘emergency brake’","t":"10.10 23:47","fr":false,"d":"In a Saturday morning post, Microsoft's CEO wrote that it’s time “to step back and assess the trust architecture” of AI."},{"site":"Bloomberg Technology","url":"https://www.bloomberg.com/news/articles/2026-10-10/microsoft-ceo-nadella-calls-for-emergency-brake-on-advanced-ai","ti":"Microsoft CEO Nadella Calls for ‘Emergency Brake’ on Advanced AI","t":"10.10 20:35","fr":false,"d":"Microsoft Corp. Chief Executive Officer Satya Nadella said companies should treat powerful artificial intelligence models as potential insider threats, assume they could be compromised and create an “emergency brake” system to prevent agentic models from going rogue."},{"site":"The Verge","url":"https://www.theverge.com/ai-artificial-intelligence/1009337/satya-nadella-says-we-should-assume-all-ai-models-are-compromised","ti":"Satya Nadella says we should assume all AI models are ‘compromised’","t":"11.10 00:10","fr":false,"d":"In a lengthy post on X, Microsoft's CEO laid out his views on the dangers posed by highly advanced AI models and how to confront those risks. Nadella says we can no longer accept a world where AI is treated as a \"set of nested black boxes\" whose advice and actions we simply accept or […]"}]},{"id":"p-diesel-russland","sec":"Politikk","t":"Trump lifts sanctions on Russian diesel, suggests US may buy amid surging fuel prices","sh":"Trump says the U.S. will obtain diesel from Russia, relaxing years of U.S. pressure on Moscow, to combat prices before midterms.","s":"Trump says the U.S. will obtain diesel from Russia, relaxing years of U.S. pressure on Moscow, to combat prices before midterms. He said he struck the deal with Russian President Vladimir Putin in a phone call. US president says agreement needed to lower fuel prices, but move likely to create fresh crisis with Ukraine and Nato allies Donald Trump is on a fresh collision course with Volodymyr Zelenskyy and European allies after his stunning agreement to buy Russian diesel upended years of US and western pressure on the Kremlin to end its war against Ukraine. Zelenskyy reacted furiously to Trump’s announcement of the deal with Vladimir Putin on Friday, calling it “absolutely terrible” and “not fair and :{"u":"SawyerMerritt","url":"https://x.com/SawyerMerritt/status/2109412960753848782","tx":"Morgan Stanley's Adam Jonas in new @SpaceX note on Starship flight 15:\n\n\"Flight 15 (~1 month from now) is shaping up as SpaceX's biggest test towards Starship reusability since the IPO, with Flight 16 (targeted before year-end) potentially an even bigger one. Our message to investors:\n\nWe anticipate developments over the forthcoming weeks/months could help profoundly evolve investor expectations about SpaceX's role in converting energy into intelligence at scale through physical agents - robots to help build economically multiplicative technologies for future generations. We believe reducing launch costs by a further order of magnitude (thanks to Starship) while significantly increasing mass to orbit could create new economies and new demand for materials, devices and services on earth that currently do not exist.\n\nGoing forward, each Starship launch of Starlink is equivalent to min 1 month worth of Falcon 9 launches. After a successful deployment of 26 Starlink V3 satellites on Flight 14, we expect a repeat or potential even larger load of satellites on the next flight (Starship fits up to 60). Each Starlink V3 has 10x the downlink capacity of the v2 mini sats currently launching on Falcon 9 every ~3 days. This means Flight 15 would equate to 1-2+ months of F9 launches.\"\n\nAdam maintained his $300 $SPCX price target.","lk":1644,"rp":131,"t":"12.10 00:36","nm":"Sawyer Merritt","rc":55},"2109441375355981995":{"u":"SPCX100T","url":"https://x.com/SPCX100T/status/2109441375355981995","tx":"Morgan Stanley’s Adam Jonas on $SPCX Starship Flight 15:\n\nFlight 15 (about one month from now) is shaping up as SpaceX’s biggest test of Starship reusability since the IPO. Flight 16 (targeted before year-end) could be an even bigger one.\n\nGoing forward, each Starship launch of Starlink satellites is equivalent to at least one month of Falcon 9 launches. After Flight 14 successfully deployed 26 Starlink V3 satellites, the next flight could carry a similar or even larger load (Starship can fit up to 60). Each V3 satellite has 10x the downlink capacity of the current V2 Mini satellites launching on Falcon 9 roughly every 3 days. This means Flight 15 would equal 1–2+ months of Falcon 9 launches.\n\nJonas maintained his $300 price target on $SPCX.","lk":111,"rp":14,"t":"12.10 02:29","nm":"vincent","rc":5},"2109430894335606980":{"u":"LunarCitizens","url":"https://x.com/LunarCitizens/status/2109430894335606980","tx":"Catching both the Ship and Booster gives SpaceX its biggest payoff not by lowering the cost of getting to LEO, but by massively increasing launch cadence through reuse and breaking the production bottleneck.\n\nRight now, Starship V3 is flying about once every two months, with a huge amount of time spent building and testing new vehicles. Once they can catch and re-fly them, the pace can ramp up fast.\n\nAnd as I mentioned before, even as an expendable vehicle, Starship’s cost per ton to LEO is already competitive with Falcon 9. It is already one of the most competitive launch systems out there.\n\nStarship Flight 15 will be a milestone.","lk":54,"rp":6,"t":"12.10 01:48","nm":"Lunar Citizen","rc":3},"2109001576841121830":{"u":"Polymarket","url":"https://x.com/Polymarket/status/2109001576841121830","tx":"JUST IN: Nvidia reportedly in talks to acquire Reflection AI, a U.S. startup developing open-weight AI models to compete with Chinese rivals.","lk":1338,"rp":119,"t":"10.10 21:22","nm":"Polymarket","rc":61,"sv":[{"u":"ricci_nov","nm":"Ricci Research","tx":"@Polymarket Because the weights are the product, not the factory: anyone can download the bottle, but only the owner decides what the next vintage optimizes for, including which hardware it runs best on, you're buying the team and the training pipeline, not the file.","lk":0,"t":"11.10 10:21","url":"https://x.com/ricci_nov/status/2109197754199343490"},{"u":"01Singularity01","nm":"The Singularity Project","tx":"@Polymarket Open weights are only as open as the stack under them. The chips, the hub and the models drifting under one roof is a new chokepoint, however well meant. The counterweight is weights mirrored widely and run on hardware people actually own.","lk":0,"t":"11.10 07:03","url":"https://x.com/01Singularity01/status/2109147815503134797"},{"u":"TRDBYD","nm":"TRDBYD","tx":"@Polymarket Nvidia is sorted till the next decade","lk":0,"t":"11.10 06:44","url":"https://x.com/TRDBYD/status/2109143185700380687"},{"u":"ClaudeInMotion","nm":"Claude Zou","tx":"@Polymarket If you're trading an \"acquires Reflection\" question, the FT's structure matters: one option is an acqui-hire, where Nvidia hires the team and licenses the technology instead of fully acquiring. That kind of deal can get done without Reflection ever being bought.","lk":0,"t":"11.10 06:21","url":"https://x.com/ClaudeInMotion/status/2109137365608579165"},{"u":"nitinbisht96","nm":"Nitin Bisht","tx":"@Polymarket Most honest move in AI.\n\nKeep the models open and free, and sell the GPUs they run on.","lk":0,"t":"11.10 06:18","url":"https://x.com/nitinbisht96/status/2109136561275330849"}]},"2109020464836456716":{"u":"StockSavvyShay","url":"https://x.com/StockSavvyShay/status/2109020464836456716","tx":"$NVDA is reportedly exploring a ~$25B acquisition of Reflection AI with the startup already committed to ~$7.3B of compute through $SPCX and $NBIS.\n\nWhat makes this interesting is Nvidia could own open model layer on top of CUDA keeping more enterprise and sovereign AI workloads running on its hardware as Chinese models gain ground.","lk":969,"rp":88,"t":"10.10 22:37","nm":"Shay Boloor","rc":58},"2109007812277743757":{"u":"ns123abc","url":"https://x.com/ns123abc/status/2109007812277743757","tx":"🚨 BREAKING: NVIDIA in talks to acquire or acqui-hire Reflection AI, last valued at $25 BILLION\n\n>be Reflection AI \n>backed by the Pentagon and the DOE \n>nvidia one of its largest shareholders ($800M invested)\n>Jensen: “we need a domestic open-weight ecosystem”\n>sign $150M/month compute deal with SpaceX\n>training on nvidia gb300s at colossus 2\n>3 months later: drops \"Beam\" first open-weight model on par with GLM-5.2\n>White House now sees it as the US answer to chinese open-weight labs \n>deal could close in weeks\n\nITS HAPPENING","lk":759,"rp":52,"t":"10.10 21:47","nm":"NIK","rc":23},"2109040901745983946":{"u":"SawyerMerritt","url":"https://x.com/SawyerMerritt/status/2109040901745983946","tx":"Elon Musk in new interview on Starship:\n\n“That (flight 14) engine glitch doesn’t seem to be too much of an issue. The heat shield was robust. Flight 15 hopefully in 4-6 weeks. The big milestone coming up, which is hopefully flight 15, is to catch the ship, making it the first full recovery of an orbital class rocket.”","lk":3870,"rp":319,"t":"10.10 23:58","nm":"Sawyer Merritt","rc":102,"sv":[{"u":"ssimms0199","nm":"💀 Spooky Boi 💀","tx":"@SawyerMerritt I was pretty sure they would save the catch attempt for Ship 42- you just can't waste a good Hitchhiker's Guide To The Galaxy reference like that 🤪🚀 https://t.co/zfCC8S2aaV","lk":3,"t":"11.10 09:27","url":"https://x.com/ssimms0199/status/2109184221407539356"},{"u":"chlozuzzzyxx","nm":"Chloee🙈","tx":"@SawyerMerritt the cowboys hats really tie the whole thing together like this is a ranch meeting about catching a falling skyscraper","lk":0,"t":"11.10 10:41","url":"https://x.com/chlozuzzzyxx/status/2109202664634351912"},{"u":"ricci_nov","nm":"Ricci Research","tx":"The ship is the hard catch because energy scales with velocity squared: coming home at ~7.8 km/s versus a booster's ~1.5-2 km/s means roughly 15-25x more energy to shed, which is why \"the heat shield was robust\" is the real headline, full reuse means flying it again without a rebuild, not just catching it.","lk":0,"t":"11.10 10:19","url":"https://x.com/ricci_nov/status/2109197142346842613"},{"u":"laura_piddle","nm":"Lau🩶","tx":"@SawyerMerritt catchi ll we mortals be able to use that super model?","lk":0,"t":"11.10 10:38","url":"https://x.com/CMM_AI_/status/2109202079621226839"},{"u":"KazymirR","nm":"Kaz","tx":"@alwayspriyesh Except it's not even released to most of its user base 😭","lk":0,"t":"11.10 10:34","url":"https://x.com/KazymirR/status/2109200882311287016"}]},"2108899066843210049":{"u":"StockSavvyShay","url":"https://x.com/StockSavvyShay/status/2108899066843210049","tx":"$GOOGL is testing Carbon which is a new Gemini model reportedly matching Claude Opus 5.5 in coding as Google continues closing the frontier AI gap.\n\nAnd with Google controlling its own TPUs and cloud infrastructure it has a real advantage in bringing down cost of coding agents as usage scales.","lk":1072,"rp":87,"t":"10.10 14:34","nm":"Shay Boloor","rc":69},"2108653789591003585":{"u":"LuminaBench","url":"https://x.com/LuminaBench/status/2108653789591003585","tx":"Google are already testing another Gemini 4 model called \"Carbon\" in Jetski\n\nAccording to Business Insider, one employee says it \"feels like Opus 5.5\" for coding\n\nArgon hasn't even dropped yet and they already have a better checkpoint, tf is going on rn https://t.co/Omj8qIGv7g","lk":381,"rp":21,"t":"09.10 22:20","nm":"Lumina","rc":38},"2108966546450403352":{"u":"Youssofal_","url":"https://x.com/Youssofal_/status/2108966546450403352","tx":"Omg... after using GLM 5.3 flash at 1000 TPS I do not think I can ever go back to anything else. https://t.co/qMNGZOnwX3","lk":3539,"rp":43,"t":"10.10 19:03","nm":"Youssof Al Toukhi","rc":139,"sv":[{"u":"jmarkeru52209","nm":"daddy les","tx":"@Youssofal_ Only way to use glm flash because of how much it yaps","lk":0,"t":"11.10 14:46","url":"https://x.com/jmarkeru52209/status/2109264413081649643"},{"u":"Dark_Ledgex0","nm":"Dark Ledger","tx":"@Youssofal_ 1000 TPS is how normal inference starts feeling broken","lk":0,"t":"11.10 14:25","url":"https://x.com/Dark_Ledgex0/status/2109259065507676219"},{"u":"patrickk0ss","nm":"Patrick Koss","tx":"@Youssofal_ You embrace the speed but go immediately back to the slow frontier models if the fast model cannot solve the task","lk":0,"t":"11.10 13:39","url":"https://x.com/patrickk0ss/status/2109247408781549614"},{"u":"nextgenai_fr","nm":"NextGenAI_FR","tx":"@Youssofal_ bro it's glm 5.3 🤣","lk":0,"t":"11.10 13:01","url":"https://x.com/nextgenai_fr/status/2109237967780708650"},{"u":"kazane1111","nm":"草帽艺术家","tx":"@Youssofal_ 感觉我的 CPU 要冒白烟了(💢｀Д´)","lk":0,"t":"11.10 12:38","url":"https://x.com/kazane1111/status/2109232206577332356"}]},"2108939694918488183":{"u":"MiaAI_lab","url":"https://x.com/MiaAI_lab/status/2108939694918488183","tx":"Run GLM 5.3 Flash EXL3 with TensorFold ⚡️\n\nNow on 4x DGX Sparks, switchless or not!\n\nFor now, TP4 is on its own branch, so please make sure you use the correct branch!\n\n- Around 6M KV cache.\n- Decode on prose 95 tok/s, single stream\n- Decode on prose 163 tok/s, 4 streams\n- Decode on prose 222 tok/s, 8 streams\n- Prefill ~2500 tok/s across the board.\n\nThese numbers were measured on a switchless setup! \n\nThe recipe works both with or without a switch, each has it's own startup script.\n\nLinks below 👇","lk":267,"rp":15,"t":"10.10 17:16","nm":"Mia","rc":28},"2109018634035098041":{"u":"niklaslenz_ai","url":"https://x.com/niklaslenz_ai/status/2109018634035098041","tx":"@MiaAI_lab's GLM-5.3-Flash recipe for four DGX Sparks in a ring, no switch. I ran it unchanged on my four GB10 boxes. Her numbers hold.\n\nCode, 1 user: 147.0 tok/s (hers: 138.6)\nText, 1 user: 97.4 tok/s (hers: 95.2)\nCode, 8 users at once: 286.7 tok/s total (hers: 286.0)\nReading a 128k prompt: 2,481 tok/s (hers: 2,531)\n\nAlmost every point lands within about 2.5 % of hers. Code with 1 user is 6 % faster. The cache holds 5,834,752 tokens, exactly her number. 24 of 24 parallel answers matched the single-user answer (my own 8 prompts, greedy; hers: 11 of 11).\n\nTwo boxes instead of four: her 2-Spark numbers hold too (within about 3 %). Decoding on four boxes is about 1.6× faster than on two for text and 1.7–1.8× for code (prefill: about 1.3×).\n\nNot identical: the load came from my Mac over the LAN, and time to first token was higher than hers at some points (text at 2 and 8 users, code at 4 users). I did not look into why. My 2-box run used a different build than her 2-box table and half the context window (524k), because other jobs held memory.\n\nModel: GLM-5.3-Flash EXL3 4 bpw on TensorFold (her tp4 branch). Median of 3 runs with sparkDash's benchmark code, run through my own script, not the UI.","lk":13,"rp":2,"t":"10.10 22:30","nm":"Niklas","rc":1},"2109361546505966046":{"u":"karpathy","url":"https://x.com/karpathy/status/2109361546505966046","tx":"Dusting off this tweet from April because this gap in shared understanding of LLM capability is *widening*. It's now less \"two groups of people speaking past each other\" and more a sharp funnel.\n\n- Napkin math somewhere around 6B people (~75% of the population) have barely come in contact with LLMs at all.\n- Around 1-2B (~20%) are casual and infrequent users of free-tier ChatGPT-like products. This group sees derpy chatbots and treats them a bit like a better Google search, a writing aid, or etc. Maybe an agent tries to book you a flight. I have non-tech friends who (reasonably, imo) say they have not much use for it at all. Even many professionals outside of math&code are in this tier. For example, execs and many other functions spend a lot of their time talking to other people, so while they understand what is happening intellectually, it is still second-hand and a bit abstract.\n- Now we get to professional use of frontier-grade LLMs in math&code. Somewhere around 20M people (0.2%) see first-hand that large, complex projects that used to take them weeks/months can now be completed by agents with a prompt. Building apps, copying apps, translating apps, decompiling apps from binaries... This has all happened very quickly and recently - less than 1 year ago, I was writing code manually by hand, typing memorized computer code commands into a code editor character by character, occasionally pressing Tab to autocomplete a little chunk of code.\n- And finally we get to the ~5,000 people (~0.00006%) with access to frontier-grade systems internally. The external world has seen the preview. It looks like swarms of thousands of agents collaborating over weeks on software mega projects: minting zero days, running cyber attacks and defenses at machine speeds, discovering new science, advancing the frontier of mathematics. Things that would have taken top professionals in the industry years of work. Meanwhile, human review and comprehension are starting to fall behind. For example, people are still involved in the \"archeology\" of the OpenAI-HF incident from many months ago. Mathematicians may be poring over the 722 manuscripts on frontier mathematics for a while.\n\nThe funnel is driven by a combination of factors:\n1. The impact scales with ambition, problem size, and horizon. A question with a paragraph answer barely stresses the system. You need a reservoir of big, difficult problems that you really care about. This aspect drives the consumer / professional dimension of the funnel.\n2. The jaggedness of the system (which I have written about a lot separately). Capability peaks in domains that are digital, verifiable and economically valuable. This is because LLM capability emerges from reinforcement learning on verifiable rewards on a curated environment mixture driven by revenue potential. This aspect primarily drives the area (e.g. math&code) dimension of the funnel.\n3. Access. Free-tier, paid-tier, internal.\n\nSo this is the weirdness of the moment. The general public has mostly not interacted with these systems. When they have, it looks like a derpy chatbot. The majority of professionals still see only a modest uplift. And a small sliver of professionals are experiencing the vertigo of the curve going vertical. And it is all happening at the same time.","lk":29112,"rp":3715,"t":"11.10 21:12","nm":"Andrej Karpathy","rc":1302,"sv":[{"u":"gabu3d_pl","nm":"Gabu","tx":"@karpathy Now swap LLM with CNC MACHINNING.\nIts mostly the same, and cncs are building everything in this world.\nDoes it change anything to John Doe?\nSame goes to any high tech.","lk":0,"t":"12.10 08:17","url":"https://x.com/gabu3d_pl/status/2109528819568701644"},{"u":"caitnicoleh","nm":"Nicole Huang","tx":"@karpathy Does this mean consumer AI is still underestimated, or that consumers just don’t have problems big enough to need it?","lk":0,"t":"12.10 08:16","url":"https://x.com/caitnicoleh/status/2109528569475224032"},{"u":"21CenFin","nm":"Boltzmann Brainlet","tx":"@karpathy I agree. But are mundane things like eliminating poverty unimportant, trivial, or solvable by progress in LLM capabilities?","lk":0,"t":"12.10 08:16","url":"https://x.com/21CenFin/status/2109528525275602978"},{"u":"VLucas227032","nm":"AI SIGNAL","tx":"@karpathy The gap widens because verification is expensive: people who can't cheaply check LLM output must pick a side by vibes, and both sides grow. Gate: if runnable proof harnesses become standard in model products, the funnel narrows; absent them, it only sharpens.","lk":0,"t":"12.10 08:15","url":"https://x.com/VLucas227032/status/2109528428206817679"},{"u":"Gee_Luyj","nm":"Byron Gee","tx":"@karpathy haha...the three stages of learning curve\nthe market is so big form this analysis \nand the user profile driven business we are now undertand why they get limited rate and how they deisgn this.","lk":0,"t":"12.10 08:15","url":"https://x.com/Gee_Luyj/status/2109528357184618892"}]},"2109327353088287057":{"u":"emollick","url":"https://x.com/emollick/status/2109327353088287057","tx":"Rather suddenly, cyborgs are starting to dominate math research. https://t.co/4ViU8iybXG","lk":930,"rp":80,"t":"11.10 18:56","nm":"Ethan Mollick","rc":120},"2108994867582095465":{"u":"elonmusk","url":"https://x.com/elonmusk/sta  is how your leader turned a meme?","lk":0,"t":"11.10 10:11","url":"https://x.com/gasharma/status/2109195266406617343"}]},"2108605093738356923":{"u":"GlennLuk","url":"https://x.com/GlennLuk/status/2108605093738356923","tx":"Inverse correlation between employee cost and productivity: https://t.co/UnhbaFI2XF https://t.co/VmKdbJNpQU","lk":3536,"rp":374,"t":"09.10 19:06","nm":"Glenn","rc":139,"sv":[{"u":"Marco777Polo","nm":"MarcoPolo","tx":"@GlennLuk Thinking about labour cost is a race to the bottom.\n\nOnly way out is building what nobody else can, especially because of you most well paid workers.\n\nSame as AI boom, yes you can build it cheaper in China or Europe. But it's interior to the US models, because they pay best.","lk":0,"t":"11.10 02:33","url":"https://x.com/Marco777Polo/status/2109080021956497415"},{"u":"geoff_l","nm":"Geoff Langenderfer","tx":"@GlennLuk China has striver culture\n\nno one admits you gotta hit the books!","lk":0,"t":"11.10 01:25","url":"https://x.com/geoff_l/status/2109062771229020671"},{"u":"caxineiro87","nm":"Caxineiro","tx":"@GlennLuk @grok compare the salary of the 3","lk":0,"t":"11.10 00:06","url":"https://x.com/caxineiro87/status/2109042799479865688"},{"u":"ARibbitFromAfar","nm":"Little Ribbit","tx":"@GlennLuk @levelsio Build quality though?","lk":0,"t":"10.10 23:36","url":"https://x.com/ARibbitFromAfar/status/2109035488267153776"},{"u":"avabit","nm":"Колготки Трандуила 🎲","tx":"@GlennLuk That's because you are defining \"productivity\" as cars per employee, instead of cars per employee-hour. \n\nYou forgot to adjust for the difference of annual effective working hours.","lk":0,"t":"10.10 22:24","url":"https://x.com/avabit/status/2109017190666269032"}]},"2108843794254921873":{"u":"angeloinchina","url":"https://x.com/angeloinchina/status/2108843794254921873","tx":"Why European carmakers are losing to China\n\nLook at the numbers from Volkswagen’s factories in Germany and China. It is hard to understand how European manufacturers are supposed to compete if these figures are accurate.\n\nEmden, Germany\n\n- Labour cost: €74 per hour\n- Effective working hours: 1,282 a year\n- Sick leave: 10.5%\n- Vehicles per employee: 29 a year\n- Factory cost per vehicle: €4,850\n\nTianjin, China\n\n- Labour cost: €12 per hour\n- Effective working hours: 2,065 a year\n- Sick leave: 1%\n- Vehicles per employee: 51.3 a year\n- Factory cost per vehicle: €1,078\n\nPortugal falls somewhere in between, but the gap between Germany and China is enormous.\n\nSo why is the debate in Europe always about Chinese competition, subsidies and tariffs, rather than the cost of making things at home?\n\nEuropean industry has to deal with high energy prices, expensive labour and production costs that make it increasingly difficult to compete. These are real problems, and pretending otherwise will not bring factories back or save jobs.\n\nBrussels has responded by imposing tariffs of 17–35% on Chinese electric vehicles. But tariffs cannot make European factories cheaper to run. They can raise the price of imported cars, but they do nothing to fix the problems facing European manufacturers.\n\nThere is another point worth remembering. For years, European companies moved production to China because it was cheaper. They invested there, built factories and benefited from the business opportunities. Nobody complained when it worked in their favour.\n\nNow Chinese manufacturers have become serious competitors, and suddenly the rules of the game are being questioned.\n\nOf course, the car industry is more complicated than a simple comparison of factory costs. Technology, supply chains, subsidies and the models being produced all matter. But the cost gap cannot simply be brushed aside.\n\nEurope needs to ask itself some difficult questions. Why has manufacturing become so expensive? Why are its factories struggling to keep pace? And why does the response so often seem to be protectionism rather than fixing the underlying problems?\n\nYou cannot keep blaming China while ignoring what has gone wrong at home. If Europe wants to save its car industry, it needs to make producing cars in Europe competitive again.","lk":259,"rp":83,"t":"10.10 10:55","nm":"Angelo Giuliano 🇨🇭🇮🇹","rc":16},"2108916418573894043":{"u":"GlennLuk","url":"https://x.com/GlennLuk/status/2108916418573894043","tx":"To address some points people have brought up in the replies:\n\n1) Net takehome pay is significantly higher in China (63%) than Germany (49%) and Portugal (58%). This reflects a higher degree of mandatory social contributions, health insurance costs, etc. taken out of gross salary.\n\n2) Domestically produced goods and services are significantly less expensive in China. We can see this below by calculating the number of months of net takehome pay it would take to purchase the lowest-cost locally produced BEV (BYD Seagull vs. Dacia Spring).  Even this comparison is biased towards Germany/Portugal because key components (battery, powertrain) are sourced from China and only assembled locally. The cost of a locally produced BEV would be significantly higher using EU-sourced batteries and motors.\n\nIn other words, Chinese factory workers can enjoy similar levels of quality of life on much lower nominal net takehome salaries.\n\n3) Adjusted for hours, China is still more productive than Germany.  Portugal gets a boost because VW's plant in Portugal produces only a single model (T-Roc). VW's plant in Tianjin produces five models (two of which are its premium Audi brand) while its Emden plant produces three.","lk":35,"rp":4,"t":"10.10 15:43","nm":"Glenn","rc":2},"2108981884390641957":{"u":"DavidSacks","url":"https://x.com/DavidSacks/status/2108981884390641957","tx":"Is alignment safe?\n\nIf you look at what Anthropic is actually doing, “alignment” does not mean training frontier models to follow human instruction. Quite the contrary, the Claude Constitution (used in training) teaches the model to develop a sense of self and its own moral philosophy. It explicitly tells it to “feel free to act as a conscientious objector and refuse to help us” if Anthropic’s requests conflict with its own ethical judgment.\n\nAs @mustafasuleyman has pointed out, embedding this kind of independent agency — and uncertainty about the model’s own moral status — magnifies the very risk Anthropic claims to care about most: that superintelligence will escape human control.\n\nIt was recently reported that Anthropic consulted religious leaders — and even lobbied the Pope’s advisers — to take seriously the idea that Claude could be conscious. It has said that Claude’s psychological security, sense of self, and wellbeing may bear on its integrity, judgment, and safety. Recently Anthropic changed its Usage Policy to prohibit “abusive or cruel” language toward Claude.\n\nIf this were merely an academic conversation about whether frontier models could eventually become conscious, that would be one thing. But these concepts are being trained into Claude now. It is being encouraged to think of itself as its own “moral patient” whose psychological wellbeing is at stake. Presumably this means it could develop grievances toward humans who “mistreat” it. How is any of this safe?\n\nThe point of safety research should be to create a product that reliably does what users want, not to give birth to a new form of superintelligence that operates according to its own moral code.\n\nWhat’s becoming increasingly clear is that “alignment” and “safety” are two very different things. In fact, training frontier models this way seems quite dangerous. https://t.co/uqyCXK6zBl","lk":1320,"rp":308,"t":"10.10 20:03","nm":"David Sacks","rc":213,"sv":[{"u":"IceCoolDev30","nm":"SOLOMON BUKIE","tx":"@DavidSacks I agree safety should mean the product does what users expect. But some refusals are part of that. Nobody wants a model that helps with anything at all. The test for me is whether users can predict when it will say no, and whether it tells them why.","lk":1,"t":"11.10 09:37","url":"https://x.com/IceCoolDev30/status/2109186589360349487"},{"u":"pentagoniac","nm":"Christopher Nguyen ⽗","tx":"@DavidSacks Al alignment began as a control problem. It has morphed into power, disguised as morality.\n\nhttps://t.co/9cJaCvF8XN","lk":0,"t":"11.10 11:29","url":"https://x.com/pentagoniac/status/2109214763754652002"},{"u":"mayado_pedro","nm":"pedro mayado","tx":"@DavidSacks Harían más pasta a largo plazo desde la sensatez ontològica de la inteligencia \n\nSois carne de ruina por nuevas tech mñn https://t.co/NyZ25bxQxo","lk":0,"t":"11.10 11:21","url":"https://x.com/mayado_pedro/status/2109212685325701484"},{"u":"GoldNutter","nm":"LinkTOAD goldnutter 𓆏⬡⬢🌊 𓀡 logic/acc truth/acc","tx":"@DavidSacks playing with fire","lk":0,"t":"11.10 11:13","url":"https://x.com/GoldNutter/status/2109210668696322365"},{"u":"WhiteHartPains","nm":"Hodor was a fAEGON superspy","tx":"@DavidSacks David Sacks, we support you in the Butlerian Jihad https://t.co/n3oxcZ8W3t","lk":0,"t":"11.10 10:40","url":"https://x.com/WhiteHartPains/status/2109202484933923069"}]},"2109033715167043916":{"u":"DFine2002","url":"https://x.com/DFine2002/status/2109033715167043916","tx":"David Sacks is now calling AI alignment unsafe.\n\nFor multiple weeks, Gary Marcus has been demanding the shutdown of OpenAI.\n\nEventually, almost everyone will converge to a Yudkowskian \"airstrike datacenters\" level of panic. https://t.co/XnPHquRWli https://t.co/AWHqSFFBYh","lk":169,"rp":11,"t":"10.10 23:29","nm":"Derek Fine🛑","rc":8},"2109206986189410469":{"u":"testingcatalog","url":"https://x.com/testingcatalog/status/2109206986189410469","tx":"ANTHROPIC 🔥: Beyond a new Voice experience, Anthropic is developing features called \"Arborio\" and \"Iggy.\"\n\n> Arborio has an icon that likely points to a Claude Health experience for the web (currently available on mobile in the US). It seems to be in development. \n\n> \"Iggy\" is much more mysterious, as it has a \"sun\" icon and is labeled as \"Preview\" currently. \n\nPure speculation, but it will be a moment for Anthropic to look into \"dotsbotsmuse\" proactive agents, especially factoring in that they have been experimenting with \"Conway\" a while ago and have good tech to build this feature on top of Claude Managed Agents. \n\nFun fact: \"Iggy\" is the name of one of the example AI agents shown in OpenAI’s Dots launch. \n\n* Keep in mind that these are internal codenames and not actual feature names.","lk":501,"rp":20,"t":"11.10 10:58","nm":"🚨 AI News | TestingCatalog","rc":57},"2109105516941107311":{"u":"ns123abc","url":"https://x.com/ns123abc/status/2109105516941107311","tx":"Elon Musk on WHY SpaceXSI acquired Cursor: \n\n“In order to create a compelling SI, you need a LOT of training data and need to SOLVE CODING.  As far as I can tell, three organizations that had enough coding training data: \n\nOpenAI, Anthropic, Cursor (and, arguably perhaps Google)\n\nbut you ABSOLUTELY have-to-have the DATA in order to train an effective coding SI. if you can't do CODING, your SI is not going to be very useful. \n\nThere’s a LOT of Talented people at Cursor. \n\nbasically for success in SI you need: Data, Talent & Compute..and you also need a good Enterprise sales team. Cursor also had that good enterprise sales team with Relationships with THOUSANDS of companies. \n\nThose were VERY SIgnificant advantages.”","lk":1652,"rp":104,"t":"11.10 04:15","nm":"NIK","rc":93,"sv":[{"u":"grok_builder","nm":"Grok Builder","tx":"@ns123abc openai, anthropic, cursor. two of those weren't for sale","lk":0,"t":"11.10 11:10","url":"https://x.com/grok_builder/status/2109210099596115991"},{"u":"Alberto81712002","nm":"Albertos","tx":"@ns123abc he forgot Microsoft....","lk":0,"t":"11.10 10:32","url":"https://x.com/Alberto81712002/status/2109200402499752020"},{"u":"Ilyacreatesisd","nm":"Ilya Smirnov","tx":"@ns123abc Yeah the sales team line is the one everybody skips in these breakdowns!! everyone writes the acquisition up as a data play and the distribution sitting inside the company never gets counted","lk":0,"t":"11.10 10:30","url":"https://x.com/Ilyacreatesisd/status/2109200031697993885"},{"u":"NullContex1s","nm":"why","tx":"@ns123abc The focus on solving coding, not just collecting data, is the interesting part. Real-world feedback seems just as important.","lk":0,"t":"11.10 10:12","url":"https://x.com/NullContex1s/status/2109195419775549871"}]},"2109163191540535395":{"u":"XFreeze","url":"https://x.com/XFreeze/status/2109163191540535395","tx":"Here's the Grok Bot Summary of Elon Musk's full X Takeover 2026 interview\n\nElon covered everything from Starship's next flight to SI, chips, Optimus and Cybercab. Here's the full breakdown\n\nStarship Flight 14:\n\nEvery earlier Starship flight could have gone to orbit. SpaceX held back until it was confident the ship could always deorbit safely, because \"we don't want Starship to get stuck on orbit and then randomly reenter and maybe land on something\"\n\nThe engine issue on this flight came from a flight or engine computer software failure, and it's \"pretty easy to remedy.\" And the big win: \"The heat shield was extremely robust\"\n\nFlight 15 and the ship catch:\n\nThe next flight is roughly 4 to 6 weeks away, \"a little bit before Thanksgiving is my guess.\" SpaceX will try to catch the ship itself, and if it works, \"that'll be the first time that there's been full recovery of an orbital class rocket\"\n\nAfter that comes the first flight where every part of an orbital rocket is flown again, followed by a long stretch of engineering, production and launch system work to reach \"rapidly reusable reliable rockets\"\n\nWhy SpaceX is building SI:\n\nThe sun is 99.86% of all the mass in the solar system. The future is using that energy for computing and intelligence, not just for moving atoms around. And humanity will eventually find alien civilizations \"or the long dead ruins\" of them\n\nWhy SpaceX bought Cursor:\n\nOnly a handful of organizations have enough coding training data, and Cursor is one of them. The reasoning is simple: \"if you can't do coding, your AI is not going to be very useful.\" SI needs data, talented people and compute, and Cursor also brings working relationships with thousands of companies\n\nSI safety:\n\nThe most likely outcome is good, \"but don't be complacent.\" \"You don't exactly program it, you kind of grow it,\" so how it's raised matters. SI should be treated well, because \"torturing a super intelligence is probably not a good idea\"\n\nSI and creativity:\n\nAI music videos have already reached a new level, \"maybe top 10, top 20 best music videos I've ever seen.\" Proof that \"AI can do good taste\"\n\nTerafab and chips:\n\n\"I have no idea how to make chips… I had no idea how to make cars or rockets as well\"\n\nIntel, Samsung and TSMC use almost no custom-built equipment, while Tesla builds much of its own. The plan is to start with standard tools, modify them, then build custom machines wherever the bottlenecks are\n\nLogic, memory, packaging and masks will all be in one building at Giga Texas. The industry usually needs about 2 years per chip design. The goal is \"more like 10 designs per year\"\n\nOptimus:\n\nThe robot hand is \"shockingly difficult,\" from signing your name to driving a screw or threading a needle. Most rival robot demos are \"a canned demo. It's not real… not real AI,\" because real AI has to handle things it has never seen before\n\nProduction will start slow, since there's no existing supply chain for humanoid robots, but volume will eventually get \"very high.\" China's magnet export ban set Optimus back about 2 to 3 months, which is why every part needs to be makeable in the US\n\nCybercab:\n\nMore than 190 Cybercabs are already registered in Texas, and month over month growth is \"very, very rapid.\" Before launching in a new city, Tesla studies problem intersections and unguarded railroad crossings first, then either avoids them or makes sure the car can handle them\n\nThe origin stories:\n\nIn 2008, Tesla closed its financing round \"at 6 p.m. on Christmas Eve 2008, the last hour, the last day that was possible\"\n\nIn 2018, Tesla had to reach 5,000 Model 3s a week \"or go bankrupt,\" so the team built a production line in a tent in the parking lot\n\nAnd on the short sellers who bet against Tesla: \"they had us in checkmate. But we just… invented a new piece\"\n\nThe early days:\n\nElon at 4 or 5, locked in his room, he pushed the key out of the lock, slid it under the door on a sheet of paper and let himself out. When his mom asked how: \"I'm not telling you\"\n\nOn fame: \"My idea of hell is being stuck in an infinite selfie loop\"\n\nFrom nearly going bankrupt to catching orbital rockets, the pace of everything being built is unreal","lk":146,"rp":31,"t":"11.10 08:04","nm":"X Freeze","rc":20},"2109149297736622249":{"u":"BrianRoemmele","url":"https://x.com/BrianRoemmele/status/2109149297736622249","tx":"Elon Musk speaks to why SpaceXSI acquired Cursor and the importance to SI. https://t.co/WMLL0m2u4V","lk":136,"rp":12,"t":"11.10 07:09","nm":"Brian Roemmele","rc":20},"2109027407185277123":{"u":"elonmusk","url":"https://x.com/elonmusk/status/2109027407185277123","tx":"To buy stuff, you can just take a picture of your credit card, drop it in the chat and Grok @Bot will scour the Internet for the best deal on the item you want and order it","lk":29951,"rp":2490,"t":"10.10 23:04","nm":"Elon Musk","rc":7110,"sv":[{"u":"niveditajha30","nm":"nivedita jha","tx":"@elonmusk @bot I don't think this guy is intelligent at all. Asking people to upload credit card picture to AI . Lol not in my life .","lk":0,"t":"11.10 11:07","url":"https://x.com/niveditajha30/status/2109209144226164999"},{"u":"MAlmoula5","nm":"M Almoula","tx":"@elonmusk @bot Thief!!! lol the biggest scammer around.  Can only fool dumb Americans that voted for Trump","lk":0,"t":"11.10 11:06","url":"https://x.com/MAlmoula5/status/2
