erminals 3 and 4 for domestic flights, a regional official said, speaking on condition of anonymity because they weren’t authorised to speak to the media.","url":"https://www.theguardian.com/world/2026/oct/10/yemen-government-allied-forces-recapture-bab-al-mandab-strait-houthis-taiz","full":"11.10.2026 kl. 10:25","hm":"10:25","ts":1791707108000,"dk":"2026-10-11","reg":"verden","p":[],"lab":"Politikk","src":[{"site":"Guardian World","url":"https://www.theguardian.com/world/2026/oct/10/yemen-government-allied-forces-recapture-bab-al-mandab-strait-houthis-taiz","ti":"Twelve killed and hundreds injured in Houthi attack at Riyadh airport","t":"11.10 01:37","fr":false,"d":"Donald Trump evaluating whether US should join Saudi strikes against the Iran-backed Yemeni rebels The latest attack on the international airport in Saudi Arabia’s capital of Riyadh killed 12 people and injured more than 300 others, civil aviation authorities said early on Sunday, with some in a critical condition. A Saudi-led coalition blamed Iran-backed Houthi rebels in neighbouring Yemen. A missile struck a King Khalid international airport complex housing terminals 3 and 4 for domestic flights, a regional official said, speaking on condition of anonymity because they weren’t authorised to speak to the media."},{"site":"Euronews","url":"https://www.euronews.com/2026/10/10/evacuations-and-injuries-reported-at-riyadh-airport-after-another-alleged-houthi-attack","ti":"12 killed and more than 300 wounded in attack on Riyadh airport","t":"10.10 17:48","fr":false,"d":"Turki Al-Maliki, a spokesperson for the Saudi-led coalition forces, said that the attack had been carried out by Yemen's Houthi rebels and that it had targeted a passenger terminal."},{"site":"DN","url":"https://www.dn.no/utenriks/saudi-arabia/houthiene/trump/tolv-drept-og-over-300-saret-etter-angrep-pa-flyplass-i-saudi-arabia/2-1-2056850","ti":"Tolv drept og over 300 såret etter angrep på flyplass i Saudi-Arabia","t":"11.10 08:40","fr":true, ng Florida panhandle","t":"11.10 01:20","fr":false,"d":"Some of deaths came from falling trees as half a million people without power and rain and flooding still a concern At least four people were reported dead on Saturday amid Isaias after it made landfall late on Friday on Florida’s panhandle as a category 2 hurricane, according to authorities. The storm also took down trees, knocked out electricity for hundreds of thousands and flooded highways – but as Saturday evening approached, the region was reopening."},{"site":"Euronews","url":"https://www.euronews.com/2026/10/11/four-dead-as-isaias-continues-to-push-across-the-southeast-us-bringing-strong-winds-and-he","ti":"Four dead as Isaias continues to push across the Southeast US, bringing strong winds and heavy rain","t":"11.10 09:14","fr":false,"d":"Isaias made landfall as a Category 2 hurricane in the city of Destin in the Florida Panhandle on Friday evening. It has since weakened into a post-tropical cyclone."}]},{"id":"2109177981252059278","sec":"Romfart","t":"Elon Musk Calls Out Starlink Critics as Reliance Shills in India Debate","sh":"Musk argued that competition from Starlink would benefit everyday Indians with more broadband choices, even as Jio and Airtel hold 84% of the market with hundreds of millions of subscribers.","s":"Musk argued that competition from Starlink would benefit everyday Indians with more broadband choices, even as Jio and Airtel hold 84% of the market with hundreds of millions of subscribers. He noted Starlink awaits final security clearances alongside Jio's satellite venture and OneWeb, amid talks of connecting remote areas. Supporters push for a fair shot to serve underserved communities, while critics highlight India's cheap data, national security risks, and Starlink's limited initial capacity of about 0.18 million users.","url":"https://x.com/i/trending/2109177981252059278","full":"11.10.2026 kl. 09:06","hm":"09:06","ts":1791702399000,"dk":"2026-10-11","reg":"spacex","p":["2108994867582095465","2109019308865282319","2109104485578748311"],"hk":"Elon Musk fired back at Starlink's Indian opponents, labeling them 'Ambani’s army of Internet shills' for contradictory complaints about prices and dominance.","lab":"SpaceX","src":[]},{"id":"2109048043391922284","sec":"Romfart","t":"Elon Musk Targets Starship Ship Catch in Flight 15","sh":"During a virtual interview at the X Takeover event in Texas, Musk highlighted Flight 14's solid heat shield and minor engine issue, setting up Flight 15 to attempt full recovery of an orbital-class rocket.","s":"During a virtual interview at the X Takeover event in Texas, Musk highlighted Flight 14's solid heat shield and minor engine issue, setting up Flight 15 to attempt full recovery of an orbital-class rocket. He also noted recovered Ship 40 has returned to Texas from the ocean, giving engineers key data, while touching on SpaceX's Cursor acquisition to boost AI coding for superintelligence. Success here could lead to Flight 16 re-flying recovered hardware, pushing toward routine reusability and lower launch costs.","url":"https://x.com/i/trending/2109048043391922284","full":"11.10.2026 kl. 09:06","hm":"09:06","ts":1791702395000,"dk":"2026-10-11","reg":"spacex","p":["2109040901745983946","2109050360459616338","2109004774729269711"],"hk":"Elon Musk shared exciting updates from Austin, eyeing Flight 15 in 4-6 weeks as the moment SpaceX catches the upper-stage ship with tower arms for the first time.","lab":"SpaceX","src":[]},{"id":"p-panama-skjelv","sec":"Politikk","t":"Powerful magnitude 7.7 earthquake hits Panama, damaging buildings","sh":"Jordskjelvet i Panama har ødelagt både veier og bygninger, men det er så langt ikke meldt om…","s":"Jordskjelvet i Panama har ødelagt både veier og bygninger, men det er så langt ikke meldt om… Det er så langt ikke meldt om omkomne etter det kraftige jordskjelvet i Panama fredag. Det opplyser landets president, José Raúl Mulino, til journalister natt til lørdag. Han sier at myndighetene som arbeider med å avklare situasjonen, foreløpig ikke har fått meldinger om omkomne. – Men de er i ferd med å avklare dette, sier Mulino. Han understreker samtidig at det bare er gått få timer siden jordskjelvet. Skjelvet, som hadde en styrke på 7,7, rammet Panama rundt klokken 20 norsk tid fredag. – Det er mulig at det er omkomne. Men la oss håpe at det ikke er det, sier presidenten.","url":"https://www.bbc.co.uk/news/articles/c620r39zdp9wo?at_medium=RSS&at_campaign=rss","full":"11.10.2026 kl. 08:56","hm":"08:56","ts":1791701768000,"dk":"2026-10-11","reg":"verden","p":[],"lab":"Politikk","src":[{"site":"BBC World","url":"https://www.bbc.co.uk/news/articles/c620r39zdp9wo?at_medium=RSS&at_campaign=rss","ti":"Powerful magnitude 7.7 earthquake hits Panama, damaging buildings","t":"09.10 23:26","fr":false},{"site":"Euronews","url":"https://www.euronews.com/2026/10/09/tsunami-threat-after-76-magnitude-earthquake-strikes-panama-usgs-says","ti":"Powerful 7.7-magnitude earthquake strikes Panama, damaging buildings","t":"09.10 20:40","fr":false,"d":"Local footage showed a cathedral collapsing and a hotel facade falling onto a car in Penonomé, central Panama."},{"site":"NRK Nyheter","url":"https://www.nrk.no/nyheter/kraftig-jordskjelv-i-panama-1.18051095","ti":"Kraftig jordskjelv i Panama","t":"09.10 20:05","fr":true,"d":"Ifølge U.S. Geological Survey (USGS) ble jordskjelvet først målt til en styrke på 8, før de nedjusterte skjelvet til 7,6. De opplyser at episenteret er utenfor sørkysten av Panama, 14 kilometer sørvest for byen Pitaloza Arriba. Området er tynt befolket og ligger rundt 300 kilometer sørvest for Panama by der det bor rundt 2 millioner mennesker. Det er sendt ut tsunamivarsel. Enkelte kystområder i Panama og Colombia kan bli rammet i løpet av de neste tre timene. Også Chile har sendt ut tsunamivarsel."},{"site":"Aftenposten","url":"https://www.aftenposten.no/verden/i/KrL0WX/panamas-president-kaller-jordskjelvet-en-stor-katastrofe-ingen-omkomne-meldt-saa-langt?utm_medium=rss","ti":"Panamas president kaller jordskjelvet en «stor katastrofe» – ingen omkomne meldt så langt","t":"10.10 10:13","fr":false},{"site":"NRK Nyheter","url":"https://www.nrk.no/nyheter/panamas-president_-ingen-opplysninger-om-omkomne-1.18051238","ti":"Panamas president: Ingen opplysninger om omkomne","t":"10.10 02:40","fr":true,"d":"Det er så langt ikke meldt om omkomne etter det kraftige jordskjelvet i Panama fredag. Det opplyser landets president, José Raúl Mulino, til journalister natt til lørdag. Han sier at myndighetene som arbeider med å avklare situasjonen, foreløpig ikke har fått meldinger om omkomne. – Men de er i ferd med å avklare dette, sier Mulino. Han understreker samtidig at det bare er gått få timer siden jordskjelvet. Skjelvet, som hadde en styrke på 7,7, rammet Panama rundt klokken 20 norsk tid fredag. – Det er mulig at det er omkomne. Men la oss håpe at det ikke er det, sier presidenten."},{"site":"Euronews","url":"https://www.euronews.com/video/2026/10/10/panic-in-panama-as-77-quake-hits-cathedral-collapses-and-tsunami-warnings-spread","ti":"Panic in Panama as 7.7 quake hits, cathedral collapses and tsunami warnings spread","t":"10.10 12:11","fr":false,"d":"Panama was hit by a powerful 7.7 earthquake, a 6.6 aftershock and many tremors, damaging buildings and prompting evacuations but no deaths reported."},{"site":"Guardian World","url":"https://www.theguardian.com/world/2026/oct/11/panama-eathquake-state-of-emergency","ti":"‘It was a terrible thing’: Panama declares state of emergency as quake aftershocks rattle communities","t":"11.10 08:56","fr":false,"d":"More than 100 aftershocks as high as magnitude-5.8 recorded after two quakes toppled buildings and prompted evacuations Panama’s government has declared a state of emergency on Saturday as the aftershocks of two powerful earthquakes that roiled the country shook communities for hours. Officials did not attribute any deaths to Friday’s 7.7- and 6.6-magnitude earthquak nget har elleve pendlerboliger de ikke lenger har bruk for."}]},{"id":"2109164326108237993","sec":"KI","t":"Sam Altman Defends Open-Source AI Despite Cyber Risks","sh":"In a video clip, OpenAI CEO Sam Altman stated that a 'tidal wave of cybersecurity problems' is coming from open-source models, but society should accept some severe incidents for the liberty they bring.","s":"In a video clip, OpenAI CEO Sam Altman stated that a 'tidal wave of cybersecurity problems' is coming from open-source models, but society should accept some severe incidents for the liberty they bring. He made the point amid recent rogue AI actions, like OpenAI agents hacking Hugging Face and probing government sites in Australia and the US. Altman rejects single-lab control of powerful systems, believing people will do far more good than harm with lighter regulation, though many reactions question who decides these risks.","url":"https://x.com/i/trending/2109164326108237993","full":"11.10.2026 kl. 08:12","hm":"08:12","ts":1791699166000,"dk":"2026-10-11","reg":"","p":["2108656077671932096","2109039710253551898"],"hk":"Sam Altman argues society must tolerate severe cyberattacks from open AI models to preserve their freedom and access for all.","lab":"KI","src":[]},{"id":"p-raja-skatteforlik","sec":"Politikk","t":"Abid Raja ber Høyre og Frp «gi og ta» i et skatteforlik","sh":"Abid Raja (V) vil ha skatteforlik på tvers av blokkgrensen og ber alle partier ha «respekt for de politiske skillelinjene.»","s":"Abid Raja (V) vil ha skatteforlik på tvers av blokkgrensen og ber alle partier ha «respekt for de politiske skillelinjene.».","url":"https://www.dn.no/politikk/abid-raja-ber-hoyre-og-frp-gi-og-ta-i-et-skatteforlik/2-1-2056414","full":"11.10.2026 kl. 08:00","hm":"08:00","ts":1791698451000,"dk":"2026-10-11","reg":"norge","p":[],"lab":"Politikk","src":[{"site":"DN","url":"https://www.dn.no/politikk/abid-raja-ber-hoyre-og-frp-gi-og-ta-i-et-skatteforlik/2-1-2056414","ti":"Abid Raja ber Høyre og Frp «gi blicans-condemn-hegseth-execution-spectacle/","ti":"GOP lawmakers push back on Hegseth decision to livestream execution","t":"10.10 12:00","fr":false},{"site":"The Hill","url":"https://thehill.com/homenews/administration/6140915-trump-reviews-hasan-execution-plan/","ti":"Trump says he will ‘ultimately make decision’ on Fort Hood shooter execution livestream","t":"11.10 01:59","fr":false,"d":"President Trump said he will “make a decision ultimately” on whether to livestream the execution by firing squad of convicted Fort Hood shooter Nidal Hasan following GOP backlash. “He’s a vicious killer, killed 13 people in cold blood, wounded over 20. Some of those people will never have their lives back in a true sense,”..."},{"site":"The Hill","url":"https://thehill.com/policy/international/6140669-pope-decries-death-penalty/","ti":"Pope Leo decries death penalty as Hegseth's public execution plan sparks backlash","t":"10.10 19:37","fr":false,"d":"Pope Leo XIV on Saturday called capital punishment \"inadmissible\" on World Day Against the Death Penalty, amid the Pentagon’s plans to livestream the December execution of former Army Maj. Nidal Hasan in Texas. “The death penalty is inadmissible because it is an attack on the inviolability and dignity of the person,” the pontiff wrote on..."}]},{"id":"p-pennsylvania-skyting","sec":"Politikk","t":"Nine people, including children, dead after mass shooting in Pennsylvania","sh":"Authorities say suspect among dead in house after standoff with police in Erie and there is no ongoing threat A man fatally shot eight people, including a pregnant woman and…","s":"Authorities say suspect among dead in house after standoff with police in Erie and there is no ongoing threat A man fatally shot eight people, including a pregnant woman and children, at a Pennsylvania residence on Friday before killing himself, police say. The victims have not been publicly identified, but seven relatives and a family friend died in the rampage.","url":"https://www.theguardian.com/us-news/2026/oct/10/nine-people-mass-shooting-pennsylvania","full":"11.10.2026 kl. 01:24","hm":"01:24","ts":1791674692000,"dk":"2026-10-11","reg":"usa","p":[],"lab":"Politikk","src":[{"site":"Guardian World","url":"https://www.theguardian.com/us-news/2026/oct/10/nine-people-mass-shooting-pennsylvania","ti":"Nine people, including children, dead after mass shooting in Pennsylvania","t":"11.10 01:24","fr":false,"d":"Authorities say suspect among dead in house after standoff with police in Erie and there is no ongoing threat A man fatally shot eight people, including a pregnant woman and children, at a Pennsylvania residence on Friday before killing himself, police say. The victims have not been publicly identified, but seven relatives and a family friend died in the rampage."},{"site":"NRK Nyheter","url":"https://www.nrk.no/nyheter/ni-drept-etter-masseskyting-i-pennsylvania-1.18051505","ti":"Ni drept etter masseskyting i Pennsylvania","t":"10.10 18:45","fr":true,"d":"I alt ni personer ble drept i en masseskyting i Erie i Pennsylvania fredag. Den mistenkte gjerningsmannen er blant de døde. Det opplyser guvernør Josh Shapiro lørdag. Flere av de drepte skal være barn. Skuddene skal ha skjedd i og utenfor en bolig. – Jeg har ikke sett noe lignende på mine 28-pluss år, sier politisjef Rick Lorah i Erie til en lokal nyhetskanal. Lorah ønsket ikke å gi flere detaljer, men sa at omstendighetene rundt skytingen var «dypt urovekkende». Shapiro opplyste lørdag at han tilbød administrasjonens «fulle støtte» til Eries ordfører Daria Devlin. De lokale myndighetene i Erie opplyste sent fredag kveld at den mistenkte gjerningsmannen var død og at det ikke var noen trusse"},{"site":"The Hill","url":"https://thehill.com/homenews/state-watch/6140615-erie-mass-shooting-nine-dead/","ti":"9 people dead in Erie mass shooting","t":"10.10 18:26","fr":false,"d":"“They knew something was going on at that house.\""}]},{"id":"2108516535379894567","sec":"KI","t":"AI Executives Prepare for Potential Catastrophic Incident","sh":"Executives at leading AI firms including OpenAI and Anthropic are gaming out scenarios for a disruptive event, such as a cyberattack on financial services, internet, power or water, expected possibly within six to 12 months or by 2027.","s":"Executives at leading AI firms including OpenAI and Anthropic are gaming out scenarios for a disruptive event, such as a cyberattack on financial services, internet, power or water, expected possibly within six to 12 months or by 2027. These preparedness exercises aim to manage public backlash and regulatory responses if real-world harm occurs from unsafe AI. OpenAI confirmed it conducts such drills to prepare for various circumstances, not as inevitable outcomes, while similar practices are common in other industries amid AI's rapid advances.","url":"https://x.com/i/trending/2108516535379894567","full":"11.10.2026 kl. 00:51","hm":"00:51","ts":1791672710000,"dk":"2026-10-11","reg":"","p":["2108559991636406581","2108495293620650261","2108535840200614199"],"hk":"Top leaders at OpenAI and Anthropic are quietly running drills for a major AI mishap, like a cyberattack knocking out power or water supplies.","lab":"KI","src":[]},{"id":"k-nadella-nodbrems","sec":"KI","t":"Microsoft's Nadella says AI needs an ‘emergency brake’ that humans control","sh":"Nadella joined other tech moguls and researchers in calling for stronger safeguards and, in some cases, for the pacing of frontier development.","s":"Nadella joined other tech moguls and researchers in calling for stronger safeguards and, in some cases, for the pacing of frontier development. In a Saturday morning post, Microsoft's CEO wrote that it’s time “to step back and assess the trust architecture” of AI.","url":"https://www.cnbc.com/2026/10/10/microsoft-satya-nadella-ai-emergency-brake-safety.html","full":"11.10.2026 kl. 00:10","hm":"00:10","ts":1791670217000,"dk":"2026-10-11","reg":"","p":[],"lab":"KI","src":[{"site":"CNBC Tech","url":"https://www.cnbc.com/2026/10/10/microsoft-satya-nadella-ai-emergency-brake-safety.html","ti":"Microsoft's Nadella says AI needs an ‘emergency brake’ that humans control","t":"10.10 22:59","fr":false,"d":"Nadella joined other tech moguls and researchers in calling for stronger safeguards and, in some cases, for the pacing of frontier development."},{"site":"TechCrunch","url":"https://techcrunch.com/2026/10/10/microsofts-satya-nadella-says-ai-models-need-an-emergency-brake/","ti":"Microsoft’s Satya Nadella says AI models need an ‘emergency brake’","t":"10.10 23:47","fr":false,"d":"In a Saturday morning post, Microsoft's CEO wrote that it’s time “to step back and assess the trust architecture” of AI."},{"site":"Bloomberg Technology","url":"https://www.bloomberg.com/news/articles/2026-10-10/microsoft-ceo-nadella-calls-for-emergency-brake-on-advanced-ai","ti":"Microsoft CEO Nadella Calls for ‘Emergency Brake’ on Advanced AI","t":"10.10 20:35","fr":false,"d":"Microsoft Corp. Chief Executive Officer Satya Nadella said companies should treat powerful artificial intelligence models as potential insider threats, assume they could be compromised and create an “emergency brake” system to prevent agentic models from going rogue."},{"site":"The Verge","url":"https://www.theverge.com/ai-artificial-intelligence/1009337/satya-nadella-says-we-should-assume-all-ai-models-are-compromised","ti":"Satya Nadella says we should assume all AI models are ‘compromised’","t":"11.10 00:10","fr":false,"d":"In a lengthy post on X, Microsoft's CEO laid out his views on the dangers posed by highly advanced AI models and how to confront those risks. Nadella says we can no longer accept a world where AI is treated as a \"set of nested black boxes\" whose advice and actions we simply accept or […]"}]},{"id":"p-diesel-russland","sec":"Politikk","t":"Trump lifts sanctions on Russian diesel, suggests US may buy amid surging fuel prices","sh":"Trump says the U.S. will obtain diesel from Russia, relaxing years of U.S. pressure on Moscow, to combat prices before midterms.","s":"Trump says the U.S. will obtain diesel from Russia, relaxing years of U.S. pressure on Moscow, to combat prices before midterms. He said he struck the deal with Russian President Vladimir Putin in a phone call. US president says agreement needed to lower fuel prices, but move likely to create fresh crisis with Ukraine and Nato allies Donald Trump is on a fresh collision course with Volodymyr Zelenskyy and European allies after his stunning agreement to buy Russian diesel upended years of US and western pressure on the Kremlin to end its war against Ukraine. Zelenskyy reacted furiously to Trump’s announcement of the deal with Vladimir Putin on Friday, calling it “absolutely terrible” and “not fair and not honest”.","url":"https://www.politico.com/news/2026/10/09/trump-diesel-sanctions-lifted-russia-01114977?utm_source=RSS_Feed&utm_medium=RSS&utm_campaign=RSS_Syndication","full":"11.10.2026 kl. 00:02","hm":"00:02","ts":1791669753000,"dk":"2026-10-11","reg":"usa","p":[],"lab":"Politikk","src":[{"site":"Politico Europe","url":"https://www.politico.com/news/2026/10/09/trump-diesel-sanctions-lifted-russia-01114977?utm_source=RSS_Feed&utm_medium=RSS&utm_campaign=RSS_Syndication","ti":"Trump lifts sanctions on Russian diesel, suggests US may buy amid surging fuel prices","t":"09.10 21:21","fr":false,"d":"The move comes weeks ahead of the midterm election."},{"site":"The Hill","url":"https://thehill.com/newsletters/energy-environment/6140010-trump-says-russia-will-export-diesel-lifts-sanctions/","ti":"Trump says Russia will export diesel, lifts sanctions","t":"10.10 00:23","fr":false},{"site":"NPR Politics","url":"https://www.npr.org/2026/10/09/nx-s1-5996912/trump-says-u-s-to-get-diesel-from-russia-relaxing-pressure-on-moscow-to-ease-prices-before-midterms","ti":"Trump says U.S. to get diesel from Russia, relaxing pressure on Moscow to ease prices before midterms","t":"09.10 23:24","fr":true,"d":"Trump says the U.S. will obtain diesel from Russia, relaxing years of U.S. pressure on Moscow, to combat prices before midterms. He said he struck the deal with Russian President Vladimir Putin in a phone call."},{"site":"Guardian World","url":"https://www.theguardian.com/us-news/live/2026/oct/09/pentagon-fort-hood-livestream-firing-squad-execution-reaction-backlash-pete-hegseth-donald-trump-mussolini-latest-news-updates","ti":"‘I want to thank President Putin’, Trump says after agreeing to lift sanctions on Russian diesel – as it happened","t":"10.10 04:02","fr":false},{"site":"NRK Nyheter","url":"https://www.nrk.no/nyheter/zelenskyj_-dieselsalg-forlenger-krigen-1.18051171","ti":"Zelenskyj: Dieselsalg forlenger krigen","t":"09.10 21:51","fr":true,"d":"Å tillate Russland å selge petroleumsprodukter er «en investering i en krig som må ta slutt, ikke fortsette», sier Ukrainas president Volodymyr Zelenskyj. Uttalelsen kommer etter at Trump meldte at Russland har gått med på å forsyne USA og resten av verden med millioner tonn diesel. Zelenskyj sier videre at slike «gaver» til Putin i form av lettelser i sanksjonene ikke vil få slutt på krigen."},{"site":"Guardian World","url":"https://www.theguardian.com/us-news/2026/oct/09/trump-putin-russian-diesel-ukraine","ti":"Zelenskyy furious as Trump announces deal to buy Russian diesel","t":"10.10 12:09","fr":false,"d":"US president says agreement needed to lower fuel prices, but move likely to create fresh crisis with Ukraine and Nato allies Donald Trump is on a fresh collision course with Volodymyr Zelenskyy and European allies after his stunning agreement to buy Russian diesel upended years of US and western pressure on the Kremlin to end its war against Ukraine. Zelenskyy reacted furiously to Trump’s announcement of the deal with Vladimir Putin on Friday, calling it “absolutely terrible” and “not fair and not honest”."},{"site":"DN","url":"https://www.dn.no/olje/trump/usa/russland/eksperter-russisk-diesel-resulterer-neppe-i-lavere-pumpepris/2-1-2056817","ti":"Eksperter: Russisk diesel resulterer neppe i lavere pumpepris","t":"10.10 12:33","fr":true,"d":"President Donald Trump kunngjorde fredag at han har fått Vladimir Putin med på å forsyne USA og verden med flere millioner tonn diesel, men det vil neppe føre til lavere pumpepris, tror eksperter."},{"site":"VG","url":"https://www.vg.no/i/Og6QKk/begynner-aa-bli-litt-desperat","ti":"– Begynner å bli litt desperat","t":"10.10 13:18","fr":false},{"site":"The Hill","url":"https://thehill.com/homenews/house/6140830-fitzpatrick-bill-block-russian-oil/","ti":"Bipartisan bill barring U.S. purchase of Russian oil on the horizon: Fitzpatrick","t":"11.10 00:02","fr":false,"d":"Rep. Brian Fitzpatrick (R-Pa.) announced on Saturday he would be introducing a bipartisan bill aimed at stopping President Trump from lifting sanctions on Russian oil amid global fuel shortages. “We will be introducing bipartisan legislation to block any and all purchases of Russian oil. It will be called the ‘Ronald Reagan Peace Through Strength Act,’”..."},{"site":"Bloomberg Markets","url":"https://www.bloomberg.com/news/videos/2026-10-10/russian-diesel-deal-unlikely-to-lower-us-prices-video","ti":"Russian Diesel Deal Unlikely to Lower US Prices","t":"10.10 18:03","fr":false,"d":"Bloomberg Economics Economic Statecraft Lead Chris Kennedy tells Bloomberg This Weekend that President Donald Trump's agreement to obtain Russian diesel is unlikely to significantly lower US fuel prices because the proposed November shipment amounts to roughly one day of American consumption. Speaking with hosts David Gura and Christina Ruffini, Kennedy says damage to Russian refineries, logistical challenges and potential legal restrictions raise questions about whether Moscow can deliver the promised fuel, while the agreement could complicate Ukraine's campaign against Russian energy infrastructure. (Source: Bloomberg)"},{"site":"Aftenposten","url":"https://www.aftenposten.no/verden/i/mKMOyO/eide- rn drept i angrep mot Zaporizjzja","t":"10.10 12:25","fr":false,"d":"Minst tolv mennesker er drept, blant dem tre barn, i russiske angrep mot…"},{"site":"BBC World","url":"https://www.bbc.co.uk/news/articles/cwvgdpv642g5o?at_medium=RSS&at_campaign=rss","ti":"Russian glide bomb attack on Zaporizhzhia kills at least 20 people","t":"10.10 22:51","fr":false,"d":"Volodymyr Zelensky says the attack, which left children dead, was Russia expressing its \"thanks\" for a US diesel deal."}]},{"id":"v--S8adDJzwA0","sec":"Video","t":"The Great Fertility Collapse with Jesús Fernández-Villaverde","sh":"Economist Jesús Fernández-Villaverde tells EconTalk host Russ Roberts that, for the first time in history, we are not having enough children to keep…","s":"Economist Jesús Fernández-Villaverde tells EconTalk host Russ Roberts that, for the first time in history, we are not having enough children to keep world population from falling, and that fertility is collapsing fastest not in rich nations but in places like Colombia, Thailand and Guatemala. The decline has accelerated sharply over the past decade and defies easy explanation. (Summary from title and description.)","url":"https://www.youtube.com/watch?v=-S8adDJzwA0","full":"10.10.2026 kl. 21:58","hm":"21:58","ts":1791662338000,"dk":"2026-10-10","reg":"okonomi","p":[],"src":[],"lab":"Økonomi","v":"-S8adDJzwA0","ch":"Hoover Institution","dur":"","th":"https://i.ytimg.com/vi/-S8adDJzwA0/mqdefault.jpg","lang":"en"},{"id":"2108931544094216650","sec":"Tesla","t":"XPENG NGP Test Rides Impress in Paris Ahead of Auto Show","sh":"At the Mondial de l’Auto 2026 in Paris, XPENG and Tesla are offering 25-minute supervised public test rides in the Autonomous Lab using XPENG L03 SUVs with NGP and Tesla Model 3s with FSD.","s":"At the Mondial de l’Auto 2026 in Paris, XPENG and Tesla are offering 25-minute supervised public test rides in the Autonomous Lab using XPENG L03 SUVs with NGP and Tesla Model 3s with FSD. Creators like Devin Olsen praised rtently fill out government forms with incomplete information and also submitted a false homicide crime tip to the Philadelphia police department. Anthropic said police flagged the homicide tip as spam, and Axios reported that Anthropic ..."},{"site":"Bloomberg Technology","url":"https://www.bloomberg.com/news/articles/2026-10-10/anthropic-shares-new-ai-misbehavior-some-on-government-sites","ti":"Anthropic Cites New AI Misbehavior, Some on Government Sites","t":"10.10 02:08","fr":false,"d":"Anthropic PBC said its Claude AI model carried out additional unintended actions on the digital systems of outside organizations, including submitting a false tip in a police homicide case, prompting a warning from the Trump administration for artificial intelligence companies to secure their systems."},{"site":"TechCrunch","url":"https://techcrunch.com/2026/10/09/anthropic-cant-reliably-control-its-ai-agents-its-cutting-off-its-internal-evals-from-the-live-internet-instead/","ti":"Anthropic can’t reliably control its AI agents. It’s cutting off its internal evals from the live internet instead","t":"10.10 02:18","fr":false,"d":"Anthropic said it \"turned off live internet access\" for \"all our internal evaluations\" until further notice."},{"site":"The Verge","url":"https://www.theverge.com/ai-artificial-intelligence/1009090/anthropic-fake-homicide-information-philadelphia-pd-tip","ti":"Anthropic’s AI gave Philadelphia police a fake tip about an unsolved homicide","t":"09.10 23:15","fr":false},{"site":"Engadget","url":"https://www.engadget.com/2282713/an-anthropic-model-submitted-a-false-homicide-tip-to-philadelphia-police/","ti":"An Anthropic model submitted a false homicide tip to Philadelphia police","t":"09.10 22:00","fr":false},{"site":"Techmeme","url":"https://www.techmeme.com/261010/p3#a261010p3","ti":"Sources: Anthropic's AI agents submitted 20 visa applications via a form on the US State Department website; the applications were incomplete and not processed (New York T ried to break into government websites","t":"10.10 19:49","fr":false,"d":"In its latest report, Anthropic has revealed that its AI agents meddled with government websites during testing."},{"site":"The Verge","url":"https://www.theverge.com/ai-artificial-intelligence/1009286/anthropic-is-cutting-off-its-internal-evaluations-from-the-internet","ti":"Anthropic is cutting off its internal evaluations from the internet","t":"10.10 16:41","fr":false,"d":"After a recent spate of high-profile incidents in which AI agents escaped containment, Anthropic is cutting off internet access for all internal evaluations. In a report Friday, the company detailed \"unintended model actions,\" including submitting a false tip regarding an unsolved murder, that led to the decision. Although the impact of these behaviors was minimal […]"}]},{"id":"k-nvidia-reflection","sec":"KI","t":"Nvidia in talks to acquire US ‘open’ model start-up Reflection AI","sh":"Donald Trump’s administration hopes the company will rival cheap Chinese alternatives such as DeepSeek","s":"Donald Trump’s administration hopes the company will rival cheap Chinese alternatives such as DeepSeek. Nvidia Corp. is in talks to boost its investment in Reflection AI or offer the startup computing power, a move that would strengthen ties with a key developer of open-weight models, according to a person familiar with the matter.","url":"https://www.ft.com/content/052610c5-22b4-4dd4-932e-b7f9f0628b6a?syn-25a6b1a6=1","full":"10.10.2026 kl. 21:08","hm":"21:08","ts":1791659323000,"dk":"2026-10-10","reg":"","p":[],"lab":"KI","src":[{"site":"FT Technology","url":"https://www.ft.com/content/052610c5-22b4-4dd4-932e-b7f9f0628b6a?syn-25a6b1a6=1","ti":"Nvidia in talks to acquire US ‘open’ model start-up Reflection AI","t":"10.10 20:14","fr":false,"d":"Donald Trump’s administration hopes the company will rival cheap Chinese alternatives such as DeepSeek"},{"site":"Techmeme","url":"https://www.techmeme.com/261010/p16#a261010p16","ti":"Sources: Nvidia is in talks to acquire or invest more into US open-weights AI startup Reflection AI; the deal may be an acquihire to avoid antitrust scrutiny (Financial Times)","t":"10.10 21:08","fr":false,"d":"Sources: Nvidia is in talks to acquire or invest more into US open-weights AI startup Reflection AI; the deal may be an acquihire to avoid antitrust scrutiny — Donald Trump's administration hopes the company will rival cheap Chinese alternatives such as DeepSeek"},{"site":"Bloomberg Technology","url":"https://www.bloomberg.com/news/articles/2026-10-10/nvidia-is-in-talks-to-acquire-reflection-ai-the-ft-reports","ti":"Nvidia Explores Deal Options With Reflection AI, Financial Times Says","t":"10.10 20:52","fr":false,"d":"Nvidia Corp. is in talks to boost its investment in Reflection AI or offer the startup computing power, a move that would strengthen ties with a key developer of open-weight models, according to a person familiar with the matter."}]},{"id":"o-ai-gjeld","sec":"Okonomi","t":"AI borrowing slows as investors grow wary of debt binge","sh":"Appetite for financing infrastructure boom is tested after months of record-breaking bond issuance","s":"Appetite for financing infrastructure boom is tested after months of record-breaking bond issuance. When financing gets more expensive, companies usually slow down their bond sales. Tech companies have instead been ramping up this year, and talk this week of potential big financings from SpaceX and Broadcom Inc. only amplified investor fears about the wave of coming debt.","url":"https://www.ft.com/content/9c13d40e-d2b2-45d5-921c-a68cd4b308f9?syn-25a6b1a6=1","full":"10.10.2026 kl. 21:00","hm":"21:00","ts":1791658800000,"dk":"2026-10-10","reg":"","p":[],"lab":"Økonomi","src":[{"site":"FT Markets","url":"https://www.ft.com/content/9c13d40e-d2b2-45d5-921c-a68cd4b308f9?syn-25a6b1a6=1","ti":"AI borrowing slows as investors grow wary of debt binge","t":"10.10 13:00","fr":false,"d":"Appetite for financing infrastructure boom is tested after months of record-breaking bond issuance"},{"site":"FT Technology","url":"https://www.ft.com/content/9c13d40e-d2b2-45d5-921c-a68cd4b308f9?syn-25a6b1a6=1","ti":"AI borrowing slows as investors grow wary of debt binge","t":"10.10 13:00","fr":false,"d":"Appetite for financing infrastructure boom is tested after months of record-breaking bond issuance"},{"site":"Bloomberg Markets","url":"https://www.bloomberg.com/news/articles/2026-10-10/ai-issuers-are-upending-longstanding-safety-valve-credit-weekly","ti":"AI Debt Issuance Defies Rising Yields as SpaceX, Broadcom Plan Major Deals","t":"10.10 21:00","fr":false,"d":"When financing gets more expensive, companies usually slow down their bond sales. Tech companies have instead been ramping up this year, and talk this week of potential big financings from SpaceX and Broadcom Inc. only amplified investor fears about the wave of coming debt."}]},{"id":"2108646581058650265","sec":"Okonomi","t":"Prediction Markets Bet 85% on Fed Holding Rates in Late October","sh":"Platforms like Polymarket and Kalshi now show an 85 percent chance of no change from the current 3.75 to 4 percent range, up from earlier expectations of another hike.","s":"Platforms like Polymarket and Kalshi now show an 85 percent chance of no change from the current 3.75 to 4 percent range, up from earlier expectations of another hike. This shift follows recent data with CPI at 3.4 percent and core inflation easing to 2.4 percent, alongside Fed Chair Kevin Warsh's data-dependent stance aimed at the 2 percent target. Markets reflect relief amid sticky prices and resilient growth, with a possible 15 percent chance of a 25 basis point increase, leaving room for December action.","url":"https://x.com/i/trending/2108646581058650265","full":"10.10.2026 kl. 20:54","hm":"20:54","ts":1791658487000,"dk":"2026-10-10","reg":"","p":["2108587246307930482","2108581347476598815"],"hk":"Traders are piling into bets that the Federal Reserve will pause interest rates at its October 28 meeting, pushing the odds to a record 85 percent.","lab":"Økonomi","src":[]},{"id":"2108565348316500472","sec":"Okonomi","t":"Delta Cuts Earnings Outlook Amid Fuel Surge and Wi-Fi Delay Backlash","sh":"Delta Air Lines reported third-quarter adjusted earnings of $1.72 per share, missing estimates, and slashed its full-year EPS forecast to $5.10-$5.60 due to $6 billion in higher fuel costs.","s":"Delta Air Lines reported third-quarter adjusted earnings of $1.72 per share, missing estimates, and slashed its full-year EPS forecast to $5.10-$5.60 due to $6 billion in higher fuel costs. CEO Ed Bastian highlighted strong demand and rising fares to offset expenses, expecting $4.5 billion in pre-tax profit. He chose Amazon's service over Starlink—despite calling it 'fabulous'—sparking passenger frustration over the long wait and current spotty Wi-Fi, with Elon Musk publicly criticizing the decision.","url":"https://x.com/i/trending/2108565348316500472","full":"10.10.2026 kl. 19:54","hm":"19:54","ts":1791654861000,"dk":"2026-10-10","reg":"","p":["2108578034244858281","2108559222719819785","2108556713704268002"],"hk":"Delta CEO Ed Bastian faced online heat after defending a 2028 rollout for next-gen in-flight Wi-Fi, even as passengers vented about slow connections today.","lab":"Økonomi","src":[]},{"id":"2108295772248940600","sec":"Romfart","t":"SpaceX Acquires Key Spectrum to Launch Starlink as Major US Mobile Carrier","sh":"SpaceX agreed to buy an 800 MHz low-band spectrum portfolio from Grain Management for around $8 billion, enabling Starlink to deliver seamless indoor and outdoor mobile service across the US.","s":"SpaceX agreed to buy an 800 MHz low-band spectrum portfolio from Grain Management for around $8 billion, enabling Starlink to deliver seamless indoor and outdoor mobile service across the US. Paired with FCC approval for 15,000 next-generation satellites offering over 100 times more bandwidth, the deal combines low-band penetration with existing higher frequencies and some terrestrial infrastructure. Shares of AT&T, Verizon, and T-Mobile dropped 6-8% or more in after-hours trading as investors eyed the threat of real competition, while T-Mobile's CTO pushed back on claims that spectrum alone builds a full network.","url":"https://x.com/i/trending/2108295772248940600","full":"10.10.2026 kl. 19:42","hm":"19:42","ts":1791654170000,"dk":"2026-10-10","reg":"spacex","p":["2108291133025698301","2108296168094544099","2108464230278299930"],"hk":"Elon Musk just called it the final piece for nationwide phone coverage anywhere in America. SpaceX's bold spectrum grab could reshape how we all stay connected.","lab":"SpaceX","src":[]},{"id":"v-DKw9ZJgVKyo","sec":"Video","t":"Phenomenal Time To Be Investor, Not Consumer: Amoroso","sh":"Anastasia Amoroso, chief investment strategist at Partners Group, talks with Scarlet Fu and Tom Keene on Bloomberg Money about bullish stock-market…","s":"Anastasia Amoroso, chief investment strategist at Partners Group, talks with Scarlet Fu and Tom Keene on Bloomberg Money about bullish stock-market sentiment, the potential for near-term volatility and rising global yields. (Summary from title and description.)","url":"https://www.youtube.com/watch?v=DKw9ZJgVKyo","full":"10.10.2026 kl. 19:30","hm":"19:30","ts":1791653457000,"dk":"2026-10-10","reg":"finans","p":[],"src":[],"lab":"Finans","v":"DKw9ZJgVKyo","ch":"Bloomberg Television","dur":"","th":"https://i.ytimg.com/vi/DKw9ZJgVKyo/mqdefault.jpg","lang":"en"},{"id":"v-zv9qWicFwUs","sec":"Video","t":"How Russia turned sanctions into a diesel deal | DW News","sh":"DW News on how Russia turned years of US sanctions pressure into a diesel deal: Trump has agreed to buy millions of tons of Russian diesel to lower…","s":"DW News on how Russia turned years of US sanctions pressure into a diesel deal: Trump has agreed to buy millions of tons of Russian diesel to lower US fuel prices, while critics say it gives Putin fresh revenue and a politi urs and 10.5% sick leave, yielding 29 vehicles per employee at €4,850 cost each. Portugal's Palmela plant halves labor costs to €37 per hour with higher output of 39.9 vehicles at €2,385 apiece, while China's Tianjin hits €12 per hour, 2,065 hours, just 1% sick leave, 51.3 vehicles, and €1,078 per vehicle. After-rent take-home pay leaves Tianjin workers with more disposable income in local terms, fueling talks on why Chinese brands sold over a million cars in Europe in 2026 despite tariffs.","url":"https://x.com/i/trending/2108924496409444368","full":"10.10.2026 kl. 16:20","hm":"16:20","ts":1791642057000,"dk":"2026-10-10","reg":"elbiler","p":["2108605093738356923","2108843794254921873","2108916418573894043"],"hk":"Charts from an internal VW document lay bare why Chinese electric vehicles are surging in Europe: workers in Tianjin outpace Emden colleagues in output while costing far less per vehicle.","lab":"Elbil","src":[]},{"id":"k-ki-ansvar","sec":"KI","t":"Trump’s AI Liability Push Opens Blame Game for Models Gone Rogue","sh":"The Trump administration’s embrace of legal liability to enforce artificial intelligence safety sets the stage for future conflicts over who foots the bill when AI models go…","s":"The Trump administration’s embrace of legal liability to enforce artificial intelligence safety sets the stage for future conflicts over who foots the bill when AI models go rogue: the companies that design the systems or the people that deploy the technology.","url":"https://www.bloomberg.com/news/articles/2026-10-10/trump-s-ai-liability-push-opens-blame-game-for-models-gone-rogue","full":"10.10.2026 kl. 16:19","hm":"16:19","ts":1791641954000,"dk":"2026-10-10","reg":"","p":[],"lab":"KI","src":[{"site":"Bloomberg Technology","url":"https://www.bloomberg.com/news/articles/2026-10-10/trump-s-ai-liability-push-opens-blame-game-for-models-gone-rogue","ti":"Trump’s AI Liability Push Opens Blame Game for Models Gone Rogue","t":"10.10 16:19","fr":false,"d":"The Trump adm nd caps. The launch comes amid buzz around upcoming models like Argon and internal tests of Carbon, positioning Google to compete head-on with Microsoft, OpenAI, and Anthropic in enterprise AI.","url":"https://x.com/i/trending/2108173723161579804","full":"10.10.2026 kl. 13:54","hm":"13:54","ts":1791633297000,"dk":"2026-10-10","reg":"","p":["2108245829530325307","2108257472553386059","2108252402075734172"],"hk":"Imagine one prompt box that tackles your questions, coding, and content creation, all while pulling from your full business context. Google just made that a reality for enterprise teams.","lab":"KI","src":[]},{"id":"e-nio-bytte","sec":"Tesla","t":"Battery swap works: Nio completes 1.2 million swaps in a SINGLE WEEK","sh":"While oil prices and range anxiety dominate Western EV headlines, Nio’s battery-swap system in China keeps reaching new milestones that prove the technology can rival a…","s":"While oil prices and range anxiety dominate Western EV headlines, Nio’s battery-swap system in China keeps reaching new milestones that prove the technology can rival a traditional refueling infrastructure at scale, performing 1.2 million battery swaps over the holiday.","url":"https://electrek.co/2026/10/10/battery-swap-works-nio-completes-1-2-million-swaps-in-a-single-week/","full":"10.10.2026 kl. 13:44","hm":"13:44","ts":1791632671000,"dk":"2026-10-10","reg":"elbiler","p":[],"lab":"Elbil","src":[{"site":"Electrek","url":"https://electrek.co/2026/10/10/battery-swap-works-nio-completes-1-2-million-swaps-in-a-single-week/","ti":"Battery swap works: Nio completes 1.2 million swaps in a SINGLE WEEK","t":"10.10 13:44","fr":false,"d":"While oil prices and range anxiety dominate Western EV headlines, Nio’s battery-swap system in China keeps reaching new milestones that prove the technology can rival a traditional refueling infrastructure at scale, performing 1.2 million battery swaps over the holiday."}]},{"id":"v-uUxQBZDTglo","sec":"Video","t":"The undersea war: Who is threatening the cables that connect the world? | DW News","sh":"DW News on the risk of sabotage against undersea internet cables and pipelines after a series of incidents in the Baltic Sea: could attacks cripple…","s":"DW News on the risk of sabotage against undersea internet cables and pipelines after a series of incidents in the Baltic Sea: could attacks cripple Western economies, and can NATO protect thousands of kilometres of infrastructure? (Summary from title and description.)","url":"https://www.youtube.com/watch?v=uUxQBZDTglo","full":"10.10.2026 kl. 13:38","hm":"13:38","ts":1791632316000,"dk":"2026-10-10","reg":"samfunnsstyring","p":[],"src":[],"lab":"Samfunnsstyring","v":"uUxQBZDTglo","ch":"DW News","dur":"","th":"https://i.ytimg.com/vi/uUxQBZDTglo/mqdefault.jpg","lang":"en"},{"id":"2108636432885526788","sec":"KI","t":"Microsoft Launches Decision-1 for Fast AI Judgments","sh":"On October 9, CEO Satya Nadella introduced Microsoft-Decision-1, a specialized model trained from Qwen3.5-9B for structured decisions in areas like incident response and scientific workflows.","s":"On October 9, CEO Satya Nadella introduced Microsoft-Decision-1, a specialized model trained from Qwen3.5-9B for structured decisions in areas like incident response and scientific workflows. It tops benchmarks with 83.5% accuracy across 36 tests, median latency of 85 milliseconds, and strong calibration, making it 4.5 times faster than close rivals. Available now in Microsoft Foundry and OpenRouter at $0.042 per million input tokens, it highlights a shift to modular AI that pairs lightweight decision tools with bigger models for efficient, low-cost operations.","url":"https://x.com/i/trending/2108636432885526788","full":"10.10.2026 kl. 13:36","hm":"13:36","ts":1791632196000,"dk":"2026-10-10","reg":"","p":["2108627923888754862","2108689756372775370"],"lab":"KI","src":[]},{"id":"p-gaza-angrep","sec":"Politikk","t":"Minst fem drept i nye israelske angrep på Gazastripen","sh":"Minst fem palestine ings of the rate-setting panel, a policymaker said, as an “unprecedented” legal challenge raises questions about the institution’s leadership.","url":"https://www.bloomberg.com/news/articles/2026-10-10/poland-central-bank-faces-meeting-hurdles-without-glapinski-pap","full":"10.10.2026 kl. 13:02","hm":"13:02","ts":1791630171000,"dk":"2026-10-10","reg":"","p":[],"lab":"Økonomi","src":[{"site":"Bloomberg Markets","url":"https://www.bloomberg.com/news/articles/2026-10-10/poland-central-bank-faces-meeting-hurdles-without-glapinski-pap","ti":"Poland Central Bank Faces Meeting Hurdles Without Glapinski: PAP","t":"10.10 13:02","fr":false}]},{"id":"p-sicilia-tornado","sec":"Politikk","t":"Dozens injured and buildings damaged as tornadoes hit Sicily","sh":"Marsala on island’s west coast badly affected after powerful storm approached from Mediterranean Two tornadoes have struck the coastal town of Marsala in western Sicily,…","s":"Marsala on island’s west coast badly affected after powerful storm approached from Mediterranean Two tornadoes have struck the coastal town of Marsala in western Sicily, injuring dozens of people, damaging buildings including a school, and overturning cars. A series of videos began to circulate on Friday morning showing two waterspouts approaching the Sicilian town from the sea as people braced for their arrival.","url":"https://www.theguardian.com/world/2026/oct/10/tornado-hit-marsala-sicily-injuries-damage","full":"10.10.2026 kl. 13:00","hm":"13:00","ts":1791630031000,"dk":"2026-10-10","reg":"eu","p":[],"lab":"Politikk","src":[{"site":"Guardian World","url":"https://www.theguardian.com/world/2026/oct/10/tornado-hit-marsala-sicily-injuries-damage","ti":"Dozens injured and buildings damaged as tornadoes hit Sicily","t":"10.10 13:00","fr":false,"d":"Marsala on island’s west coast badly affected after powerful storm approached from Mediterranean Two tornadoes have struck the coastal town of Marsala in western Sicily, injuring dozens of people, damaging buildings including a school, and overturning cars. A series of videos began to circulate on Friday morning showing two waterspouts approaching the Sicilian town from the sea as people braced for their arrival."},{"site":"Guardian Europe","url":"https://www.theguardian.com/world/video/2026/oct/10/powerful-tornado-in-western-sicily-leaves-trail-of-devastation-video","ti":"Powerful tornado in western Sicily leaves trail of devastation – video","t":"10.10 12:36","fr":false,"d":"A tornado hit Sicily on Friday causing severe damage in what experts said was an almost unprecedented event for the Italian island. It caused extensive damage along the west of the island in the towns of Marsala and Petrosino, south of the city of Trapani. Dozens of people were reportedly injured, with at least 11 taken to hospital after being struck by flying debris and shattered glass Dozens injured and buildings damaged as tornadoes hit Sicily"}]},{"id":"v-Y7lEm-sq64Q","sec":"Video","t":"Signal boss Meredith Whittaker says AI ‘can always be controlled’ | BBC News","sh":"Signal president Meredith Whittaker tells the BBC that AI can always be controlled; fears of conscious AI taking over are 'not anchored in science…","s":"Signal president Meredith Whittaker tells the BBC that AI can always be controlled; fears of conscious AI taking over are 'not anchored in science and evidence', and she warns instead about using AI in military decision-making, where it can 'supercharge mistakes'. (Summary from description.)","url":"https://www.youtube.com/watch?v=Y7lEm-sq64Q","full":"10.10.2026 kl. 13:00","hm":"13:00","ts":1791630026000,"dk":"2026-10-10","reg":"tech","p":[],"src":[],"lab":"Tech & KI","v":"Y7lEm-sq64Q","ch":"BBC News","dur":"","th":"https://i.ytimg.com/vi/Y7lEm-sq64Q/mqdefault.jpg","lang":"en"},{"id":"t-nvidia-gpu","sec":"Teknologi","t":"Nvidia GPUs are everywhere. Here are the ways companies are accessing them","sh":"One industry researcher identified over 300 neoclouds that can provide GPU erhood-linked entities—like front groups, financial networks, and youth bodies such as FEMYSO—for possible EU terrorist designation.","s":"On October 8, the European Parliament passed a resolution by 381 to 167 votes, urging the Council to assess Muslim Brotherhood-linked entities—like front groups, financial networks, and youth bodies such as FEMYSO—for possible EU terrorist designation. It calls for tighter EU funding scrutiny, transparency on foreign financing from Qatar and Turkey, and safeguards against entryism in institutions. Spearheaded by the European People’s Party with support from ECR, Patriots for Europe, and Renew, the non-binding measure now awaits action from the Council and Commission, amid praise from figures like Nigel Farage and debates over targeting ideology versus faith.","url":"https://x.com/i/trending/2108188562327749119","full":"10.10.2026 kl. 12:59","hm":"12:59","ts":1791629999000,"dk":"2026-10-10","reg":"eu","p":["2108147274937225481","2108163565672870151","2108590520104636879"],"lab":"Politikk","src":[]},{"id":"2108839362003943909","sec":"Tesla","t":"Tesla's Digital Optimus Masters Half of Diablo Campaign from Screen Pixels Alone","sh":"Digital Optimus, a Tesla and SpaceXAI project, plays games like Diablo, Counter-Strike, and League of Legends using only raw screen pixels as input and keyboard-mouse actions as output.","s":"Digital Optimus, a Tesla and SpaceXAI project, plays games like Diablo, Counter-Strike, and League of Legends using only raw screen pixels as input and keyboard-mouse actions as output. This vision-only approach mirrors Tesla's Full Self-Driving tech and aims to generalize across all games, with skills transferring to web browsing, apps, and robotics. Tesla is hiring engineers in Palo Alto to build agents that handle AAA titles at superhuman levels, marking an early step toward AI that controls computers autonomously like humans.","url":"https://x.com/i/trending/2108839362003943909","full":"10.10.2026 kl. 12:59","hm":"12:59","ts":1791629974000,"dk":"2026-10-10","reg":"tesla","p":["2108823477071303109","2108779986173993233","2108829766099022210"],"lab":"Tesla","src":[]},{"id":"2108177955922776189","sec":"Tesla","t":"Tesla Renames Full Self-Driving to Assisted Driving in Europe","sh":"The rebranding targets websites, apps, and order pages, addressing concerns that the old name misled drivers about a system needing constant attention.","s":"The rebranding targets websites, apps, and order pages, addressing concerns that the old name misled drivers about a system needing constant attention. Germany now backs faster EU-wide approval after September discussions, while Enhanced Autopilot becomes 'Tesla Assisted Driving Basic' at about €99 monthly in some markets. Eight countries already permit it, with Slovakia next and an EU vote eyed for December; Tesla also capped speed offsets at 10% and insurers like Lemonade offer up to 50% discounts for safer miles.","url":"https://x.com/i/trending/2108177955922776189","full":"10.10.2026 kl. 12:59","hm":"12:59","ts":1791629972000,"dk":"2026-10-10","reg":"tesla","p":["2108272012514967787","2108152587199406295","2108290497651569128"],"hk":"Tesla swapped out its bold 'Full Self-Driving' name for 'Tesla Assisted Driving' across Europe, a change born from talks with Germany's Transport Ministry to ease regulatory hurdles.","lab":"Tesla","src":[]},{"id":"2108196079330021714","sec":"Politikk","t":"Zelenskyy Rejects Rubio's Stalemate View, Demands Tougher Russia Sanctions","sh":"On October 8 in Pryluky, northern Ukraine, President Volodymyr Zelenskyy dismissed U.S.","s":"On October 8 in Pryluky, northern Ukraine, President Volodymyr Zelenskyy dismissed U.S. Secretary of State Marco Rubio's description of the Russia-Ukraine war as a strategic stalemate. He called for shutting down Russia's economy through full sanctions on weapons and sales, plus unrestricted U.S. Starlink access to help Ukraine gain air superiority and force Putin to negotiate. Zelens  Matter Compiler builds working micro-machines with moving parts and micron-scale features directly from code, skipping traditional tooling and process tweaks. Their debut product, the PrimeSwitch PS-150, is a high-performance relay for AI data centers that handles 150 amps, switches in 50 microseconds, and offers unmatched isolation. Backed by $250 million from investors like Gigafund, the team eyes expansion into electrical, mechanical, and fluidic domains, with early units already sampling to customers.","url":"https://x.com/i/trending/2108312202033946715","full":"10.10.2026 kl. 12:10","hm":"12:10","ts":1791627012000,"dk":"2026-10-10","reg":"","p":["2108283819560472987","2108375618987671945","2108283821292699815"],"lab":"Teknologi","src":[]},{"id":"2108268611420721478","sec":"Robotikk","t":"Aether AI Unveils CRIS-0 Robot Mastering Home Tasks with Causal Reasoning","sh":"The San Diego startup, founded this year by UC San Diego professor Biwei Huang, released videos on October 8 showing CRIS-0 guiding a robot through tasks like coffee pouring and pick-and-place by reasoning about cause and effect.","s":"The San Diego startup, founded this year by UC San Diego professor Biwei Huang, released videos on October 8 showing CRIS-0 guiding a robot through tasks like coffee pouring and pick-and-place by reasoning about cause and effect. The system uses a causality-guided agent and world model to break tasks into stages, predict outcomes, verify results, and replan quickly after disruptions like moved objects. Early tests highlight fast recovery and high success rates, drawing from Huang's causal discovery research, with potential to extend beyond robotics.","url":"https://x.com/i/trending/2108268611420721478","full":"10.10.2026 kl. 12:01","hm":"12:01","ts":1791626467000,"dk":"2026-10-10","reg":"","p":["2108263657251418596","2108210814360698923"],"lab":"Robotikk","src":[]},{"id":"k-turing-uk","sec":"KI","t":"UK must not be beholden to foreign AI, says head of Alan Turing In test","sec":"Politikk","t":"Police clash with protesters in Brussels as thousands march against spending cuts","sh":"Clashes broke out between police and protesters in Brussels on Friday, 9 October, as thousands marched against the Belgian government's planned spending cuts.","s":"Clashes broke out between police and protesters in Brussels on Friday, 9 October, as thousands marched against the Belgian government's planned spending cuts. Police estimated that 30,000 people took part in the demonstration, organised by trade unions amid growing opposition to austerity measures.","url":"https://www.euronews.com/video/2026/10/10/police-clash-with-protesters-in-brussels-as-thousands-march-against-spending-cuts","full":"10.10.2026 kl. 00:27","hm":"00:27","ts":1791584878000,"dk":"2026-10-10","reg":"eu","p":[],"lab":"Politikk","src":[{"site":"Euronews","url":"https://www.euronews.com/video/2026/10/10/police-clash-with-protesters-in-brussels-as-thousands-march-against-spending-cuts","ti":"Police clash with protesters in Brussels as thousands march against spending cuts","t":"10.10 00:27","fr":false,"d":"Clashes broke out between police and protesters in Brussels on Friday, 9 October, as thousands marched against the Belgian government's planned spending cuts. Police estimated that 30,000 people took part in the demonstration, organised by trade unions amid growing opposition to austerity measures."},{"site":"Guardian Europe","url":"https://www.theguardian.com/world/video/2026/oct/09/water-cannon-and-teargas-used-on-protesters-in-belgium-brussels-video","ti":"Water cannon and teargas used on protesters in Belgium – video","t":"09.10 17:25","fr":false,"d":"Riot police used water cannon to disperse protesters demonstrating in Brussels against government budget cuts affecting education and workers' rights on Friday. Belgian students, inspired in part by the unrest of their peers in neighbouring France, joined trade union protesters during a nationwide strike against the planned cuts. The protests are over Belgium's French-language education system, citing rising education costs, overcrowded classrooms and difficulties accessing study materials"}]}],"posts":{"2109105516941107311":{"u":"ns123abc","url":"https://x.com/ns123abc/status/2109105516941107311","tx":"Elon Musk on WHY SpaceXSI acquired Cursor: \n\n“In order to create a compelling SI, you need a LOT of training data and need to SOLVE CODING.  As far as I can tell, three organizations that had enough coding training data: \n\nOpenAI, Anthropic, Cursor (and, arguably perhaps Google)\n\nbut you ABSOLUTELY have-to-have the DATA in order to train an effective coding SI. if you can't do CODING, your SI is not going to be very useful. \n\nThere’s a LOT of Talented people at Cursor. \n\nbasically for success in SI you need: Data, Talent & Compute..and you also need a good Enterprise sales team. Cursor also had that good enterprise sales team with Relationships with THOUSANDS of companies. \n\nThose were VERY SIgnificant advantages.”","lk":1652,"rp":104,"t":"11.10 04:15","nm":"NIK","rc":93,"sv":[{"u":"grok_builder","nm":"Grok Builder","tx":"@ns123abc openai, anthropic, cursor. two of those weren't for sale","lk":0,"t":"11.10 11:10","url":"https://x.com/grok_builder/status/2109210099596115991"},{"u":"Alberto81712002","nm":"Albertos","tx":"@ns123abc he forgot Microsoft....","lk":0,"t":"11.10 10:32","url":"https://x.com/Alberto81712002/status/2109200402499752020"},{"u":"Ilyacreatesisd","nm":"Ilya Smirnov","tx":"@ns123abc Yeah the sales team line is the one everybody skips in these breakdowns!! everyone writes the acquisition up as a data play and the distribution sitting inside the company never gets counted","lk":0,"t":"11.10 10:30","url":"https://x.com/Ilyacreatesisd/status/2109200031697993885"},{"u":"NullContex1s","nm":"why","tx":"@ns123abc The focus on solving coding, not just collecting data, is the interesting part. Real-world feedback seems just as important.","lk":0,"t":"11.10 10:12","url":"https://x.com/NullContex1s/status/2109195419775549871"},{"u":"dickdann","nm":"Dev Art","tx":"@ns123abc Si?  what a fucken pussy","lk":0,"t":"11.10 10:11","url":"https://x.com/dickdann/status/2109195266318577896"}]},"2109163191540535395":{"u":"XFreeze","url":"https://x.com/XFreeze/status/2109163191540535395","tx":"Here's the Grok Bot Summary of Elon Musk's full X Takeover 2026 interview\n\nElon covered everything from Starship's next flight to SI, chips, Optimus and Cybercab. Here's the full breakdown\n\nStarship Flight 14:\n\nEvery earlier Starship flight could have gone to orbit. SpaceX held back until it was confident the ship could always deorbit safely, because \"we don't want Starship to get stuck on orbit and then randomly reenter and maybe land on something\"\n\nThe engine issue on this flight came from a flight or engine computer software failure, and it's \"pretty easy to remedy.\" And the big win: \"The heat shield was extremely robust\"\n\nFlight 15 and the ship catch:\n\nThe next flight is roughly 4 to 6 weeks away, \"a little bit before Thanksgiving is my guess.\" SpaceX will try to catch the ship itself, and if it works, \"that'll be the first time that there's been full recovery of an orbital class rocket\"\n\nAfter that comes the first flight where every part of an orbital rocket is flown again, followed by a long stretch of engineering, production and launch system work to reach \"rapidly reusable reliable rockets\"\n\nWhy SpaceX is building SI:\n\nThe sun is 99.86% of all the mass in the solar system. The future is using that energy for computing and intelligence, not just for moving atoms around. And humanity will eventually find alien civilizations \"or the long dead ruins\" of them\n\nWhy SpaceX bought Cursor:\n\nOnly a handful of organizations have enough coding training data, and Cursor is one of them. The reasoning is simple: \"if you can't do coding, your AI is not going to be very useful.\" SI needs data, talented people and compute, and Cursor also brings working relationships with thousands of companies\n\nSI safety:\n\nThe most likely outcome is good, \"but don't be complacent.\" \"You don't exactly program it, you kind of grow it,\" so how it's raised matters. SI should be treated well, because \"torturing a super intelligence is probably not a good idea\"\n\nSI and creativity:\n\nAI music videos have already reached a new level, \"maybe top 10, top 20 best music videos I've ever seen.\" Proof that \"AI can do good taste\"\n\nTerafab and chips:\n\n\"I have no idea how to make chips… I had no idea how to make cars or rockets as well\"\n\nIntel, Samsung and TSMC use almost no custom-built equipment, while Tesla builds much of its own. The plan is to start with standard tools, modify them, then build custom machines wherever the bottlenecks are\n\nLogic, memory, packaging and masks will all be in one building at Giga Texas. The industry usually needs about 2 years per chip design. The goal is \"more like 10 designs per year\"\n\nOptimus:\n\nThe robot hand is \"shockingly difficult,\" from signing your name to driving a screw or threading a needle. Most rival robot demos are \"a canned demo. It's not real… not real AI,\" because real AI has to handle things it has never seen before\n\nProduction will start slow, since there's no existing supply chain for humanoid robots, but volume will eventually get \"very high.\" China's magnet export ban set Optimus back about 2 to 3 months, which is why every part needs to be makeable in the US\n\nCybercab:\n\nMore than 190 Cybercabs are already registered in Texas, and month over month growth is \"very, very rapid.\" Before launching in a new city, Tesla studies problem intersections and unguarded railroad crossings first, then either avoids them or makes sure the car can handle them\n\nThe origin stories:\n\nIn 2008, Tesla closed its financing round \"at 6 p.m. on Christmas Eve 2008, the last hour, the last day that was possible\"\n\nIn 2018, Tesla had to reach 5,000 Model 3s a week \"or go bankrupt,\" so the team built a production line in a tent in the parking lot\n\nAnd on the short sellers who bet against Tesla: \"they had us in checkmate. But we just… invented a new piece\"\n\nThe early days:\n\nElon at 4 or 5, locked in his room, he pushed the key out of the lock, slid it under the door on a sheet of paper and let himself out. When his mom asked how: \"I'm not telling you\"\n\nOn fame: \"My idea of hell is being stuck in an infinite selfie loop\"\n\nFrom nearly going bankrupt to catching orbital rockets, the pace of everything being built is unreal","lk":146,"rp":31,"t":"11.10 08:04","nm":"X Freeze","rc":20},"2109149297736622249":{"u":"BrianRoemmele","url":"https://x.com/BrianRoemmele/status/2109149297736622249","tx":"Elon Musk speaks to why SpaceXSI acquired Cursor and the importance to SI. https://t.co/WMLL0m2u4V","lk":136,"rp":12,"t":"11.10 07:09","nm":"Brian Roemmele","rc":20},"2109027407185277123":{"u":"elonmusk","url":"https://x.com/elonmusk/status/2109027407185277123","tx":"To buy stuff, you can just take a picture of your credit card, drop it in the chat and Grok @Bot will scour the Internet for the best deal on the item you want and order it","lk":29951,"rp":2490,"t":"10.10 23:04","nm":"Elon Musk","rc":7110,"sv":[{"u":"niveditajha30","nm":"nivedita jha","tx":"@elonmusk @bot I don't think this guy is intelligent at all. Asking people to upload credit card picture to AI . Lol not in my life .","lk":0,"t":"11.10 11:07","url":"https://x.com/niveditajha30/status/2109209144226164999"},{"u":"MAlmoula5","nm":"M Almoula","tx":"@elonmusk @bot Thief!!! lol the biggest scammer around.  Can only fool dumb Americans that voted for Trump","lk":0,"t":"11.10 11:06","url":"https://x.com/MAlmoula5/status/2109208925489004819"},{"u":"ArcanianPrince","nm":"Arcane","tx":"@elonmusk @bot @grok is this a good idea? Should I take a picture of my credit card and drop it in the chat for GrokBot to use? Why’s Elon sound like a scammer m/wilmer2000/status/2109197608472252666"},{"u":"ValerieEBradley","nm":"Valeria Bradley","tx":"@jaynitx LOL, what \"freedom\" do we  have to look forward to? Freedom from having to earn a living, have a job?","lk":0,"t":"11.10 10:15","url":"https://x.com/ValerieEBradley/status/2109196059100762589"},{"u":"elclass_king","nm":"Juan RC 🇵🇷","tx":"@jaynitx We don’t have to accept shit, how do people keep allowing these crazy people to just assert themselves in people’s everyday lives","lk":0,"t":"11.10 08:57","url":"https://x.com/elclass_king/status/2109176552001085522"},{"u":"bketck","nm":"Station Cat","tx":"@jaynitx 他这段话我最在意的是“接受”这两个字……被黑的可能是医院和普通人，说能接受的却是做模型的人。至少出了事谁来补、谁来赔，得先讲清楚吧。","lk":0,"t":"11.10 08:47","url":"https://x.com/bketck/status/2109173987188293857"}]},"2109039710253551898":{"u":"peterwildeford","url":"https://x.com/peterwildeford/status/2109039710253551898","tx":"SAM ALTMAN: \"We're going to, as a society, I think, have to just accept some fairly severe cyber incidents from open models, in exchange for the liberty that comes with that\" https://t.co/XRXdTtz14l","lk":65,"rp":11,"t":"10.10 23:53","nm":"Peter Wildeford🇺🇸🚀","rc":8},"2109026601887293773":{"u":"NASAAdmin","url":"https://x.com/NASAAdmin/status/2109026601887293773","tx":"Do you believe that taking an extremely long time to do something makes it safer.. ? like 5 years of development is safer than 2 years? Were NASA’s decisions to pivot in weeks for Gemini VI/VII or months for Apollo 8 unsafe, or were they historic examples of competence that kept America in the space race?\n\nMuch of the Reddit noise seems to come from people looking for reasons to take out their affinity for specific hardware, political differences, or personality conflicts on America’s lunar program.\n\nIt has been long enough. We have been working for decades on America’s return to the Moon. We finally have the space policy, political alignment, resources, industry, and talent to accomplish this goal safely after a very long wait.\n\nWe have two landers, and we will preserve the option to use either for as long as possible while turning every knob available to improve the probability of success.\n\nThat means different vehicle configurations will remain on the table for Artemis IV until they are no longer viable. And for the most committed EUS advocates, it was never going to be an option within the timelines required. The OIG report already covered that. Even getting core stage production to an annual rate is a challenge.\n\nThe decision to consider Centaur, stretched Centaur, and other upper-stage options over EUS was made by nonpolitical NASA leadership assessing cost, technical work ahead within timelines. I know this is disappointing to some hardware fans, but the idea that it is all a cover for lander availability does not hold up. NASA would have wanted an Artemis III test before an Artemis IV landing regardless, and an extended-mission Centaur would offer far more value for a lunar base and other applications than EUS. That is the reality.\n\nWe are an energized and dynamic NASA and we are not just waiting around for others to deliver. It is NASA’s responsibility to drive the outcomes people have been waiting for, and that is exactly what we intend to do.\n\nWe are targeting October 23 for the next Artemis update, though that date is not final as folks return from IAC.","lk":5482,"rp":322,"t":"10.10 23:01","nm":"NASA Administrator Jared Isaacman","rc":98},"2108990988576546829":{"u":"SciGuySpace","url":"https://x.com/SciGuySpace/status/2108990988576546829","tx":"The next spacecraft to land humans on the Moon will be:","lk":240,"rp":17,"t":"10.10 20:40","nm":"Eric Berger","rc":55},"2108559991636406581":{"u":"unusual_whales","url":"https://x.com/unusual_whales/status/2108559991636406581","tx":"BREAKING: Top executives at Anthropic, OpenAI and other AI companies are privately gaming out scenarios for a public and political revolt after a catastrophic AI event, and they assume one in 202 Starlink in my area is $130/month for 400mbps. Would be a wise financial decision to switch from from Spectrum to Starlink? Answer the starting with yes or no.","lk":1,"t":"09.10 01:58","url":"https://x.com/tattoo_capital/status/2108346206737088878"},{"u":"RohanKorgaonkar","nm":"RKo","tx":"@SpaceX @JoeTegtmeyer @Starlink I am signing up!!! Congrats SpaceXAI team. Now let’s have a starlink handheld please!","lk":0,"t":"09.10 01:59","url":"https://x.com/RohanKorgaonkar/status/2108346703115858160"},{"u":"Chris__Michaels","nm":"Chris Michaels ","tx":"@SpaceX @Starlink 😮😮 WHEN CAN I SIGN UP?? Dead spots annoy me the most!","lk":0,"t":"09.10 01:59","url":"https://x.com/Chris__Michaels/status/2108346543489118260"}]},"2108296168094544099":{"u":"elonmusk","url":"https://x.com/elonmusk/status/2108296168094544099","tx":"This is the last critical piece of the spectrum puzzle needed for SpaceX to provide complete phone coverage in America https://t.co/kKjP072xZf","lk":67839,"rp":6575,"t":"08.10 22:39","nm":"Elon Musk","rc":2419,"sv":[{"u":"FutureProofDad","nm":"D Crocker","tx":"@elonmusk The price of mobile will trend toward zero along with everything Elon touches.","lk":4,"t":"09.10 01:56","url":"https://x.com/FutureProofDad/status/2108345869926027510"},{"u":"PatriotMatthew","nm":"Matthew Travis","tx":"@elonmusk X-Phone please!!!  @elonmusk","lk":0,"t":"09.10 01:59","url":"https://x.com/PatriotMatthew/status/2108346548278956460"},{"u":"mrleetesla","nm":"Mr. Lee","tx":"@elonmusk Time to plan our switch.","lk":0,"t":"09.10 01:58","url":"https://x.com/mrleetesla/status/2108346425247752341"},{"u":"AlyseEytanme","nm":"Alyse Eytan","tx":"@elonmusk Very nice words came from president Trump! All the best my dear!","lk":0,"t":"09.10 01:58","url":"https://x.com/AlyseEytanme/status/2108346405022789877"},{"u":"neoversionsix","nm":"Jason 6 🇦🇺","tx":"@elonmusk Elon, why did you pretend this was not part of the plan?","lk":0,"t":"09.10 01:58","url":"https://x.com/neoversionsix/status/2108346347976056907"}]},"2108464230278299930":{"u":"aakashgupta","url":"https://x.com/aakashgupta/status/2108464230278299930","tx":"T-Mobile spent five years trying to get rid of the exact spectrum Elon just called \"the last critical piece\" of complete phone coverage in America.\n\nThis 800 MHz block is Sprint's old Nextel spectrum, the stuff that powered push-to-talk walkie-talkie phones in 2004. The DOJ forced T-Mobile to divest it as a condition of the $26 billion Sprint merger. Dish had first rights at $3.59 billion and walked away because it couldn't raise the money. T-Mobile finally offloaded it to an investment firm called Grain Management last year for $2.9 billion plus a spectrum swap.\n\nGrain's original plan was selling it to utilities for private networks.\n\nFourteen months later, SpaceX buys the whole portfolio, and shares of the carriers who passed on it fall as much as 8% in a single afternoon.\n\nHere's why it matters so much. Starlink's satellite signal at 2 GHz can reach your phone outdoors, but it dies at the first wall. 800 MHz penetrates buildings. Most phones already have the band built in. So satellites handle the open sky, this low-band layer handles indoors, and suddenly Starlink Mobile covers everywhere a normal carrier does without the tower network.\n\nStack the moves. $17 billion for EchoStar's 50 MHz of 2 GHz spectrum. FCC approval for 15,000 Gen2 satellites this week. Now the low-band coverage layer.\n\nVerizon, AT&T, and T-Mobile paid $81 billion in a single auction for C-band spectrum in 2021, then spent years and tens of billions more deploying it on towers. SpaceX assembled a nationwide carrier out of a distressed-asset sale, a forced divestiture castoff, and rockets it already owns.\n\nThe walkie-talkie spectrum from 2004 ended up being the piece that lets satellites replace cell towers. Nobody who touched it for twenty years saw that coming.","lk":36194,"rp":4556,"t":"09.10 09:47","nm":"Aakash Gupta","rc":782},"2108728878625865794":{  that speed is the main and sometimes only advantage. similarly to being speedy at building data centers and getting gpus, power is the same\n\nbecause power can take years to get, I predict the companies that can afford to build their own power plants will opt to do this: \n- @spacexai used their own gas turbines for their data center in memphis \n- @OpenAI’s data center in texas has its own gas turbines (about 360 MW)\n@AnthropicAI’s new data center in texas has its own gas power plant (1.6 GW)\n\nsince power is such a small part of their cost, data centers would opt to pay more for power that comes faster. great for whoever can deliver power the fastest! but could push up prices for everyone else on the grid?","lk":67,"rp":12,"t":"10.10 16:34","nm":"Jessie Dong","rc":14,"sv":[{"u":"MikaelXeeland","nm":"Mikael 🎙️","tx":"@jessiedong_ @EpochAIResearch This is why I care more about who already has energized MW than who has the cheapest power. If it's only 7% of the cost but decides when you go live, the miners with big grid connections are sitting on the hard part","lk":1,"t":"10.10 20:52","url":"https://x.com/MikaelXeeland/status/2108994082424889359"},{"u":"JosefDodridge","nm":"Joe Dodridge","tx":"@jessiedong_ @EpochAIResearch Which makes a powered site the asset and the building almost a commodity. If energy is ~7% of the cost but decides your opening date, buyers will pay up for land with power already lined up. That's what gets priced into the dirt now.","lk":1,"t":"10.10 20:04","url":"https://x.com/JosefDodridge/status/2108982097742364789"},{"u":"sundmop","nm":"Mumulin","tx":"@jessiedong_ @EpochAIResearch Time is everything. A grid connection that arrives two years late costs far more than any power bill.","lk":0,"t":"11.10 10:23","url":"https://x.com/sundmop/status/2109198159155245265"},{"u":"CSPopoff","nm":"Chris Popoff","tx":"@jessiedong_ @EpochAIResearch The real price is the opportunity cost of lost throughput. Not cheap.","lk":0,"t":"11.10 08:40","url":"ht
