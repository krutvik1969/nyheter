ities, while critics highlight India's cheap data, national security risks, and Starlink's limited initial capacity of about 0.18 million users.","url":"https://x.com/i/trending/2109177981252059278","full":"11.10.2026 kl. 09:06","hm":"09:06","ts":1791702399000,"dk":"2026-10-11","reg":"","p":["2108994867582095465","2109019308865282319","2109104485578748311"],"lab":"SpaceX","src":[]},{"id":"2109048043391922284","sec":"SpaceX","t":"Elon Musk Targets Starship Ship Catch in Flight 15","sh":"During a virtual interview at the X Takeover event in Texas, Musk highlighted Flight 14's solid heat shield and minor engine issue, setting up Flight 15 to attempt full recovery of an orbital-class rocket.","s":"During a virtual interview at the X Takeover event in Texas, Musk highlighted Flight 14's solid heat shield and minor engine issue, setting up Flight 15 to attempt full recovery of an orbital-class rocket. He also noted recovered Ship 40 has returned to Texas from the ocean, giving engineers key data, while touching on SpaceX's Cursor acquisition to boost AI coding for superintelligence. Success here could lead to Flight 16 re-flying recovered hardware, pushing toward routine reusability and lower launch costs.","url":"https://x.com/i/trending/2109048043391922284","full":"11.10.2026 kl. 09:06","hm":"09:06","ts":1791702395000,"dk":"2026-10-11","reg":"","p":["2109040901745983946","2109050360459616338","2109004774729269711"],"lab":"SpaceX","src":[]},{"id":"p-panama-skjelv","sec":"Politikk","t":"Powerful magnitude 7.7 earthquake hits Panama, damaging buildings","sh":"Jordskjelvet i Panama har ødelagt både veier og bygninger, men det er så langt ikke meldt om…","s":"Jordskjelvet i Panama har ødelagt både veier og bygninger, men det er så langt ikke meldt om… Det er så langt ikke meldt om omkomne etter det kraftige jordskjelvet i Panama fredag. Det opplyser landets president, José Raúl Mulino, til journalister natt til lørdag. Han sier at myndighetene som arbeider med å avklare situasjonen, foreløpig ikke har fått meldinger om omkomne. – Men de er i ferd med å avklare dette, sier Mulino. Han understreker samtidig at det bare er gått få timer siden jordskjelvet. Skjelvet, som hadde en styrke på 7,7, rammet Panama rundt klokken 20 norsk tid fredag. – Det er mulig at det er omkomne. Men la oss håpe at det ikke er det, sier presidenten.","url":"https://www.bbc.co.uk/news/articles/c620r39zdp9wo?at_medium=RSS&at_campaign=rss","full":"11.10.2026 kl. 08:56","hm":"08:56","ts":1791701768000,"dk":"2026-10-11","reg":"verden","p":[],"lab":"Politikk","src":[{"site":"BBC World","url":"https://www.bbc.co.uk/news/articles/c620r39zdp9wo?at_medium=RSS&at_campaign=rss","ti":"Powerful magnitude 7.7 earthquake hits Panama, damaging buildings","t":"09.10 23:26","fr":false},{"site":"Euronews","url":"https://www.euronews.com/2026/10/09/tsunami-threat-after-76-magnitude-earthquake-strikes-panama-usgs-says","ti":"Powerful 7.7-magnitude earthquake strikes Panama, damaging buildings","t":"09.10 20:40","fr":false},{"site":"NRK Nyheter","url":"https://www.nrk.no/nyheter/kraftig-jordskjelv-i-panama-1.18051095","ti":"Kraftig jordskjelv i Panama","t":"09.10 20:05","fr":true},{"site":"Aftenposten","url":"https://www.aftenposten.no/verden/i/KrL0WX/panamas-president-kaller-jordskjelvet-en-stor-katastrofe-ingen-omkomne-meldt-saa-langt?utm_medium=rss","ti":"Panamas president kaller jordskjelvet en «stor katastrofe» – ingen omkomne meldt så langt","t":"10.10 10:13","fr":false},{"site":"NRK Nyheter","url":"https://www.nrk.no/nyheter/panamas-president_-ingen-opplysninger-om-omkomne-1.18051238","ti":"Panamas president: Ingen opplysninger om omkomne","t":"10.10 02:40","fr":true},{"site":"Euronews","url":"https://www.euronews.com/video/2026/10/10/panic-in-panama-as-77-quake-hits-cathedral-collapses-and-tsunami-warnings-spread","ti":"Panic in Panama as 7.7 quake hits, cathedral collapses and tsunami warnings spread","t":"10.10 12:11","fr":false},{"site":"Guardian World","url":"https://www i could make it difficult to convene meetings of the rate-setting panel, a policymaker said, as an…","s":"The potential suspension of Polish central bank governor Adam Glapinski could make it difficult to convene meetings of the rate-setting panel, a policymaker said, as an “unprecedented” legal challenge raises questions about the institution’s leadership.","url":"https://www.bloomberg.com/news/articles/2026-10-10/poland-central-bank-faces-meeting-hurdles-without-glapinski-pap","full":"10.10.2026 kl. 13:02","hm":"13:02","ts":1791630171000,"dk":"2026-10-10","reg":"","p":[],"lab":"Økonomi","src":[{"site":"Bloomberg Markets","url":"https://www.bloomberg.com/news/articles/2026-10-10/poland-central-bank-faces-meeting-hurdles-without-glapinski-pap","ti":"Poland Central Bank Faces Meeting Hurdles Without Glapinski: PAP","t":"10.10 13:02","fr":false}]},{"id":"p-sicilia-tornado","sec":"Politikk","t":"Dozens injured and buildings damaged as tornadoes hit Sicily","sh":"Marsala on island’s west coast badly affected after powerful storm approached from Mediterranean Two tornadoes have struck the coastal town of Marsala in western Sicily,…","s":"Marsala on island’s west coast badly affected after powerful storm approached from Mediterranean Two tornadoes have struck the coastal town of Marsala in western Sicily, injuring dozens of people, damaging buildings including a school, and overturning cars. A series of videos began to circulate on Friday morning showing two waterspouts approaching the Sicilian town from the sea as people braced for their arrival.","url":"https://www.theguardian.com/world/2026/oct/10/tornado-hit-marsala-sicily-injuries-damage","full":"10.10.2026 kl. 13:00","hm":"13:00","ts":1791630031000,"dk":"2026-10-10","reg":"eu","p":[],"lab":"Politikk","src":[{"site":"Guardian World","url":"https://www.theguardian.com/world/2026/oct/10/tornado-hit-marsala-sicily-injuries-damage","ti":"Dozens injured and buildings damaged as tornadoes hit Sicily","t":"10.10 13:00","fr" ogy versus faith.","url":"https://x.com/i/trending/2108188562327749119","full":"10.10.2026 kl. 12:59","hm":"12:59","ts":1791629999000,"dk":"2026-10-10","reg":"eu","p":["2108147274937225481","2108163565672870151","2108590520104636879"],"lab":"Politikk","src":[]},{"id":"2108839362003943909","sec":"Tesla","t":"Tesla's Digital Optimus Masters Half of Diablo Campaign from Screen Pixels Alone","sh":"Digital Optimus, a Tesla and SpaceXAI project, plays games like Diablo, Counter-Strike, and League of Legends using only raw screen pixels as input and keyboard-mouse actions as output.","s":"Digital Optimus, a Tesla and SpaceXAI project, plays games like Diablo, Counter-Strike, and League of Legends using only raw screen pixels as input and keyboard-mouse actions as output. This vision-only approach mirrors Tesla's Full Self-Driving tech and aims to generalize across all games, with skills transferring to web browsing, apps, and robotics. Tesla is hiring engineers in Palo Alto to build agents that handle AAA titles at superhuman levels, marking an early step toward AI that controls computers autonomously like humans.","url":"https://x.com/i/trending/2108839362003943909","full":"10.10.2026 kl. 12:59","hm":"12:59","ts":1791629974000,"dk":"2026-10-10","reg":"","p":["2108823477071303109","2108779986173993233","2108829766099022210"],"lab":"Tesla","src":[]},{"id":"2108177955922776189","sec":"Tesla","t":"Tesla Renames Full Self-Driving to Assisted Driving in Europe","sh":"The rebranding targets websites, apps, and order pages, addressing concerns that the old name misled drivers about a system needing constant attention.","s":"The rebranding targets websites, apps, and order pages, addressing concerns that the old name misled drivers about a system needing constant attention. Germany now backs faster EU-wide approval after September discussions, while Enhanced Autopilot becomes 'Tesla Assisted Driving Basic' at about €99 monthly in some markets. Eight countries already permit it, with Slovakia next and an EU vote eyed for December; Tesla also capped speed offsets at 10% and insurers like Lemonade offer up to 50% discounts for safer miles.","url":"https://x.com/i/trending/2108177955922776189","full":"10.10.2026 kl. 12:59","hm":"12:59","ts":1791629972000,"dk":"2026-10-10","reg":"","p":["2108272012514967787","2108152587199406295","2108290497651569128"],"lab":"Tesla","src":[]},{"id":"2108196079330021714","sec":"Politikk","t":"Zelenskyy Rejects Rubio's Stalemate View, Demands Tougher Russia Sanctions","sh":"On October 8 in Pryluky, northern Ukraine, President Volodymyr Zelenskyy dismissed U.S.","s":"On October 8 in Pryluky, northern Ukraine, President Volodymyr Zelenskyy dismissed U.S. Secretary of State Marco Rubio's description of the Russia-Ukraine war as a strategic stalemate. He called for shutting down Russia's economy through full sanctions on weapons and sales, plus unrestricted U.S. Starlink access to help Ukraine gain air superiority and force Putin to negotiate. Zelenskyy argued the real barrier is lack of will, not deadlock, amid ongoing strikes and upcoming U.S.-Ukraine talks.","url":"https://x.com/i/trending/2108196079330021714","full":"10.10.2026 kl. 12:59","hm":"12:59","ts":1791629964000,"dk":"2026-10-10","reg":"eu","p":["2108189232841781481","2108225846695596527"],"lab":"Politikk","src":[]},{"id":"2108874010465272158","sec":"Okonomi","t":"Fitch Brightens Nigeria's Credit Outlook to Positive Amid Reforms","sh":"Fitch kept Nigeria's 'B' rating intact but changed the outlook from Stable to Positive on October 9, citing $54.9 billion in reserves, a flexible naira, and inflation dropping to a projected 15.4 percent.","s":"Fitch kept Nigeria's 'B' rating intact but changed the outlook from Stable to Positive on October 9, citing $54.9 billion in reserves, a flexible naira, and inflation dropping to a projected 15.4 percent. The government, led by Finance Minister Taiwo Oyedele, pointed to oil production hitting 1.5 million barrels daily, 1945","2108283821292699815"],"lab":"Teknologi","src":[]},{"id":"2108268611420721478","sec":"Robotikk","t":"Aether AI Unveils CRIS-0 Robot Mastering Home Tasks with Causal Reasoning","sh":"The San Diego startup, founded this year by UC San Diego professor Biwei Huang, released videos on October 8 showing CRIS-0 guiding a robot through tasks like coffee pouring and pick-and-place by reasoning about cause and effect.","s":"The San Diego startup, founded this year by UC San Diego professor Biwei Huang, released videos on October 8 showing CRIS-0 guiding a robot through tasks like coffee pouring and pick-and-place by reasoning about cause and effect. The system uses a causality-guided agent and world model to break tasks into stages, predict outcomes, verify results, and replan quickly after disruptions like moved objects. Early tests highlight fast recovery and high success rates, drawing from Huang's causal discovery research, with potential to extend beyond robotics.","url":"https://x.com/i/trending/2108268611420721478","full":"10.10.2026 kl. 12:01","hm":"12:01","ts":1791626467000,"dk":"2026-10-10","reg":"","p":["2108263657251418596","2108210814360698923"],"lab":"Robotikk","src":[]},{"id":"k-turing-uk","sec":"KI","t":"UK must not be beholden to foreign AI, says head of Alan Turing Institute","sh":"George Williamson says ‘national resilience’ is key focus of ATI amid US and China’s runaway leadership in field The UK must not become dependent on foreign AI systems that can…","s":"George Williamson says ‘national resilience’ is key focus of ATI amid US and China’s runaway leadership in field The UK must not become dependent on foreign AI systems that can be switched off at short notice and must develop its own versions of the technology, according to the head of the Alan Turing Institute. The country needs a stronger domestic position in AI in response to the US and China’s runaway leadership in the field, with “national resilience” a key focus for ATI said George Willia med said. “Classes can be so packed you can’t interact with the teacher. In this year’s heatwaves, it felt like 40 degrees in overcrowded classrooms with no shade or curtains. It was so hot my brain couldn’t fun.","url":"https://www.bbc.co.uk/news/articles/crq5nlqnn184o?at_medium=RSS&at_campaign=rss","full":"10.10.2026 kl. 11:00","hm":"11:00","ts":1791622853000,"dk":"2026-10-10","reg":"eu","p":[],"lab":"Politikk","src":[{"site":"BBC World","url":"https://www.bbc.co.uk/news/articles/crq5nlqnn184o?at_medium=RSS&at_campaign=rss","ti":"'Everyone hates the police' – what France's school protests reveal about a divided nation","t":"10.10 01:24","fr":false},{"site":"BBC World","url":"https://www.bbc.co.uk/news/articles/c6vg98lw017po?at_medium=RSS&at_campaign=rss","ti":"France promises 3,000 extra teachers in first step to calm student protests","t":"09.10 13:35","fr":false},{"site":"Aftenposten","url":"https://www.aftenposten.no/verden/i/BMMML7/elevopproeret-i-frankrike-3000-vikarlaerere-er-ikke-nok?utm_medium=rss","ti":"Elevopprøret er det største på flere tiår. – Kan påvirke presidentvalget","t":"09.10 18:18","fr":false},{"site":"Guardian World","url":"https://www.theguardian.com/world/2026/oct/10/school-protesters-sevran-paris-suburb-france","ti":"‘We’re not asking for luxury’: school protesters in Paris suburb feel abandoned by French state","t":"10.10 11:00","fr":false}]},{"id":"v-A95oPRpnQbU","sec":"Video","t":"CEO i Kongsberg om kritisk infrastruktur og SpaceX som konkurrent/partner","sh":"Kongsbergs konsernsjef Eirik Lie i samtale med Nordnet under Nordnet Live om kritisk infrastruktur og om SpaceX som konkurrent og partner. Kongsberg…","s":"Kongsbergs konsernsjef Eirik Lie i samtale med Nordnet under Nordnet Live om kritisk infrastruktur og om SpaceX som konkurrent og partner. Kongsberg Gruppen driver i dag hovedsakelig med forsvar og romfart, blant annet missiler og luftvernsystemer.","url":"https://www.youtube.com/watch?v=A95oPRpnQbU","full":"10.10.2026 kl. 11:0  Sawyer Merritt's 76-year-old mother called her first ride roomy, clean like first class, and one she'd recommend to everyone. The rapid growth points to Tesla shifting from testing to wider robotaxi rollout about a month after Austin rides began.","url":"https://x.com/i/trending/2108235573076910328","full":"10.10.2026 kl. 08:43","hm":"08:43","ts":1791614610000,"dk":"2026-10-10","reg":"","p":["2108358152005783749","2108325645516419402","2108361646465003814"],"lab":"Tesla","src":[]},{"id":"2108729078027337746","sec":"Okonomi","t":"Stock Markets Hit Records as Consumer Confidence Plunges to 1951 Low","sh":"The S&P 500 closed at 7,811.54 and the Nasdaq at 27,366.17 on Friday, marking their strongest weekly gains ever with both up 0.6% that day and over 1% for the week.","s":"The S&P 500 closed at 7,811.54 and the Nasdaq at 27,366.17 on Friday, marking their strongest weekly gains ever with both up 0.6% that day and over 1% for the week. Meanwhile, the University of Michigan’s October survey showed consumer sentiment dropping to 46.3, with the Current Economic Conditions Index crashing 12.2% to 44.7—its lowest since records began in 1951. Americans blame high prices, borrowing costs, and gas tied to global tensions, revealing a sharp split where stock owners thrive but lower-income households struggle amid rising inflation expectations.","url":"https://x.com/i/trending/2108729078027337746","full":"10.10.2026 kl. 08:42","hm":"08:42","ts":1791614578000,"dk":"2026-10-10","reg":"","p":["2108672097954500662","2108650756941451466"],"lab":"Økonomi","src":[]},{"id":"e-polestar5","sec":"Elbiler","t":"Polestars første egne modell er et råskinn","sh":"Polestar 5 er modellen de egentlig alltid har hatt lyst til å lage og det skjønner vi godt etter en kjøretur.","s":"Polestar 5 er modellen de egentlig alltid har hatt lyst til å lage og det skjønner vi godt etter en kjøretur.","url":"https://www.finansavisen.no/motor/2026/10/10/8384209/test-av-polestar-5","full":"10.10.2026 kl. 08:40 function srcOf(k){const [sid,i]=k.split('~');const s=SM[sid];return s&&s.src[+i]?[s,s.src[+i],+i]:null;}
function storyOf(pid){return D.stories.find(s=>s.p.includes(pid));}
function markSel(kind,id){document.querySelectorAll('.sel').forEach(e=>e.classList.remove('sel'));if(kind==='src'){document.querySelectorAll(`[data-src="${id}"].chip`).forEach(e=>e.classList.add('sel'));document.querySelectorAll(`[data-card="${id.split('~')[0]}"]`).forEach(e=>e.classList.add('sel'));return;}document.querySelectorAll(kind==='post'?`[data-post="${id}"].chip`:`[data-story="${id}"].chip`).forEach(e=>e.classList.add('sel'));
const sid=kind==='post'?(storyOf(id)||{}).id:id;document.querySelectorAll(`[data-card="${sid}"]`).forEach(e=>e.classList.add('sel'));}
function info(kind,id){if(kind==='story'&&SM[id]&&SM[id].v)return {label:'Video: '+SM[id].ch+' – '+SM[id].t,url:SM[id].url};if(kind==='src'){const [s,a]=srcOf(id);return {label:a.site+': '+a.ti,url:a.url};}if(kind==='story'&&SM[id].src.length)return {label:'Sak: '+SM[id].t,url:SM[id].src[0].url};return kind==='post'?{label:'Innlegg fra @'+D.posts[id].u,url:D.posts[id].url}:{label:'Sak: '+SM[id].t,url:SM[id].url};}
function hashItem(){const m=location.hash.match(/^#(post|story|src)=([\w~-]+)$/);return m&&((m[1]==='post'&&D.posts[m[2]])||(m[1]==='story'&&SM[m[2]])||(m[1]==='src'&&srcOf(m[2])))?[m[1],m[2]]:null;}
// global klikk-delegering: chips, innlegg, kort, «Vis eldre»
document.addEventListener('click',e=>{if(e.target.closest('#older')){e.preventDefault();eldre();return;}if(e.ctrlKey||e.metaKey||e.shiftKey)return;
const t=e.target.closest('[data-post],[data-story],[data-card],[data-src]');if(!t||t.closest('.tabrow'))return;if(e.target.closest('a.btn,#openNew'))return;
e.preventDefault();if(t.dataset.src)show('src',t.dataset.src);else if(t.dataset.post)show('post',t.dataset.post);else show('story',t.dataset.story||t.dataset.card);});
let cur=null;
function show(kind,id){document.getElementById('view').innerHTML=kind==='post'?postHTML(id):kind==='src'?srcHTML(id):storyHTML(id);const i=info(kind,id);document.getElementById('label').textContent=i.label;document.getElementById('openNew').href=i.url;cur=[kind,id];markSel(kind,id);
const c=document.querySelector('.item.sel');if(c)c.scrollIntoView({block:'nearest'});history.replaceState(null,'','#'+kind+'='+id);if(innerWidth<=860&&window.event&&window.event.type==='click')document.getElementById('right').scrollIntoView({behavior:'smooth'});}
let curF='alle',curR='',curQ='';const subsEls=[...document.querySelectorAll('.subs')];const LIST=document.getElementById('list');
function match(s){let ok=curF==='alle'?s.sec!=='Video':s.sec===curF;if(ok&&(curF==='Politikk'||curF==='Video')&&curR)ok=s.reg===curR;if(ok&&curF==='Video'&&curQ)ok=((s.ch||'')+' '+s.t).toLowerCase().includes(curQ);return ok;}
function li(s){const ny=NY.has(s.id)?'<span class="ny">NY</span>':'';const tm=`<time>${s.dk===TODAY||s.dk===YEST?'':dayShort(s.dk)+' '}${s.hm}</time>`;
if(s.sec==='Video')return `<li class="item vitem c-Video" data-sec="Video" data-reg="${s.reg}" data-card="${s.id}"><div class="vth"><img src="${esc(s.th)}" alt="" loading="lazy" width="160" height="90">${s.dur?`<b>${esc(s.dur)}</b>`:''}</div>`+
`<div class="vtx"><div class="im"><span class="tag">${esc(s.lab)}${ny}</span>${tm}</div><h3>${esc(s.t)}</h3><div class="vch">${esc(s.ch)}</div><p>${esc(s.sh)}</p></div></li>`;
return `<li class="item c-${s.sec}" data-sec="${s.sec}" data-reg="${s.reg}" data-card="${s.id}"><div class="im"><span class="tag">${esc(s.lab)}${ny}</span>${tm}</div><h3>${esc(s.t)}</h3><p>${esc(s.sh)}</p>${chipsHTML(s)}</li>`;}
function render(){const L=D.stories.filter(s=>s.dk>=shownFrom&&match(s)).sort((a,b)=>b.ts-a.ts);let h='',dk='';
for(const s of L){if(s.dk!==dk){dk=s.dk;h+=`<li class="day" data-dk="${dk}">${dayLabel(dk)}</li>`;}h+=li(s);}
if(!L.length)h+='<li class="empty">Ingen saker de siste dagene her.</li>';
if(D.days.some(d=>d.dk<shownFrom))h+='<li class="morebox"><button id="older" class="btn ghost">Vis eldre nyheter</button></li>';
LIST.innerHTML=h;if(cur)markSel(cur[0],cur[1]);}
async function hentMnd(ms){for(const m of ms){if(loadedM.has(m)||!D.months.includes(m))continue;
const r=await fetch('arkiv/'+m+'.json',{cache:'no-cache'});if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();
Object.assign(D.posts,j.posts);j.stories.forEach(s=>{if(!SM[s.id]){SM[s.id]=s;D.stories.push(s);}});loadedM.add(m);}}
async function eldre(){const b=document.getElementById('older');if(b){b.disabled=true;b.textContent='Laster …';}
try{for(;;){const older=D.days.filter(d=>d.dk<shownFrom);if(!older.length)break;const nd=older.slice(0,2);const from=nd[nd.length-1].dk;
await hentMnd([...new Set(nd.map(d=>d.m))]);const prev=shownFrom;shownFrom=from;if(D.stories.some(s=>s.dk>=from&&s.dk<prev&&match(s)))break;}
render();}catch(err){if(b){b.disabled=false;b.textContent='Kunne ikke hente eldre nyheter ('+err.message+') – prøv igjen';}}}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));curF=b.dataset.f;curR='';
subsEls.forEach(d=>{d.hidden=d.dataset.for!==curF;d.querySelectorAll('.sub').forEach((x,i)=>x.classList.toggle('on',i===0));});
b.scrollIntoView({block:'nearest',inline:'nearest'});render();LIST.scrollTop=0;
if(curF==='Video'&&innerWidth>860){const c=cur&&SM[cur[1]];if(!c||!c.v){const f=document.querySelector('.item[data-sec="Video"]');if(f)show('story',f.dataset.card);}}});
document.querySelectorAll('.sub').forEach(b=>b.onclick=()=>{b.parentNode.querySelectorAll('.sub').forEach(x=>x.classList.toggle('on',x===b));curR=b.dataset.r;render();});
const vq=document.getElementById('vq');if(vq)vq.oninput=()=>{curQ=vq.value.trim().toLowerCase();render();};
function split2(t){const p=t.split(/(?<=[.!?])\s+(?=[A-ZÆØÅ«0-9])/);return [p.slice(0,2).join(' '),p.slice(2).join(' ')];}
storyHTML=function(id){const s=SM[id];const [a,b]=split2(s.s);
return `<div class="cs c-${s.sec}"><div class="mt"><span class="tag">${esc(s.lab)}</span><span>${s.full}</span></div><h2>${esc(s.t)}</h2>
<p class="sum">${esc(a)}${b?` <span class="more">${esc(b)}</span><button class="vm" onclick="const c=this.closest('.cs');c.classList.toggle('exp');this.textContent=c.classList.contains('exp')?'Vis mindre':'Vis mer'">Vis mer</button>`:''}</p>
<div class="acts"><a class="btn" href="${s.url}" target="_blank" rel="noopener">Åpne på X ↗</a><small>X-oppsummering – kan inneholde feil</small></div>
<h4>Originale innlegg</h4><div class="rows">`+s.p.map(p=>{const q=D.posts[p];return `<button class="row" data-post="${p}" title="${esc(q.tx)}"><b>@${esc(q.u)}</b><span class="tx">${esc(q.tx)}</span><span class="lk">♥ ${fmt(q.lk)}</span></button>`}).join('')+`</div></div>`;};
let showMedia=false;
postHTML=function(id){const s=storyOf(id);
const rel=s?s.p.map(p=>`<a class="chip${p===id?' sel':''}" data-post="${p}" href="${D.posts[p].url}" target="_blank" rel="noopener">@${esc(D.posts[p].u)}</a>`).join('')+`<a class="chip story" data-story="${s.id}" href="${s.url}" target="_blank" rel="noopener">Saken</a>`:'';
return `<div class="pw"><iframe class="embed" id="emb" title="Innlegg fra @${esc(D.posts[id].u)}" src="https://platform.twitter.com/embed/Tweet.html?id=${id}&theme=dark&dnt=true&lang=no&hideThread=true${showMedia?'':'&hideCard=true'}" allowfullscreen></iframe>
<div class="rel"><span>Relaterte innlegg</span>${rel}<button class="media" data-pid="${id}" onclick="showMedia=!showMedia;show('post',this.dataset.pid)">${showMedia?'Skjul bilder':'Vis bilder'}</button></div></div>`;};
addEventListener('message',e=>{if(e.origin!=='https://platform.twitter.com')return;let d=e.data;try{if(typeof d==='string')d=JSON.parse(d)}catch(_){return}
const m=d&&d['twttr.embed'];if(m&&m.method==='twttr.private.resize'&&m.params&&m.params[0]){const f=document.getElementById('emb');if(f)f.style.height=Math.ceil(m.params[0].height)+'px';}});

const _storyX=storyHTML;
function srcRows(s,cur){return `<div class="rows">`+s.src.map((a,i)=>`<button class="row${cur===i?' sel':''}" data-src="${s.id}~${i}" title="${esc(a.ti)}"><b>${esc(a.site)}</b><span class="tx">${esc(a.ti)}</span><span class="lk">${a.t}${a.fr?'':' ↗'}</span></button>`).join('')+`</div>`;}
function techCard(s,a,i){const [x,y]=split2(s.s);const u=a?a.url:s.src[0].url;
return `<div class="cs c-${s.sec}"><div class="mt"><span class="tag">${esc(s.lab)}</span><span>${a?esc(a.site)+' · ':''}${s.full}</span></div><h2>${esc(s.t)}</h2>
<p class="sum">${esc(x)}${y?` <span class="more">${esc(y)}</span><button class="vm" onclick="const c=this.closest('.cs');c.classList.toggle('exp');this.textContent=c.classList.contains('exp')?'Vis mindre':'Vis mer'">Vis mer</button>`:''}</p>
<div class="acts"><a class="btn" href="${u}" target="_blank" rel="noopener">Åpne artikkelen ↗</a><small>${a?esc(a.site)+' kan ikke vises inne i siden (blokkerer innbygging)':'Ingress fra nettstedene (originalspråk)'}</small></div>
<h4>Kilder (${s.src.length})</h4>${srcRows(s,a?i:-1)}</div>`;}
function videoHTML(s){const [x,y]=split2(s.s);
return `<div class="vw c-Video"><div class="vfr"><iframe id="yt" title="${esc(s.t)}" src="https://www.youtube-nocookie.com/embed/${s.v}?rel=0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>
<div class="cs c-Video"><div class="mt"><span class="tag">🎬 ${esc(s.lab)}</span><span>${esc(s.ch)} · ${s.full}${s.dur?' · '+esc(s.dur):''}</span></div><h2>${esc(s.t)}</h2>
<p class="sum">${esc(x)}${y?` <span class="more">${esc(y)}</span><button class="vm" onclick="const c=this.closest('.cs');c.classList.toggle('exp');this.textContent=c.classList.contains('exp')?'Vis mindre':'Vis mer'">Vis mer</button>`:''}</p>
<div class="acts"><a class="btn" href="${s.url}" target="_blank" rel="noopener">Åpne på YouTube ↗</a><small>Sammendrag fra videoens tittel/beskrivelse (originalspråk)</small></div></div></div>`;}
storyHTML=function(id){const s=SM[id];return s.v?videoHTML(s):s.src.length?techCard(s,null,-1):_storyX(id);};
function srcHTML(k){const [s,a,i]=srcOf(k);if(!a.fr)return techCard(s,a,i);
return `<div class="aw"><div class="rel"><span>Kilder</span>`+s.src.map((b,j)=>`<a class="chip site${j===i?' sel':''}${b.fr?'':' nf'}" data-src="${s.id}~${j}" href="${b.url}" target="_blank" rel="noopener">${esc(b.site)}</a>`).join('')+`<a class="chip story" data-story="${s.id}" href="${s.src[0].url}" target="_blank" rel="noopener">Sammendrag</a></div>
<iframe class="art" title="${esc(a.ti)}" src="${a.url}" sandbox="allow-scripts allow-same-origin allow-popups allow-forms" referrerpolicy="no-referrer" loading="lazy"></iframe>
<small class="artn">Vises ikke siden riktig? Bruk «↗ Åpne i nytt vindu» øverst.</small></div>`;}
render();
const h=hashItem();if(h)show(h[0],h[1]);else{const f=document.querySelector('.item[data-card]');if(f)show('story',f.dataset.card);}
</script></body></html>
