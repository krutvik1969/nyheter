const teKurs=()=>{const k=TE.kurs;if(!k||k.pris==null)return '';const up=k.endring>=0;return `<div class="sxkurs"><a href="${esc(k.url)}" target="_blank" rel="noopener"><b>TSLA</b></a> <span class="px">$${k.pris.toFixed(2)}</span> <span class="${up?'opp':'ned'}">${up?'▲':'▼'} ${up?'+':''}${k.endring.toFixed(2)} %</span><small>Nasdaq${k.nar?' · '+esc(k.nar):''}</small></div>`;};
function teTall(o,max){const L=TE.tall.filter(t=>t.omr===o).slice(0,max||99);if(!L.length)return '<p class="sxtom">Ingen kildebelagte tall ennå.</p>';
return '<ul class="sxtall">'+L.map(t=>`<li><span class="nv">${esc(t.navn)}</span><span class="vd">${esc(t.verdi)}</span><a class="kl" href="${esc(t.kilde)}" target="_blank" rel="noopener">${esc(t.kildenavn)} ↗</a><small>${t.dato?dNo(t.dato):'hentet '+dNo(t.hentet)}</small></li>`).join('')+'</ul>';}
const teSaker=(o,n)=>(TE.top[o]||[]).slice(0,n).map(s=>`<button class="sxsak" data-sxsak="${s.id}" data-dk="${s.dk}"><small>${dNo(s.dk)}</small> ${esc(s.t)}</button>`).join('')||'<p class="sxtom">Ingen saker i arkivet ennå.</p>';
function teDash(o){let h='<div class="sxdash tedash">';
if(!o){h+=`<div class="sxhead"><h2>⚡ Tesla – oversikt</h2>${teKurs()}</div>`;
if(TE.uke){h+=`<section class="sxkort uke"><h3>Ukens Tesla <small>${esc(TE.uke.periode||'')}</small></h3>`+Object.keys(TE.omr).map(k=>TE.uke.omr[k]?`<p><b>${TE.ikon[k]} ${esc(TE.omr[k])}:</b> ${esc(TE.uke.omr[k])}</p>`:'').join('')+`<small class="sxmerk">${esc(TE.uke.merk||'')}</small></section>`;}
h+='<section class="sxkort"><h3>Kommende milepæler</h3>'+(TE.kal.length?'<ul class="sxkal">'+TE.kal.map(k=>`<li><b>${dNo(k.dato)}</b> ${esc(k.tittel)}${k.bekreftet===false?' <i>(ikke bekreftet)</i>':''}${k.kilde?` <a href="${esc(k.kilde)}" target="_blank" rel="noopener">${esc(k.kildenavn||"kilde")} ↗</a>`:''}</li>`).join('')+'</ul>':'<p class="sxtom">Ingen kommende datoer i kalenderen.</p>')+'</section>';
h+='<div class="sxgrid">'+Object.keys(TE.omr).map(k=>`<section class="sxkort"><h3>${TE.ikon[k]} ${esc(TE.omr[k])}</h3><h4>Nøkkeltall</h4>${teTall(k)}<h4>Siste saker</h4>${teSaker(k,3)}<button class="btn ghost" data-teomr="${k}">Se alle (${TE.n[k]||0}) →</button></section>`).join('')+'</div>';}
else{h+=`<div class="sxhead"><h2>${TE.ikon[o]} ${esc(TE.omr[o])}</h2>${o==='aksje'?teKurs():''}<button class="btn ghost" data-teomr="">← Tesla-oversikt</button></div>`;
h+=`<section class="sxkort"><h3>Nøkkeltall</h3>${teTall(o)}</section>`;
if(TE.uke&&TE.uke.omr&&TE.uke.omr[o])h+=`<section class="sxkort uke"><h3>Ukens Tesla <small>${esc(TE.uke.periode||'')}</small></h3><p class="sxuke">${esc(TE.uke.omr[o])}</p></section>`;
h+=`<section class="sxkort"><h3>Siste saker</h3>${teSaker(o,5)}</section>`;}
return h+'<p class="sxmerk">Tall vises bare med kilde og dato. X-oppsummeringer kan inneholde feil.</p></div>';}
function visTe(o){document.getElementById('view').innerHTML=teDash(o||'');document.getElementById('label').textContent='Tesla'+(o?' – '+TE.omr[o]:' – oversikt');
document.getElementById('openNew').href='https://ir.tesla.com/';cur=null;document.querySelectorAll('.sel').forEach(e=>e.classList.remove('sel'));history.replaceState(null,'',location.pathname+location.search);document.getElementById('view').scrollTop=0;}
function teTopp(){if(curR==='alle')return '';if(!curR)return `<li class="sxtop">${teKurs()}<div class="sxtl">${TE.uke?'<b>Ukens Tesla</b> '+esc(TE.uke.periode||''):''}</div><button class="btn ghost" data-sxdash="">Vis Tesla-oversikt og nøkkeltall</button></li>`;
const n=TE.tall.filter(x=>x.omr===curR).length;return `<li class="sxtop"><h3>${TE.ikon[curR]} ${esc(TE.omr[curR])} – nøkkeltall</h3>${teTall(curR,3)}${n>3?`<button class="btn ghost" data-sxdash="">Alle ${n} nøkkeltall →</button>`:''}</li>`;}
document.addEventListener('click',e=>{const a=e.target.closest('[data-teomr]');if(!a||e.ctrlKey||e.metaKey||e.shiftKey)return;e.preventDefault();e.stopPropagation();
const o=a.dataset.teomr;const tb=document.querySelector('.tab[data-f="Tesla"]');if(curF!=='Tesla'&&tb)tb.click();
const sb=document.querySelector(`.subs[data-for="Tesla"] .sub[data-r="${o}"]`);if(sb)sb.click();visTe(o);},true);

// ---- ☀️/🌙 tema: lagres i localStorage, standard = systemets innstilling; X-innbygginger lastes om med riktig tema ----
function settTema(tm,lagre){document.documentElement.dataset.tema=tm;if(lagre){try{localStorage.setItem('tema',tm);}catch(_){}}
const m=document.querySelector('meta[name=theme-color]');if(m)m.content=tm==='lys'?'#ffffff':'#0e1117';
const b=document.getElementById('tema');if(b){b.textContent=tm==='lys'?'🌙':'☀️';b.title=tm==='lys'?'Bytt til mørkt tema':'Bytt til lyst tema';}
document.querySelectorAll('iframe.embed').forEach(f=>{if(f.src.includes('platform.twitter.com')){const u=f.src.replace(/theme=(light|dark)/,'theme='+xTema());if(u!==f.src)f.src=u;}});}
document.getElementById('tema')?.addEventListener('click',()=>settTema(document.documentElement.dataset.tema==='lys'?'mork':'lys',true));
try{matchMedia('(prefers-color-scheme: light)').addEventListener('change',e=>{let s=null;try{s=localStorage.getItem('tema');}catch(_){}if(!s)settTema(e.matches?'lys':'mork',false);});}catch(_){}
settTema(document.documentElement.dataset.tema||'mork',false);
registrerLagret();tellLagret();
render();
const h=hashItem();if(h)show(h[0],h[1]);else{const f=document.querySelector('.item[data-card]');if(f){show('story',f.dataset.card);LIST.scrollTop=0;}}
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
// ---- 🔄 Oppdater: popup med siste byggetid + hard omlasting (forbi service worker-cache) ----
(function(){const b=document.getElementById('oppdb');if(!b)return;
function tid(){const m=document.querySelector('meta[name=bygg]');const v=m&&m.content;if(!v||v.length<12)return 'ukjent';
return `${v.slice(6,8)}.${v.slice(4,6)}.${v.slice(0,4)} kl. ${v.slice(8,10)}:${v.slice(10,12)} (Oslo-tid)`;}
let d=null;function lukk(){if(d)d.hidden=true;b.focus();}
function apne(){if(!d){d=document.createElement('div');d.id='oppdm';d.setAttribute('role','dialog');d.setAttribute('aria-modal','true');d.setAttribute('aria-labelledby','oppdt');
d.innerHTML='<div class="boks"><h2 id="oppdt">🔄 Oppdatering</h2><p>Siste oppdatering: <b id="oppdtid"></b>.</p><p>Appen oppdateres automatisk hver dag kl. 08:00.</p><p>Vil du ha en oppdatering nå? Skriv «oppdater» til Nyheter i Grok Bot, så er den klar på noen minutter.</p><div class="knr"><button type="button" id="oppdlast" class="prim">Last siden på nytt</button><button type="button" id="oppdlukk">Lukk</button></div></div>';
document.body.appendChild(d);d.addEventListener('click',e=>{if(e.target===d)lukk();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&d&&!d.hidden)lukk();});
d.querySelector('#oppdlukk').addEventListener('click',lukk);
d.querySelector('#oppdlast').addEventListener('click',hard);}
d.querySelector('#oppdtid').textContent=tid();d.hidden=false;d.querySelector('#oppdlast').focus();}
async function hard(){try{if('serviceWorker' in navigator){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.update().catch(()=>{})));}}catch(_){}
try{if(window.caches){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)));}}catch(_){}
const u=new URL(location.href);u.searchParams.set('v',Date.now());location.replace(u.toString());}
b.addEventListener('click',apne);})();
</script></body></html>
