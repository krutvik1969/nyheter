":"Valeria Bradley","tx":"@jaynitx LOL, what \"freedom\" do we  have to look forward to? Freedom from having to earn a living, have a job?","lk":0,"t":"11.10 10:15","url":"https://x.com/ValerieEBradley/status/2109196059100762589"},{"u":"bketck","nm":"Station Cat","tx":"@jaynitx 他这段话我最在意的是“接受”这两个字……被黑的可能是医院和普通人，说能接受的却是做模型的人。至少出了事谁来补、谁来赔，得先讲清楚吧。","lk":0,"t":"11.10 08:47","url":"https://x.com/bketck/status/2109173987188293857"}]},"2109039710253551898":{"u":"peterwildeford","url":"https://x.com/peterwildeford/status/2109039710253551898","tx":"SAM ALTMAN: \"We're going to, as a society, I think, have to just accept some fairly severe cyber incidents from open models, in exchange for the liberty that comes with that\" https://t.co/XRXdTtz14l","lk":65,"rp":11,"t":"10.10 23:53","nm":"Peter Wildeford🇺🇸🚀","rc":8},"2109026601887293773":{"u":"NASAAdmin","url":"https://x.com/NASAAdmin/status/2109026601887293773","tx":"Do you believe that taking an extremely long time to do something makes it safer.. ? like 5 years of development is safer than 2 years? Were NASA’s decisions to pivot in weeks for Gemini VI/VII or months for Apollo 8 unsafe, or were they historic examples of competence that kept America in the space race?\n\nMuch of the Reddit noise seems to come from people looking for reasons to take out their affinity for specific hardware, political differences, or personality conflicts on America’s lunar program.\n\nIt has been long enough. We have been working for decades on America’s return to the Moon. We finally have the space policy, political alignment, resources, industry, and talent to accomplish this goal safely after a very long wait.\n\nWe have two landers, and we will preserve the option to use either for as long as possible while turning every knob available to improve the probability of success.\n\nThat means different vehicle configurations will remain on the table for Artemis IV until they are no longer viable. And for the most committed EUS advocates, it was never going to be an option within the timelines required. The OIG report already covered that. Even getting core stage production to an annual rate is a challenge.\n\nThe decision to consider Centaur, stretched Centaur, and other upper-stage options over EUS was made by nonpolitical NASA leadership assessing cost, technical work ahead within timelines. I know this is disappointing to some hardware fans, but the idea that it is all a cover for lander availability does not hold up. NASA would have wanted an Artemis III test before an Artemis IV landing regardless, and an extended-mission Centaur would offer far more value for a lunar base and other applications than EUS. That is the reality.\n\nWe are an energized and dynamic NASA and we are not just waiting around for others to deliver. It is NASA’s responsibility to drive the outcomes people have been waiting for, and that is exactly what we intend to do.\n\nWe are targeting October 23 for the next Artemis update, though that date is not final as folks return from IAC.","lk":5482,"rp":322,"t":"10.10 23:01","nm":"NASA Administrator Jared Isaacman","rc":98},"2108990988576546829":{"u":"SciGuySpace","url":"https://x.com/SciGuySpace/status/2108990988576546829","tx":"The next spacecraft to land humans on the Moon will be:","lk":240,"rp":17,"t":"10.10 20:40","nm":"Eric Berger","rc":55},"2108935837207691585":{"u":"unusual_whales","url":"https://x.com/unusual_whales/status/2108935837207691585","tx":"U.S. homes are now the least affordable on record.\n\nYou now need over $120,000 in income to afford a median-priced home, per the Atlanta Fed, more than the typical household earns.\n\n30-year mortgage rates hit 7.24% in mid-September.\n\nThe monthly payment on a $500,000 loan has jumped about $400, to roughly $3,400.\n\nHome sales have plunged to a 31-year low.","lk":7225,"rp":955,"t":"10.10 17:01","nm":"unusual_whales","rc":294,"sv":[{"u":"Majora_Umbra","nm":"Majora Umbra","tx":"@unusual_whales Capitalism is awesome","lk":0,"t
