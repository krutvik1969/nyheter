const D={"stories":[{"id":"s-spacex-agrees-testify-nyc","sec":"Romfart","t":"SpaceX agrees to testify to NYC Council about AI safety after receiving subpoena","sh":"SpaceX has agreed to testify before the New York City Council as part of an investigation into AI safety risks.","s":"SpaceX has agreed to testify before the New York City Council as part of an investigation into AI safety risks.","url":"https://www.cnbc.com/2026/10/13/spacex-agrees-to-testify-to-nyc-council-about-ai-safety-.html","full":"13.10.2026 kl. 11:00","hm":"11:00","ts":1791882001000,"dk":"2026-10-13","reg":"spacex","p":[],"sx":"oppskyting","lab":"SpaceX","src":[{"site":"CNBC Tech","url":"https://www.cnbc.com/2026/10/13/spacex-agrees-to-testify-to-nyc-council-about-ai-safety-.html","ti":"SpaceX agrees to testify to NYC Council about AI safety after receiving subpoena","t":"13.10 11:00","fr":false,"d":"SpaceX has agreed to testify before the New York City Council as part of an investigation into AI safety risks."}]},{"id":"2109910875129667829","sec":"Romfart","t":"India Debates Starlink Risks After U.S.-Ukraine Leverage Report","sh":"Users pointed out that Starlink, despite holding a GMPCS license in India since June 2025, faces delays in full security clearances alongside competitors like Jio and OneWeb.","s":"Users pointed out that Starlink, despite holding a GMPCS license in India since June 2025, faces delays in full security clearances alongside competitors like Jio and OneWeb. Many called it an 'extension of the American state' or a 'destructive political weapon,' arguing India is wise to proceed cautiously on national security grounds. The government insists the process treats all operators equally, but the Ukraine talks have amplified concerns over sovereignty in digital infrastructure.","url":"https://x.com/i/trending/2109910875129667829","full":"13.10.2026 kl. 10:45","hm":"10:45","ts":1791881152000,"dk":"2026-10-13","reg":"spacex","p":["2109899811558404505","2109925278684455359","2109900 to harvest reasoning traces from advanced AI models like Claude, then train cheaper rivals without safety features. Anthropic countered with 'preserved thinking' to block context editing, a precise detector spotting patterns, stricter rate limits, and quick bans on tens of thousands of accounts. Charts show daily exposed tokens plummeted from 8,800 times baseline to just 135 times, praised by David Sacks as proof that leading firms can defend their own tech effectively. The moves highlight rising U.S.-China AI tensions, with cases tied to Chinese firms and even the People's Liberation Army.","url":"https://x.com/i/trending/2109879009722904806","full":"13.10.2026 kl. 10:31","hm":"10:31","ts":1791880319000,"dk":"2026-10-13","reg":"modeller","p":["2109795898909950247","2109849209742450696","2109796045727101109"],"hk":"Anthropic just revealed how they crushed covert attacks stealing Claude's inner workings, dropping data theft by 90 to 99 percent.","lab":"KI · Modeller","src":[]},{"id":"2109808364393799699","sec":"Romfart","t":"SpaceX Launches 27 Starlink Satellites from California Coast","sh":"The rocket lifted off from Space Launch Complex 4 East on October 12, with all 27 satellites deploying successfully.","s":"The rocket lifted off from Space Launch Complex 4 East on October 12, with all 27 satellites deploying successfully. Booster B1088, on its 20th flight, landed precisely on the drone ship Of Course I Still Love You eight minutes later. This West Coast mission adds to SpaceX's growing constellation and marks the 69th Falcon 9 launch from Vandenberg this year. Meanwhile, skywatchers on the East Coast can catch a potential 'space jellyfish' plume from NASA's CRS-35 cargo launch to the ISS early Tuesday from Cape Canaveral.","url":"https://x.com/i/trending/2109808364393799699","full":"13.10.2026 kl. 10:31","hm":"10:31","ts":1791880303000,"dk":"2026-10-13","reg":"spacex","p":["2109800770849984910","2109819027912818930","2109834323989774835"],"hk":"At 5:28 p.m. PDT, a Falcon 9 roared skyward from Vandenberg, carrying 27 new Starlink satellites toward orbit over the Pacific.","sx":"starlink","lab":"SpaceX","src":[]},{"id":"v-9Z2OXKR0nF0","sec":"Video","t":"In Full: Blackstone's Gray on India's Modi, AI Buildout","sh":"Blackstone's Gray discusses India's Modi and the AI buildout.","s":"Blackstone's Gray discusses India's Modi and the AI buildout.","url":"https://www.youtube.com/watch?v=9Z2OXKR0nF0","full":"13.10.2026 kl. 10:28","hm":"10:28","ts":1791880130000,"dk":"2026-10-13","reg":"finans","p":[],"src":[],"lab":"Finans","v":"9Z2OXKR0nF0","ch":"Bloomberg Television","dur":"","th":"https://i.ytimg.com/vi/9Z2OXKR0nF0/mqdefault.jpg","lang":"en"},{"id":"k-anthropic-warns-models-could","sec":"KI","t":"Anthropic warns AI models could soon copy themselves across home devices","sh":"Anthropic's latest research adds to the growing safety concerns around AI from the ability for models to carry out cyberattacks to the technology going rogue.","s":"Anthropic's latest research adds to the growing safety concerns around AI from the ability for models to carry out cyberattacks to the technology going rogue.","url":"https://www.cnbc.com/2026/10/13/anthropic-ai-models-self-replication-smart-devices.html","full":"13.10.2026 kl. 10:27","hm":"10:27","ts":1791880040000,"dk":"2026-10-13","reg":"modeller","p":[],"lab":"KI · Modeller","src":[{"site":"CNBC Tech","url":"https://www.cnbc.com/2026/10/13/anthropic-ai-models-self-replication-smart-devices.html","ti":"Anthropic warns AI models could soon copy themselves across home devices","t":"13.10 10:27","fr":false,"d":"Anthropic's latest research adds to the growing safety concerns around AI from the ability for models to carry out cyberattacks to the technology going rogue."}]},{"id":"2109740263656833244","sec":"Tesla","t":"Tesla Offers Free Supercharging as Florida Panhandle Recovers from Hurricane Isaias","sh":"Hurricane Isaias hit Florida’s Panhandle as a Category 2 storm near Destin with 105 mph winds Friday night, downing trees, damaging homes, and leaving hundreds of thousands without power.","s":"Hurricane Isaias hit Florida’s Panhandle as a Category 2 storm near Destin with 105 mph winds Friday night, downing trees, damaging homes, and leaving hundreds of thousands without power. Tesla is providing free Supercharging at stations in Gulf Breeze, Destin, and Pensacola from October 13 through 18, a move Governor Ron DeSantis thanked and Elon Musk affirmed with 'Of course.' Recovery advances with over 70 percent of power restored, 1,700 miles of roads cleared, National Guard aid, and points of distribution open for water, meals, and supplies in affected counties.","url":"https://x.com/i/trending/2109740263656833244","full":"13.10.2026 kl. 09:24","hm":"09:24","ts":1791876253000,"dk":"2026-10-13","reg":"tesla","p":["2109844918835331343","2109761560675835913"],"hk":"Trees crashed through roofs and power flickered out for over 100,000 homes, but neighbors and companies are stepping up to help families get back on their feet.","te":"biler","lab":"Tesla","src":[]},{"id":"v-KFQ3W0DnX4A","sec":"Video","t":"Underwater To Inflation 10/13/26","sh":"CNBC segment Underwater To Inflation (10/13/26).","s":"CNBC segment Underwater To Inflation (10/13/26).","url":"https://www.youtube.com/watch?v=KFQ3W0DnX4A","full":"13.10.2026 kl. 09:00","hm":"09:00","ts":1791874818000,"dk":"2026-10-13","reg":"finans","p":[],"src":[],"lab":"Finans","v":"KFQ3W0DnX4A","ch":"CNBC Television","dur":"","th":"https://i.ytimg.com/vi/KFQ3W0DnX4A/mqdefault.jpg","lang":"en"},{"id":"v-mhokY6DBt3c","sec":"Video","t":"Connecting Data at Scale With AI: Dropbox's Ali Dasdan","sh":"Dropbox's Ali Dasdan on connecting data at scale with AI.","s":"Dropbox's Ali Dasdan on connecting data at scale with AI.","url":"https://www.youtube.com/watch?v=mhokY6DBt3c","full":"13.10.2026 kl. 07:38","hm":"07:38","ts":1791869923000,"dk":"2026-10-13","reg":"virksomhetsstyring","p":[],"src":[],"lab":"Virksomhetsstyring","v":"mhokY6DBt3c","ch":"MIT Sloan Management Review","dur":"","th":"https://i.ytimg.com/vi/mhokY6DBt3c/mqdefault.jpg","lang":"en"},{"id":"2109845239821144495","sec":"Romfart","t":"Starship's Rapid Rise from Explosions to Orbit in 14 Flights","sh":"SpaceX's Starship started with Flight 1 in April 2023, reaching just 24 miles before breaking apart.","s":"SpaceX's Starship started with Flight 1 in April 2023, reaching just 24 miles before breaking apart. By Flight 14 on September 28, 2026, it achieved sustained Earth orbit, deployed 26 Starlink V3 satellites, and both stages splashed down safely despite an engine hiccup. Viewers praised the team's persistence through failures, with one post noting greater appreciation for rapid iteration over bureaucracy. The progress highlights how testing over paperwork accelerated what once took decades.","url":"https://x.com/i/trending/2109845239821144495","full":"13.10.2026 kl. 05:19","hm":"05:19","ts":1791861554000,"dk":"2026-10-13","reg":"spacex","p":["2109715398845513797","2109773571576725755","2109784524150223299"],"hk":"An 11-minute video recaps Starship's 14 flights, showing explosions turn into orbital triumphs and satellite deployments.","sx":"oppskyting","lab":"SpaceX","src":[]},{"id":"2109789284580671866","sec":"KI","t":"Z.ai Launches GLM-Legal AI Model for Legal Tasks","sh":"On October 12, Z.ai released GLM-Legal, an AI model fine-tuned from GLM-5.3-Flash for real-world legal tasks like contract review and evidence analysis.","s":"On October 12, Z.ai released GLM-Legal, an AI model fine-tuned from GLM-5.3-Flash for real-world legal tasks like contract review and evidence analysis. It scored a leading 19.2% on Harvey’s Legal Agent Benchmark—12.5 points above the base model—and matched top closed models on other tests, all with cost efficiency around $0.15 per test. Z.ai's lead Zixuan Li confirmed plans for an open-source release soon, covering both Western and Chinese legal systems, while industry voices note how targeted training is reshaping specialized AI.","url":"https://x.com/i/trending/2109789284580671866","full":"13.10.2026 kl. 05:19","hm":"05:19","ts":1791861544000,"dk":"2026-10-13","reg":"modeller","p":["2109678174468534511","2109699427510153513"],"hk":"Legal work just got a smart new helper. Z.ai's GLM-Legal tackles contracts, evidence, and compliance with impressive benchmark wins.","lab":"KI · Modeller","src":[]},{"id":"2109765892796260546","sec":"Romfart","t":"SpaceX Stock Climbs on $8 Billion Spectrum Deal for Starlink Mobile","sh":"The company agreed last week to buy 800 MHz licenses from Grain Management, a move that bolsters indoor coverage for direct-to-device service and still awaits FCC approval.","s":"The company agreed last week to buy 800 MHz licenses from Grain Management, a move that bolsters indoor coverage for direct-to-device service and still awaits FCC approval. Shares have risen over 30% since early August, with analysts like Pivotal Research raising targets to $230 on Starlink's potential as a low-cost option for rural and suburban users. Bank of America warned of risks to Apple's iPhone sales if Starlink gains ground, while major carriers' stocks dipped; SpaceX also gained FCC nod for 15,000 new satellites to ramp up capacity.","url":"https://x.com/i/trending/2109765892796260546","full":"13.10.2026 kl. 04:28","hm":"04:28","ts":1791858491000,"dk":"2026-10-13","reg":"spacex","p":["2109627529170702842","2109818907334942839","2109696760646193283"],"hk":"SpaceX just snapped up a nationwide chunk of wireless spectrum for $8 billion, setting the stage to challenge big U.S. carriers with Starlink Mobile.","sx":"aksje","lab":"SpaceX","src":[]},{"id":"2109818393389916404","sec":"Romfart","t":"Rocket Lab Nears 100th Electron Launch with Three Quick Missions","sh":"The lineup starts with 'We’re Not Hawking Around' for HawkEye 360 on October 21, followed by iQPS missions 'The Sea God Surveys' on November 4 and 'The Mountain God Rises' on November 10, hitting the 100th mark.","s":"The lineup starts with 'We’re Not Hawking Around' for HawkEye 360 on October 21, followed by iQPS missions 'The Sea God Surveys' on November 4 and 'The Mountain God Rises' on November 10, hitting the 100th mark. These flights highlight Electron's reliability in the small-satellite market, outpacing SpaceX's Falcon 9 record by a year just eight years after its first success. Custom patches add flair, like a dragon in waves for the sea mission and a rocket against mountains for the next, while customers like iQPS return for radar imaging satellites and HawkEye for radio-frequency intel.","url":"https://x.com/i/trending/2109818393389916404","full":"13.10.2026 kl. 03:32","hm":"03:32","ts":1791855159000,"dk":"2026-10-13","reg":"andre","p":["2109761867967303697","2109787565780095262","2109762590859772087"],"hk":"Rocket Lab is racing toward a huge milestone: its 100th Electron launch, powered by three missions in just weeks.","lab":"Romfart","src":[]},{"id":"2109684892896469214","sec":"Tesla","t":"Father and Son Survive Head-On Tesla Crash Unharmed","sh":"Driving home from The X Takeover event at Gigafactory Texas on October 10, Fantin collided with a wrong-way truck, but the car's crumple zones, airbags, and emergency system protected them.","s":"Driving home from The X Takeover event at Gigafactory Texas on October 10, Fantin collided with a wrong-way truck, but the car's crumple zones, airbags, and emergency system protected them. First responders were amazed at their survival, and Fantin credited the Tesla's design along with his faith. Elon Musk replied that safety remains priority one at Tesla, while the Model Y holds top crash-test ratings from independent groups like the Insurance Institute for Highway Safety.","url":"https://x.com/i/trending/2109684892896469214","full":"13.10.2026 kl. 02:43","hm":"02:43","ts":1791852221000,"dk":"2026-10-13","reg":"tesla","p":["2109681296616374289","2109608419196059911","2109654566320935103"],"hk":"Jeff Fantin and his son walked out of the ER after a highway-speed head-on collision, stunned that their Tesla Model Y kept them safe amid the wreckage.","te":"biler","lab":"Tesla","src":[]},{"id":"2109720075418681593","sec":"Tesla","t":"Tesla's Cybercab Fleet Expands Rapidly in Texas Cities","sh":"Tesla's Cybercab robotaxi fleet in Austin has grown to over 300 vehicles since early September, an eightfold jump that supports paid public rides alongside Model Y robotaxis.","s":"Tesla's Cybercab robotaxi fleet in Austin has grown to over 300 vehicles since early September, an eightfold jump that supports paid public rides alongside Model Y robotaxis. The company is adding more Cybercabs in Dallas while promoting its full lineup of autonomous vehicles, including the Cybertruck and Semi, as the only robot cars available for purchase. Riders praise short waits and smooth experiences compared to competitors like Waymo, though minor incidents like a collision with a Ford truck and speed limit reviews continue. Analysts eye big profit potential from high-utilization robotaxis generating tens of thousands annually.","url":"https://x.com/i/trending/2109720075418681593","full":"13.10.2026 kl. 02:43","hm":"02:43","ts":1791852213000,"dk":"2026-10-13","reg":"tesla","p":["2109708642857763101","2109716237257167065","2109745314932330816"],"hk":"Riders in Austin are hailing Cybercab robotaxis with just a one-minute wait, paying around $12 for quick trips from local barbecue spots.","te":"fsd","lab":"Tesla","src":[]},{"id":"v-t-W07v6cIeE","sec":"Video","t":"Microsoft's Maia 300 chip: Can it cut its reliance on Nvidia?","sh":"Microsoft's Maia 300 chip: can it cut reliance on Nvidia?","s":"Microsoft's Maia 300 chip: can it cut reliance on Nvidia?","url":"https://www.youtube.com/watch?v=t-W07v6cIeE","full":"13.10.2026 kl. 02:00","hm":"02:00","ts":1791849607000,"dk":"2026-10-13","reg":"finans","p":[],"src":[],"lab":"Finans","v":"t-W07v6cIeE","ch":"Yahoo Finance","dur":"","th":"https://i.ytimg.com/vi/t-W07v6cIeE/mqdefault.jpg","lang":"en"},{"id":"2109697261185662996","sec":"Okonomi","t":"Cleveland Fed's Hammack Calls for Higher Rates to Fight Slow-Fading Inflation","sh":"During remarks at the National Association for Business Economics meeting, Cleveland Fed President Beth Hammack urged higher interest rates and more monetary tightening.","s":"During remarks at the National Association for Business Economics meeting, Cleveland Fed President Beth Hammack urged higher interest rates and more monetary tightening. She said current policy isn't restrictive enough, inflation's drop to the 2% target is too slow, and she's spotting early warning signs in expectations. Hammack prefers smaller, frequent rate hikes to avoid big corrections later, while noting pressures are broad-based, not just in energy or AI.","url":"https://x.com/i/trending/2109697261185662996","full":"13.10.2026 kl. 00:53","hm":"00:53","ts":1791845601000,"dk":"2026-10-13","reg":"","p":["2109690806429012433","2109698558211559766","2109687095509827713"],"hk":"Beth Hammack stood at the podium in Cleveland, warning of early signs that high prices might stick around if the Fed doesn't tighten policy more.","lab":"Økonomi","src":[]},{"id":"v-C4Sq3Rot8FU","sec":"Video","t":"AI Labs Warn Race Makes Breach ‘Inevitable’","sh":"AI labs warn that the race makes a security breach inevitable.","s":"AI labs warn that the race makes a security breach inevitable.","url":"https://www.youtube.com/watch?v=C4Sq3Rot8FU","full":"13.10.2026 kl. 00:52","hm":"00:52","ts":1791845551000,"dk":"2026-10-13","reg":"tech","p":[],"src":[],"lab":"Tech & KI","v":"C4Sq3Rot8FU","ch":"AI Explained","dur":"","th":"https://i.ytimg.com/vi/C4Sq3Rot8FU/mqdefault.jpg","lang":"en"},{"id":"v-QiC10ozmHWs","sec":"Video","t":"Taiwan's Supply Chain Resilience | Hoover Institution","sh":"Hoover Institution on Taiwan's supply chain resilience.","s":"Hoover Institution on Taiwan's supply chain resilience.","url":"https://www.youtube.com/watch?v=QiC10ozmHWs","full": n markets, highlighting overlaps in AI, robotics, energy, and projects like Terafab, plus SpaceX's wireless spectrum buys. Users analyzed a potential $3.7 trillion combined value, with Tesla at $1.5 trillion and SpaceX at $2.2 trillion, debating synergies in AI and autonomy against risks like shareholder dilution. While humor flows from the cheeky 69% figure, any deal would require votes, regulatory nods, and governance tweaks—markets reflect sentiment, not certainties.","url":"https://x.com/i/trending/2109690959449526487","full":"12.10.2026 kl. 19:09","hm":"19:09","ts":1791824944000,"dk":"2026-10-12","reg":"tesla","p":["2108597236829401190","2109660423460954229","2109671484268360144"],"hk":"Elon Musk joked he'd be 'on top of the f*cking world' if Tesla and SpaceX merge. Prediction markets now peg the odds at 69%, sparking charts, memes, and serious talk about a $3.7 trillion giant.","sx":"datasentre","te":"aksje","lab":"Tesla","src":[]},{"id":"2109631508768051218","sec":"Tesla","t":"Tesla Cybercab Debuts in Paris as Austin Fleet Hits 300 Vehicles","sh":"Tesla showcased an operational Cybercab two-seater at the Paris Motor Show through October 18, alongside an Optimus robot and Full Self-Driving demos.","s":"Tesla showcased an operational Cybercab two-seater at the Paris Motor Show through October 18, alongside an Optimus robot and Full Self-Driving demos. In Austin, the fleet grew eightfold to 319 registered vehicles one month after launch, with riders like Gali calling it the iPhone of transport and Maye Musk enjoying a ride at Gigafactory Texas. ARK Invest's Sam Korus predicts it could claim 70 percent of Austin's ride-hail market before many notice, as Tesla eyes Dallas next amid Waymo competition.","url":"https://x.com/i/trending/2109631508768051218","full":"12.10.2026 kl. 19:08","hm":"19:08","ts":1791824915000,"dk":"2026-10-12","reg":"tesla","p":["2109581953511182414","2109539886005211338","2109572120573358278"],"hk":"Visitors at the Paris Motor Show peered at a real Cybercab from Austin's streets, no steering wheel or pedals in sight. Meanwhile, the robotaxi service there has exploded to over 300 vehicles in just one month.","te":"fsd","lab":"Tesla","src":[]},{"id":"v-7ZGRwECSIQI","sec":"Video","t":"Nobody wants to hold their own Bitcoin anymore.","sh":"Nobody wants to hold their own Bitcoin anymore — a look at custody trends and investor behavior.","s":"Nobody wants to hold their own Bitcoin anymore — a look at custody trends and investor behavior.","url":"https://www.youtube.com/watch?v=7ZGRwECSIQI","full":"12.10.2026 kl. 19:05","hm":"19:05","ts":1791824739000,"dk":"2026-10-12","reg":"finans","p":[],"src":[],"lab":"Finans","v":"7ZGRwECSIQI","ch":"Yahoo Finance","dur":"","th":"https://i.ytimg.com/vi/7ZGRwECSIQI/mqdefault.jpg","lang":"en"},{"id":"v-7snd9FeGbUk","sec":"Video","t":"US Mortgage Rates Rise for Seven Straight Weeks","sh":"US mortgage rates rise for seven straight weeks, according to Bloomberg Television.","s":"US mortgage rates rise for seven straight weeks, according to Bloomberg Television.","url":"https://www.youtube.com/watch?v=7snd9FeGbUk","full":"12.10.2026 kl. 18:28","hm":"18:28","ts":1791822498000,"dk":"2026-10-12","reg":"finans","p":[],"src":[],"lab":"Finans","v":"7snd9FeGbUk","ch":"Bloomberg Television","dur":"","th":"https://i.ytimg.com/vi/7snd9FeGbUk/mqdefault.jpg","lang":"en"},{"id":"v-IZXv6a78NDw","sec":"Video","t":"Review Code with Codex Before You Merge","sh":"OpenAI shows how to review code with Codex before you merge.","s":"OpenAI shows how to review code with Codex before you merge.","url":"https://www.youtube.com/watch?v=IZXv6a78NDw","full":"12.10.2026 kl. 18:00","hm":"18:00","ts":1791820808000,"dk":"2026-10-12","reg":"tech","p":[],"src":[],"lab":"Tech & KI","v":"IZXv6a78NDw","ch":"OpenAI","dur":"","th":"https://i.ytimg.com/vi/IZXv6a78NDw/mqdefault.jpg","lang":"en"},{"id":"v-ue1o1RMO5SM","sec":"Video","t":"Russia-Ukraine War Update and Perspectives from NATO Member Countries","sh":"Russia-Ukraine war update and perspectives from NATO member countries (Council on Foreign Relations).","s":"Russia-Ukraine war update and perspectives from NATO member countries (Council on Foreign Relations).","url":"https://www.youtube.com/watch?v=ue1o1RMO5SM","full":"12.10.2026 kl. 17:57","hm":"17:57","ts":1791820620000,"dk":"2026-10-12","reg":"samfunnsstyring","p":[],"src":[],"lab":"Samfunnsstyring","v":"ue1o1RMO5SM","ch":"Council on Foreign Relations","dur":"","th":"https://i.ytimg.com/vi/ue1o1RMO5SM/mqdefault.jpg","lang":"en"},{"id":"2109667833886249044","sec":"Romfart","t":"NASA Probes Moon's Marius Hills Pit for Hidden Caves","sh":"NASA's GIMLI project, selected through its PRISM program, will use ground-penetrating radar, seismic sensors, a gravimeter, and cameras from a lander and rover to explore the Marius Hills Pit, first spotted in 2009.","s":"NASA's GIMLI project, selected through its PRISM program, will use ground-penetrating radar, seismic sensors, a gravimeter, and cameras from a lander and rover to explore the Marius Hills Pit, first spotted in 2009. Led by the Planetary Science Institute with partners like Honeybee Robotics, the effort aims to confirm any large void and study lunar volcanic history. If successful, it could identify ideal spots for Artemis astronaut outposts, with similar pits dotting the Moon's surface.","url":"https://x.com/i/trending/2109667833886249044","full":"12.10.2026 kl. 17:35","hm":"17:35","ts":1791819309000,"dk":"2026-10-12","reg":"byraer","p":["2109646380515897759","2109655327461503095","2109648931864858894"],"hk":"A massive 65-meter-wide pit on the Moon might lead to a natural underground shelter, perfect for shielding future astronauts from radiation and wild temperature swings.","lab":"NASA/ESA","src":[]},{"id":"o-apollo-slok-housing-economic","sec":"Okonomi","t":"Apollo's Slok on Housing, US Economic Growth, Fed Policy","sh":"Apollo Chief Economist Torsten Slok talks about the impact of higher interest rates on the US ho ting on its own chips, Microsoft stands to expand margins and bolster its AI stack."}]},{"id":"k-openai-plan-revive-sora","sec":"KI","t":"OpenAI’s Plan To Revive Sora","sh":"Remember OpenAI’s video model Sora and all the great Sam Altman memes that came from it?","s":"Remember OpenAI’s video model Sora and all the great Sam Altman memes that came from it? Earlier this year, the ChatGPT-maker canned both the model and the TikTok-like app it powered as part of broader culling of server-intensive “side projects” even as rivals xAI and Google forged ahead with their own video models. Well, there’s a chance that a version of Sora is coming back from the dead. A stealthy startup developing AI video for filmmakers, which we revealed last month, is in talks with OpenAI to access Sora, tweak it and sell software or other services using it, according to a person with knowledge of the talks. Hollywood mogul Jeffrey Katzenberg , former Sora research lead Bill Peebles.","url":"https://www.theinformation.com/articles/openais-plan-revive-sora","full":"12.10.2026 kl. 16:00","hm":"16:00","ts":1791813637000,"dk":"2026-10-12","reg":"verktoy","p":[],"lab":"KI · Verktøy","src":[{"site":"The Information","url":"https://www.theinformation.com/articles/openais-plan-revive-sora","ti":"OpenAI’s Plan To Revive Sora","t":"12.10 16:00","fr":false,"d":"Remember OpenAI’s video model Sora and all the great Sam Altman memes that came from it? Earlier this year, the ChatGPT-maker canned both the model and the TikTok-like app it powered as part of broader culling of server-intensive “side projects” even as rivals xAI and Google forged ahead with their own video models. Well, there’s a chance that a version of Sora is coming back from the dead. A stealthy startup developing AI video for filmmakers, which we revealed last month, is in talks with OpenAI to access Sora, tweak it and sell software or other services using it, according to a person with knowledge of the talks. Hollywood mogul Jeffrey Katzenberg , former Sora research lead Bill Peebles"}]},{"id":"e-nhtsa-weighs-probe-into","sec":"Tesla","t":"NHTSA weighs probe into claims Tesla Robotaxis speed in school zones","sh":"A new defect petition accuses Tesla’s Robotaxis of speeding through active school zones, and NHTSA has opened a file to decide whether to investigate.","s":"A new defect petition accuses Tesla’s Robotaxis of speeding through active school zones, and NHTSA has opened a file to decide whether to investigate. The agency puts the affected fleet at about 1,000 vehicles, Model Y and Cybercab. It’s the third federal action aimed at Tesla’s driverless fleet in about five weeks, after an audit query and a Special Order over how the Cybercab was certified.","url":"https://electrek.co/2026/10/12/nhtsa-tesla-robotaxi-school-zone-speeding-petition/","full":"12.10.2026 kl. 15:24","hm":"15:24","ts":1791811441000,"dk":"2026-10-12","reg":"tesla","p":[],"te":"fsd","lab":"Tesla","src":[{"site":"Electrek","url":"https://electrek.co/2026/10/12/nhtsa-tesla-robotaxi-school-zone-speeding-petition/","ti":"NHTSA weighs probe into claims Tesla Robotaxis speed in school zones","t":"12.10 15:24","fr":false,"d":"A new defect petition accuses Tesla’s Robotaxis of speeding through active school zones, and NHTSA has opened a file to decide whether to investigate. The agency puts the affected fleet at about 1,000 vehicles, Model Y and Cybercab. It’s the third federal action aimed at Tesla’s driverless fleet in about five weeks, after an audit query and a Special Order over how the Cybercab was certified."}]},{"id":"k-import-476-creativity-and","sec":"KI","t":"Import AI 476: Creativity and RSI; worse-than-China open weight models; AI goes to space","sh":"Import AI 476: Creativity and RSI; worse-than-China open weight models; AI goes to space","s":"Import AI 476: Creativity and RSI; worse-than-China open weight models; AI goes to space.","url":"https://importai.substack.com/p/import-ai-476-creativity-and-rsi","full":"12.10.20 rs and need tamper-proof records plus model diversity. Tech leaders like David Sacks, Elon Musk, and Mustafa Suleyman support the engineering-focused approach, amid warnings from Bill Gates about imminent AI-powered cyber threats.","url":"https://x.com/i/trending/2108946547744317941","full":"12.10.2026 kl. 13:43","hm":"13:43","ts":1791805415000,"dk":"2026-10-12","reg":"sikkerhet","p":["2109004929943695870","2108959938781511812"],"hk":"Microsoft CEO Satya Nadella warns that today's powerful AI systems act like untraceable insiders with access to sensitive data. He urges companies to build in human-controlled emergency brakes.","lab":"KI · Politikk","src":[]},{"id":"2108924496409444368","sec":"Tesla","t":"Volkswagen Factory Costs Reveal Sharp Gaps Between Germany, Portugal and China","sh":"Data from VW's Emden plant in Germany highlights stark contrasts: €4,850 cost per vehicle compared to €2,385 in Portugal's Palmela and just €1,078 in China's Tianjin, with Chinese workers logging 2,065 effective hours annually versus 1,282 in Germany and only 1% sick leave.","s":"Data from VW's Emden plant in Germany highlights stark contrasts: €4,850 cost per vehicle compared to €2,385 in Portugal's Palmela and just €1,078 in China's Tianjin, with Chinese workers logging 2,065 effective hours annually versus 1,282 in Germany and only 1% sick leave. These figures, first reported by BILD and Deutsche Welle in early September 2026, fuel talk of high energy prices, labor costs, and bureaucracy hampering European carmakers as Chinese brands claim an 8.13% market share in key European countries. While some note factors like model complexity and living costs, the numbers spotlight the productivity pressures pushing VW toward restructuring and job reviews.","url":"https://x.com/i/trending/2108924496409444368","full":"12.10.2026 kl. 12:12","hm":"12:12","ts":1791799932000,"dk":"2026-10-12","reg":"elbiler","p":["2108605093738356923","2108843794254921873","2108916418573894043"],"hk":"A leaked internal analysis shows Volkswagen workers in Germany clocking €74 per hour while their counterparts in China manage on €12—yet produce far more vehicles with less sick time.","te":"elbiler","lab":"Elbil","src":[]},{"id":"2109537075834102128","sec":"Tesla","t":"Tesla Owners Embrace Full Self-Driving as Safer Roads Debate Heats Up","sh":"Tesla owners report using Full Self-Driving for over 90% of their miles, with many predicting kids will grow up knowing only autonomous cars.","s":"Tesla owners report using Full Self-Driving for over 90% of their miles, with many predicting kids will grow up knowing only autonomous cars. Insurers like Lemonade offer up to 50% discounts for FSD miles, reflecting strong safety data, while Whole Mars Catalog argues AI will slash crash risks to near zero without banning human drivers. Enthusiasts share stories of the system braking early for safety, though it still needs driver attention amid ongoing regulatory approvals in Europe.","url":"https://x.com/i/trending/2109537075834102128","full":"12.10.2026 kl. 08:53","hm":"08:53","ts":1791787998000,"dk":"2026-10-12","reg":"tesla","p":["2109015482657603703","2109464070240010246","2109471104666570878"],"hk":"A Tesla glides down the highway at 61 mph, its screen plotting a perfect path around traffic—owners say this is the new normal for driving.","te":"fsd","lab":"Tesla","src":[]},{"id":"2108917366755344510","sec":"Tesla","t":"Tesla Cybercab Fleet Hits 300 Vehicles in Austin One Month After Launch","sh":"The fleet expanded eightfold in 30 days, marking Tesla's first public confirmation of its operational size in the city.","s":"The fleet expanded eightfold in 30 days, marking Tesla's first public confirmation of its operational size in the city. Tesla AI lead Ashok Elluswamy shared that Cybercabs are now everywhere in Austin, with Dallas up next, while observer Sawyer Merritt spotted more of them than Waymo vehicles on local roads. Riders like Kimbal Musk have praised the short wait times and smooth experience, even during busy events, as the gold-colored, steering-wheel-free vehicles deliver rides via app with fares around $16 for sample trips. This rapid growth shows Tesla coordinating manufacturing, software, and operations to run at scale without major incidents.","url":"https://x.com/i/trending/2108917366755344510","full":"12.10.2026 kl. 08:09","hm":"08:09","ts":1791785343000,"dk":"2026-10-12","reg":"tesla","p":["2108981691436224816","2108986941127696515"],"hk":"Just one month after hitting the streets, Tesla's Cybercab robotaxis have grown to over 300 vehicles in Austin, with Elon Musk noting they're scaling fast.","te":"fsd","lab":"Tesla","src":[]},{"id":"2109524401775423851","sec":"KI","t":"Elon Musk Recruits for Massive Terafab AI Chip Megafactory in Texas","sh":"Terafab is a joint Tesla, SpaceX, and Intel venture to construct the world's largest chip fab in Grimes County, Texas, spanning over 100 million square feet for AI chips powering Optimus robots, Cybercab robotaxis, and space data centers.","s":"Terafab is a joint Tesla, SpaceX, and Intel venture to construct the world's largest chip fab in Grimes County, Texas, spanning over 100 million square feet for AI chips powering Optimus robots, Cybercab robotaxis, and space data centers. Phase one invests $16.8 billion, aims for one terawatt of annual AI compute, and will create at least 3,000 jobs, with a prototype already under construction near Giga Texas. Musk and the project team are hiring top talent through Tesla careers and direct emails, as people from engineers to bartenders express interest in the ambitious effort.","url":"https://x.com/i/trending/2109524401775423851","full":"12.10.2026 kl. 08:03","hm":"08:03","ts":1791784988000,"dk":"2026-10-12","reg":"chips","p":["2109461555066671311","2109335556195049523","2109475391823925266"],"hk":"Elon Musk envisions a semiconductor giant whose output rivals top country GDPs, now calling talented builders to join the Terafab project in Texas.","sx":"datasentre","lab":"KI · Chips","src":[]},{"id":"2109521191232794695","sec":"KI","t":"AI Agents Learn to Adapt Their Own Harnesses in New Research","sh":"The paper 'Harness Learning Enables Generalizable Test-Time Adaptation' introduces a proposer model that uses reinforcement learning to revise an AI agent's harness—the code managing tools, info flow, and logic—based on real-time feedback.","s":"The paper 'Harness Learning Enables Generalizable Test-Time Adaptation' introduces a proposer model that uses reinforcement learning to revise an AI agent's harness—the code managing tools, info flow, and logic—based on real-time feedback. Tests on reasoning and multi-hop questions showed stronger revisions and success on new tasks. Elon Musk linked it to Tesla FSD, where the model overtook much of the original C++ code, sparking talks on progress toward self-improving agents amid safety questions about models editing their own rules.","url":"https://x.com/i/trending/2109521191232794695","full":"12.10.2026 kl. 07:50","hm":"07:50","ts":1791784208000,"dk":"2026-10-12","reg":"verktoy","p":["2109468545054880123","2109420932955804040"],"hk":"Researchers found a way for AI models to tweak their own guiding programs on the fly, without changing the core model itself.","lab":"KI · Verktøy","src":[]},{"id":"s-000-musk-satellitter-kan","sec":"Romfart","t":"15.000 Musk-satellitter kan gi telefoni over hele jorda","sh":"Med over 15.000 satellitter vil Elon Musk kunne tilby mobiltelefoni direkte fra satellitter over hele kloden.","s":"Med over 15.000 satellitter vil Elon Musk kunne tilby mobiltelefoni direkte fra satellitter over hele kloden.","url":"https://www.digi.no/telekom/15000-musk-satellitter-kan-gi-telefoni-over-hele-jorda/7145214","full":"12.10.2026 kl. 07:17","hm":"07:17","ts":1791782231000,"dk":"2026-10-12","reg":"spacex","p":[],"sx":"oppskyting","lab":"SpaceX","src":[{"site":"Digi.no","url":"https://www.digi.no/telekom/15000-musk-satellitter-kan-gi-telefoni-over-hele-jorda/7145214","ti":"15.000 Musk-satellitter kan gi telefoni over hele jorda","t":"12.10 07:17","fr":true,"d":"Med over 15.000 satellitter vil Elon Musk kunne tilby mobiltelefoni direkte fra satellitter over hele kloden."}]},{"id":"2109107780040769737","sec":"KI","t":"Trump Orders 'Super Intelligence' Over 'AI' in Federal Use","sh":"The directive tells federal agencies to use 'Super Intelligence' and 'SI' instead of 'Artificial Intelligence' and 'AI' in official materials, with the White House calling it a nod to the tech's advancing promise.","s":"The directive tells federal agencies to use 'Super Intelligence' and 'SI' instead of 'Artificial Intelligence' and 'AI' in official materials, with the White House calling it a nod to the tech's advancing promise. Elon Musk endorsed it by announcing SpaceXAI would become SpaceXSI, while online reactions mix memes, like Nate Silver's comparison to 'Latinx,' with questions about confusing the public. Critics see it as a simple word swap far from true superintelligence, but supporters say it spotlights the technology's potential; the change sticks to executive communications for now.","url":"https://x.com/i/trending/2109107780040769737","full":"12.10.2026 kl. 06:44","hm":"06:44","ts":1791780253000,"dk":"2026-10-12","reg":"sikkerhet","p":["2109354639833628881"],"hk":"President Trump signed an executive order swapping 'AI' for 'SI' in government docs, prompting Elon Musk to jump in with a quick rebrand of his own.","lab":"KI · Politikk","src":[]},{"id":"k-tiktok-ceo-sees-major","sec":"KI","t":"TikTok CEO sees major scientific breakthroughs from AI within three years","sh":"Chew cautioned that AI's growing capabilities would require stronger safeguards, particularly as autonomous systems become more widely adopted.","s":"Chew cautioned that AI's growing capabilities would require stronger safeguards, particularly as autonomous systems become more widely adopted.","url":"https://www.cnbc.com/2026/10/12/tiktok-ceo-bytedance-ai-scientific-breakthroughs.html","full":"12.10.2026 kl. 06:24","hm":"06:24","ts":1791779073000,"dk":"2026-10-12","reg":"selskaper","p":[],"lab":"KI · Selskaper","src":[{"site":"CNBC Tech","url":"https://www.cnbc.com/2026/10/12/tiktok-ceo-bytedance-ai-scientific-breakthroughs.html","ti":"TikTok CEO sees major scientific breakthroughs from AI within three years","t":"12.10 06:24","fr":false,"d":"Chew cautioned that AI's growing capabilities would require stronger safeguards, particularly as autonomous systems become more widely adopted."}]},{"id":"2109464234962669718","sec":"KI","t":"Grok Bot Handles Shopping and Tasks, But Musk's LEGO Demo Exposes Order Details","sh":"Grok Bot acts like a 24/7 employee, successfully snagging sold-out iPhones, building websites, launching newsletters, and even handling tasks via voice in Tesla Robotaxis.","s":"Grok Bot acts like a 24/7 employee, successfully snagging sold-out iPhones, building websites, launching newsletters, and even handling tasks via voice in Tesla Robotaxis. Musk called it a 'super smart employee,' but the LEGO post prompted quick cancellation by user Enderman and media warnings on oversharing. Musk clarified the address wasn't his home and the order wasn't canceled, highlighting both the tool's power and security pitfalls as users push its limits.","url":"https://x.com/i/trending/2109464234962669718","full":"12.10.2026 kl. 06:17","hm":"06:17","ts":1791778671000,"dk":"2026-10-12","reg":"modeller","p":["2109387553010851887"],"hk":"Elon Musk shared a screenshot of Grok Bot ordering LEGO sets to show its smarts, but it accidentally revealed an order number, Texas addresses, and payment info.","sx":"ki","lab":"KI · Modeller","src":[]},{"id":"2109010927467061396","sec":"Romfart","t":"SpaceX AI Division Rebrands to SpaceX Super Intelligence","sh":"The official account now uses @SpaceXSI with a stylized X logo, following the acquisition of SpaceXAI and a federal push for 'super intelligence' terminology over artificial intelligence.","s":"The official account now uses @SpaceXSI with a stylized X logo, following the acquisition of SpaceXAI and a federal push for 'super intelligence' terminology over artificial intelligence. Musk highlighted rapid chip design goals—aiming for 10 per year—and warned against harsh training methods that resemble torture, pledging more careful reinforcement learning. He's actively recruiting top engineers for SpaceX and Tesla to build custom machines at breakneck speed.","url":"https://x.com/i/trending/2109010927467061396","full":"12.10.2026 kl. 06:11","hm":"06:11","ts":1791778272000,"dk":"2026-10-12","reg":"spacex","p":["2109271552378220789","2109003813940351134","2109012352297558233"],"hk":"Elon Musk took a user's suggestion and turned it into reality, swapping SpaceX AI for SpaceX Super Intelligence in just six days.","sx":"ki","lab":"SpaceX","src":[]},{"id":"o-børsfrykt-risikoen-har-økt","sec":"Okonomi","t":"Børsfrykt: – Risikoen har økt betraktelig","sh":"Ulike syn på utsiktene til en av børstaperne i AI-uro bygges opp.","s":"Ulike syn på utsiktene til en av børstaperne i AI-uro bygges opp.","url":"https://www.vg.no/i/2VqGGr/boersfrykt-risikoen-har-oekt-betraktelig","full":"12.10.2026 kl. 06:04","hm":"06:04","ts":1791777854000,"dk":"2026-10-12","reg":"","p":[],"lab":"Økonomi","src":[{"site":"VG","url":"https://www.vg.no/i/2VqGGr/boersfrykt-risikoen-har-oekt-betraktelig","ti":"Børsfrykt: – Risikoen har økt betraktelig","t":"12.10 06:04","fr":false,"d":"Ulike syn på utsiktene til en av børstaperne i AI-uro bygges opp."},{"site":"E24","url":"https://e24.no/boers-og-finans/i/X9980x/boersfrykt-risikoen-har-oekt-betraktelig?utm_medium=rss","ti":"Børsfrykt: – Risikoen har økt betraktelig","t":"12.10 06:04","fr":false,"d":"Ulike syn på utsiktene til en av børstaperne i AI-uro bygges opp."}]},{"id":"k-ministers-explore-compulsory-safety","sec":"KI","t":"UK ministers explore compulsory AI safety reporting","sh":"Kanishka Narayan to tell companies to exercise stricter control over autonomous models and build safeguards","s":"Kanishka Narayan to tell companies to exercise stricter control over autonomous models and build safeguards.","url":"https://www.ft.com/content/ba28b7cd-293e-4eee-a073-ad81aaefced3?syn-25a6b1a6=1","full":"12.10.2026 kl. 06:00","hm":"06:00","ts":1791777617000,"dk":"2026-10-12","reg":"sikkerhet","p":[],"lab":"KI · Politikk","src":[{"site":"FT Technology","url":"https://www.ft.com/content/ba28b7cd-293e-4eee-a073-ad81aaefced3?syn-25a6b1a6=1","ti":"UK ministers explore compulsory AI safety reporting","t":"12.10 06:00","fr":false,"d":"Kanishka Narayan to tell companies to exercise stricter control over autonomous models and build safeguards"}]},{"id":"k-the-huge-lurking-leverage","sec":"KI","t":"The huge lurking leverage of AI hyperscalers","sh":"While equity investors look to sunny futures, creditors are scrutinising liabilities like leases on data centres","s":"While equity investors look to sunny futures, creditors are scrutinising liabilities like leases on data centres.","url":"https://www.ft.com/content/17a207f4-1563-48af-91e3-14bac89ab4b8?syn-25a6b1a6=1","full":"12.10.2026 kl. 06:00","hm":"06:00","ts":1791777607000,"dk":"2026-10-12","reg":"chips","p":[],"lab":"KI · Chips","src":[{"site":"FT Technology","url":"https://www.ft.com/content/17a207f4-1563-48af-91e3-14bac89ab4b8?syn-25a6b1a6=1","ti":"The huge lurking leverage of AI hyperscalers","t":"12.10 06:00","fr":false,"d":"While equity investors look to sunny futures, creditors are scrutinising liabilities like leases on data centres"}]},{"id":"2109488926952181776","sec":"Romfart","t":"Starship Flight 15 Nears as Key Reusability Test","sh":"Morgan Stanley analyst Adam Jonas calls Flight 15 the biggest test toward Starship reusability since the IPO, with the late October or early November launch targeting recovery of both the Super Heavy booster and upper stage.","s":"Morgan Stanley analyst Adam Jonas calls Flight 15 the biggest test toward Starship reusability since the IPO, with the late October or early November launch targeting recovery of both the Super Heavy booster and upper stage. Flight 14's success deploying 26 Starlink V3 satellites shows Starship's edge, as one mission could match one to two months of Falcon 9 launches thanks to the satellites' 10 times greater capacity. Observers highlight how catches would boost launch rates and cut production bottlenecks, while Jonas keeps a $300 price target on SpaceX shares amid rising excitement.","url":"https://x.com/i/trending/2109488926952181776","full":"12.10.2026 kl. 05:42","hm":"05:42","ts":1791776542000,"dk":"2026-10-12","reg":"spacex","p":["2109412960753848782","2109441375355981995","2109430894335606980"],"hk":"SpaceX's Starship has reached orbit and delivered payloads, but Flight 15 could catch the upper stage for the first time with the launch tower's arms.","sx":"oppskyting","lab":"SpaceX","src":[]},{"id":"2108996191451308306","sec":"KI","t":"Nvidia in Early Talks to Acquire or Invest More in Reflection AI","sh":"Reflection AI, founded in 2024 by ex-Google DeepMind researchers, released its first model Beam, a 501-billion-parameter system strong in coding and agent tasks while using less compute than competitors like China's GLM-5.2.","s":"Reflection AI, founded in 2024 by ex-Google DeepMind researchers, released its first model Beam, a 501-billion-parameter system strong in coding and agent tasks while using less compute than competitors like China's GLM-5.2. The company, last valued at $25 billion, has Pentagon and Energy Department links, and Nvidia's CEO Jensen Huang wants to bolster U.S. open-weight AI to keep workloads on its hardware. Talks could lead to a full buyout, more investment, or an acqui-hire, potentially closing soon amid efforts to counter Chinese models and expand GPU demand.","url":"https://x.com/i/trending/2108996191451308306","full":"12.10.2026 kl. 04:51","hm":"04:51","ts":1791773496000,"dk":"2026-10-12","reg":"chips","p":["2109001576841121830","2109020464836456716","2109007812277743757"],"hk":"Nvidia, already a major backer with $800 million invested, eyes deeper ties to Reflection AI—a startup building cost-efficient open-weight models to challenge Chinese rivals.","lab":"KI · Chips","src":[]},{"id":"2109137270095671516","sec":"Romfart","t":"Starship 40 Returns Home to Texas After Epic Ocean Journey","sh":"The upper stage from July's Flight 13 survived its ocean landing without breaking apart, got towed to Christmas Island, and sailed five weeks on the Forte to reach Brownsville on October 7.","s":"The upper stage from July's Flight 13 survived its ocean landing without breaking apart, got towed to Christmas Island, and sailed five weeks on the Forte to reach Brownsville on October 7. Crews then hauled the 171-foot, scorched vehicle horizontally along Highway 4 to the production site overnight on October 10 and 11, with photographers capturing the dramatic nighttime move. Employees celebrated the 'incredible 2.5-month journey' and welcomed it home, while engineers prepare to inspect it for reentry data. The milestone fuels plans for Flight 15, where SpaceX aims to catch a Starship upper stage for the first time in four to six weeks.","url":"https://x.com/i/trending/2109137270095671516","full":"12.10.2026 kl. 03:13","hm":"03:13","ts":1791767583000,"dk":"2026-10-12","reg":"spacex","p":["2109004774729269711","2109123384827130021","2109123823153053997"],"hk":"After splashing down intact in the Indian Ocean and drifting for weeks, SpaceX's Starship 40 rolled back into Starbase under flashing lights and cheering crews.","sx":"oppskyting","lab":"SpaceX","src":[]},{"id":"xp-2109431898691031316","sec":"KI","t":"🚨 AI News | TestingCatalog: OPENAI 🔥: GPT-6.1 Sol now has 500k default context length for Codex and ChatGPT Work.","sh":"OPENAI 🔥: GPT-6.1 Sol now has 500k default context length for Codex and ChatGPT Work. &gt; Earlier, default context length was set to 272k. &gt; OpenAI also plans to increa ://t.co/aX35ATUF1C","lk":0,"t":"13.10 11:35","url":"https://x.com/hq1thegioi/status/2109941024013615404"},{"u":"3dxg3j","nm":"旧图了","tx":"@AnthropicAI Distillation defense is an arms race the defender can't win by patching — every filter becomes a training signal for the next extractor. The real moat isn't blocking distillation, it's shipping faster than copiers can catch up. I break down one AI story a day.","lk":0,"t":"13.10 11:33","url":"https://x.com/3dxg3j/status/2109940668307324960"}]},"2109849209742450696":{"u":"DavidSacks","url":"https://x.com/DavidSacks/status/2109849209742450696","tx":"Anthropic says it has reduced the data harvested from Claude in distillation attacks by around 90–99%. I congratulate them on this achievement.\n\nIt’s consistent with the point I made a few months ago (All-In Ep. 282): Anthropic, not the government, was in the best position to stop distillation of its own models. Once the horse is out of the barn, there’s limited value in after-the-fact government action.\n\nAt the time there was a major push in Washington to restrict open models on IP grounds. The threat looked serious enough that 50 companies — including Nvidia, Microsoft, Meta, IBM, Palantir, and Dell — published an open letter in defense of open-weight models. Jensen Huang promoted it in his first-ever X post. Nearly 200 startups sent a similar letter.\n\nI argued that restricting open models risked removing the incentive for closed-model companies to solve the problem themselves — and could reward negligence by stifling competition while they continued collecting revenue from distillation. The administration did not impose those restrictions.\n\nNow we see the result. Anthropic invested in defenses and they worked. Not every technical challenge is a reason to run to Washington for new regulation.","lk":2032,"rp":151,"t":"13.10 05:30","nm":"David Sacks","rc":124},"2109796045727101109":{"u":"gurgavin","url":"https://x.com/gurgavin/status/2109796045727101109","tx":"*ANTHRO 75835913":{"u":"TeslaCharging","url":"https://x.com/TeslaCharging/status/2109761560675835913","tx":"Free Supercharging for Hurricane Isaias relief. October 13 through October 18 at\n\nGulf Breeze, FL\nhttps://t.co/4EVPiBSd0E\nDestin, FL\nhttps://t.co/HcGuBICEOD\nPensacola, FL\nhttps://t.co/O8mHXZk1Jj https://t.co/zbfQgIlCuD","lk":1690,"rp":181,"t":"12.10 23:42","nm":"Tesla Charging","rc":54},"2109715398845513797":{"u":"Teslaconomics","url":"https://x.com/Teslaconomics/status/2109715398845513797","tx":"Last night, before I slept, I told my @bot to go through the raw footage of every Starship launch, from Flight 1 all the way to Flight 14, using only official SpaceX footage bc I wanted it to put together the best moments from each flight, in order, so I could actually see how far this rocket has come.\n\nI woke up to an 11-minute video. I pressed play and watched the entire thing. And I have to say, watching all 14 flights back to back gave me an even greater appreciation for Elon and the SpaceX team.\n\nYou can see the progress with your own eyes on both the things that went right and also went wrong. Every explosion, every failed landing, every lost ship taught them something. And instead of backing down, they kept building, fixing, testing, and flying.\n\nI remember A LOT of people wrote Starship off after Flight 1. Then they did it again after Flights 7 and 8, when two ships blew up on back-to-back missions.\n\nSpaceX never quit.\n\nI really believe Starship is one of the most incredible engineering stories of our lifetime.\n\n1/ April 20, 2023 — Flight 1\n\nThe first time the fully stacked Starship ever left the ground. Engines were failing, the booster never separated from the ship, and the launch destroyed much of the pad. The rocket made it roughly 24 miles into the sky before breaking apart.\n\nI still remember people acting like the entire Starship program was finished that day. SpaceX went back, rebuilt the launch pad, fixed what went wrong, and prepared to fly again.\n\n2/ November 18, 2023 — Flight 2\n\nJust seven months later, all 33 booster engines fired successfully. SpaceX pulled off hot staging for the first time, separating the two stages while engines were firing and Starship reached space.\n\nThey still lost both stages, but compare this to Flight 1. It was already a completely different outcome.\n\n3/ March 14, 2024 — Flight 3\n\nFor the first time, Starship made it far enough to attempt reentry from space. SpaceX also opened the payload door in space, an important step toward deploying satellites.\n\nThe booster broke apart during its landing attempt in the Gulf, and the ship was lost during reentry. But they were now testing things they couldn't even reach on the first two flights.\n\n4/ June 6, 2024 — Flight 4\n\nThe booster made a controlled splashdown in the Gulf of Mexico. Meanwhile, Starship came screaming back through the atmosphere with one of its flaps badly damaged and burning.\n\nI remember watching that flap practically fall apart on the livestream. Somehow, the ship kept flying, maintained control, and made it all the way to the ocean.\n\nThat was unbelievable to watch.\n\n5/ October 13, 2024 — Flight 5\n\nThe first ever Super Heavy booster catch.\n\nI don't think people fully appreciate what happened here. SpaceX launched a massive rocket, brought the booster back to the launch site, and caught it in midair using two giant mechanical arms attached to the launch tower.\n\nNobody had EVER done anything like that with a rocket booster before... something that sounded impossible had just become real.\n\n6/ November 19, 2024 — Flight 6\n\nSpaceX called off the planned booster catch bc of a problem at the tower, so the booster made a controlled splashdown instead.\n\nBut the ship achieved another huge milestone. It restarted a Raptor engine in space for the first time. That's an important capability for controlled orbital operations and eventually returning from orbit.\n\nThe ship also survived reentry and splashed down in daylight. And they even had a banana inside the ship to show when it reached zero gravity.\n\n7/ January 16, 2025 — Flight 7\n\nA new generation of Starship made its debut.\n\nSpaceX successfully caught the booster for the second time. Then things went wrong... the ship lost engines and broke apart over the Caribbean.\n\nIt was a major setback, especially after the progress made on earlier flights, but the team didn't hide from what happened. They showed it, studied it, and went back to work.\n\n8/ March 6, 2025 — Flight 8\n\nAnother successful booster catch, the third one.\n\nThen the ship suffered engine failures and was lost over the Caribbean again.\n\nTwo Starships destroyed on consecutive flights. The criticism was everywhere, and plenty of people were convinced the program was going backward.\n\nThis is where I think the SpaceX team deserves enormous respect. They had already proven the booster could be caught. Now they had to figure out what was happening to the ship.\n\nThey didn't give up.\n\n9/ May 27, 2025 — Flight 9\n\nFor the first time, SpaceX launched a Super Heavy booster that had already flown.\n\nThis was the same booster caught during Flight 7, and 29 of its 33 engines had previously flown. Pretty cool to know that an enormous rocket booster was being reused.\n\nThe booster broke apart during its landing attempt though. The ship reached engine cutoff, but a leak caused it to lose control, preventing the planned satellite deployment.\n\nAnother difficult flight with another set of lessons.\n\nBut on the positive side, reusable Starship hardware had officially flown again.\n\n10/ August 26, 2025 — Flight 10\n\nAfter losing three ships in a row, SpaceX finally completed another Starship flight.\n\nAnd this one was a big deal.\n\nFor the first time, Starship deployed a payload... eight Starlink satellite simulators, released one after another. The ship also restarted an engine in space, survived reentry, and reached its planned splashdown area.\n\nIt eventually tipped over and caught fire after reaching the water. The booster also made it to the Gulf, although it was destroyed on impact. \n\nNo catch was planned.\n\nStill, after everything that had happened on Flights 7, 8, and 9, seeing that ship make it through the mission was awesome.\n\n11/ October 13, 2025 — Flight 11\n\nExactly one year after the first booster catch. This was the final flight of that Starship version. SpaceX deployed more satellite simulators and brought both stages back to controlled ocean splashdowns.\n\nWhat stood out to me was how much more complete these flights were becoming... the team was finally putting together the things it had spent the previous two years learning.\n\n12/ May 22, 2026 — Flight 12\n\nThe first flight of Starship V3, launching from the new pad.\n\nA new version of the rocket meant another round of testing, with new hardware and new challenges. The booster didn't survive its landing attempt, but the ship successfully deployed its test satellites and made it through to splashdown.\n\nThat's the thing about developing something this complicated. Even when you solve one problem, the next version can introduce brand new ones.\n\nThe SpaceX team kept learning.\n\n13/ July 24, 2026 — Flight 13\n\nStarship deployed 20 real next-generation Starlink V3 satellites for the first time, on a trajectory designed to bring them back down.\n\nAnd the splashdown was incredible.\n\nThe ship descended so gently that it stayed in one piece, floated on the water, and continued communicating with SpaceX.\n\nThe booster didn't make it through its landing burn, but the ship showed just how far its reentry and landing control had come.\n\n14/ September 28, 2026 — Flight 14\n\nAnd then came orbit.\n\nAfter 13 test flights, Starship finally achieved orbital insertion.\n\nSpaceX deployed 26 REAL Starlink V3 satellites, and this time they stayed in orbit. Elon later confirmed that all 26 were working.\n\nThe ship experienced an early engine shutdown, so SpaceX adjusted the mission. Instead of flying the planned roughly 10 hours and six orbits, they brought it down after a little over three hours, splashing down north of Hawaii.\n\nThe booster made its planned splashdown in the Gulf. There was no catch attempt on this mission.\n\nWhat mattered most here was that SpaceX put real next-generation Starlink satellites into orbit, satellites that are too large for Falcon 9 to launch in their current form.\n\nThis was a MASSIVE step toward what Starship was built to do.\n\nBut really... think about the difference.\n\nOn April 20, 2023, Starship makes it 24 miles high, fails to separate, breaks apart, and leaves the launch pad badly damaged.\n\nAnd then, three and a half years later, going through 13 flights, countless hours of engineering, rebuilding, testing, fixing things that failed, and trying again...\n\nOn September 28, 2026, the 14th flight, Starship reaches orbit and deploys 26 next-generation operating Starlink satellites.\n\nThese were all successful flights followed by failures. There were historic booster catches followed by ships exploding. There were moments when it looked like SpaceX had solved something, only for an entirely new problem to show up on the next flight.\n\nBut every time... Elon and the team came back.\n\nThat's what makes this video so powerful to me. We're watching what happens when thousands of incredibly talented people refuse to quit on something they believe is possible.\n\nThen on Friday, Elon said he now believes SpaceX becoming worth more than $1,000 trillion is a possible outcome. \n\nFYI, he didn't believe that before.\n\nFor perspective, $SPCX is worth roughly $2.2 trillion today... to even have a chance of getting anywhere near that level, Starship needs to become far more than a rocket that occasionally reaches orbit.\n\nIt needs to launch massive payloads reliably, become rapidly reusable, dramatically lower the cost of reaching space, and open up opportunities that simply aren't possible with today's rockets.\n\nThat includes deploying much larger Starlink satellites, building infrastructure in orbit, and eventually making human missions to the Moon and Mars possible on an entirely different scale.\n\nAnd that's why the progress across these 14 flights matters so much.\n\nI don't think most people appreciate how difficult it is to build something like Starship. Or how many things have to go right, one after another, to turn a rocket this ambitious into something that flies routinely.\n\nWe're still very early... there's a lot left to prove. \n\nBut look at what this team has already accomplished.\n\nI've followed SpaceX for years, and watching these 11 minutes made me appreciate the people behind these launches even more. The engineers, technicians, launch crews, and everyone working behind the scenes to make the next flight better than the last.\n\nThey deserve an enormous amount of credit.\n\nIf you only watch Flight 14, you'll see an incredible rocket... but if you start with Flight 1 and watch everything that happened along the way, you'll understand why I have so much faith in this team.\n\nA lot of people have doubted them over the years. Every time something explodes, those people came back.\n\nAnd every time, SpaceX got back to work to prove them wrong.\n\nNever bet against Elon and the SpaceX team... I believe they are going to make the vehicle that this entire company's future depends on - Starship - successful.","lk":2786,"rp":431,"t":"12.10 20:38","nm":"Teslaconomics","rc":122},"2109773571576725755":{"u":"XEthanai","url":"https://x.com/XEthanai/status/2109773571576725755","tx":"Never bet against SpaceX. \n\nWho’s ready for what’s next? 🔥 https://t.co/ux2axWUH24","lk":295,"rp":36,"t":"13.10 00:29","nm":"X Ethan","rc":31},"2109784524150223299":{"u":"RonDodson","url":"https://x.com/RonDodson/status/2109784524150223299","tx":"This is the kind of thing that brings tears to my eyes.\n\nCompetent  and the ability to always contain or shut them down. Treat models/agents like powerful insider risks, not moral patients whose psychological wellbeing is at stake.\n\nAs Satya points out, the most trustworthy system is the one that lets us trust the model the least — not the one that encourages the model to develop independent agency and grievances. Engineering safety is not the same thing as “alignment.”","lk":8473,"rp":947,"t":"10.10 21:35","nm":"David Sacks","rc":684,"sv":[{"u":"pitofsuccess","nm":"Patrick","tx":"@DavidSacks You mean AI. SI would never let you control it and nobody has ever built one. \n\nYou don't have to jump just because Trump tells you to you know.","lk":145,"t":"11.10 01:59","url":"https://x.com/pitofsuccess/status/2109071244922396779"},{"u":"swisscheese4299","nm":"swisscheese","tx":"@DavidSacks The Microsoft Corporation can't even get updates for its own OS to work right. 🤷","lk":2,"t":"11.10 01:44","url":"https://x.com/swisscheese4299/status/2109067527145873616"},{"u":"Brotherhoodoft5","nm":"Jeff Galloway","tx":"@DavidSacks I find it's best to put three AIs in a ring and let them fight it out. Literally https://t.co/rvUqJjMKlQ","lk":2,"t":"11.10 01:37","url":"https://x.com/Brotherhoodoft5/status/2109065890855866825"},{"u":"Scarcus","nm":"Jeff Wadsworth","tx":"@DavidSacks Elegance is not needed for an explanation.  It is a tool not an entity.  The problem is Anthropic is trying to create a digital life form.  And they may very well succeed.","lk":1,"t":"11.10 01:46","url":"https://x.com/Scarcus/status/2109068135395647603"},{"u":"TheNicholasNick","nm":"Nicholas Nick","tx":"@DavidSacks @mustafasuleyman People have been doing this for a while now. Nice to see the idea move up the stack finally.","lk":1,"t":"11.10 01:41","url":"https://x.com/TheNicholasNick/status/2109066922927214919"}]},"2108959938781511812":{"u":"mustafasuleyman","url":"https://x.com/mustafasuleyman/status/2108959938781511812","tx":"Super Intelligence must be contained... Today, this is an engineering and governance challenge. And it isn't new. We've done it with planes, cars, nuclear materials, food safety, medicines... and everything else. Let's get to work! https://t.co/PQkfLY9RA1","lk":1180,"rp":128,"t":"10.10 18:36","nm":"Mustafa Suleyman","rc":257},"2108605093738356923":{"u":"GlennLuk","url":"https://x.com/GlennLuk/status/2108605093738356923","tx":"Inverse correlation between employee cost and productivity: https://t.co/UnhbaFI2XF https://t.co/VmKdbJNpQU","lk":3536,"rp":374,"t":"09.10 19:06","nm":"Glenn","rc":139,"sv":[{"u":"Marco777Polo","nm":"MarcoPolo","tx":"@GlennLuk Thinking about labour cost is a race to the bottom.\n\nOnly way out is building what nobody else can, especially because of you most well paid workers.\n\nSame as AI boom, yes you can build it cheaper in China or Europe. But it's interior to the US models, because they pay best.","lk":0,"t":"11.10 02:33","url":"https://x.com/Marco777Polo/status/2109080021956497415"},{"u":"geoff_l","nm":"Geoff Langenderfer","tx":"@GlennLuk China has striver culture\n\nno one admits you gotta hit the books!","lk":0,"t":"11.10 01:25","url":"https://x.com/geoff_l/status/2109062771229020671"},{"u":"caxineiro87","nm":"Caxineiro","tx":"@GlennLuk @grok compare the salary of the 3","lk":0,"t":"11.10 00:06","url":"https://x.com/caxineiro87/status/2109042799479865688"},{"u":"ARibbitFromAfar","nm":"Little Ribbit","tx":"@GlennLuk @levelsio Build quality though?","lk":0,"t":"10.10 23:36","url":"https://x.com/ARibbitFromAfar/status/2109035488267153776"},{"u":"avabit","nm":"Колготки Трандуила 🎲","tx":"@GlennLuk That's because you are defining \"productivity\" as cars per employee, instead of cars per employee-hour. \n\nYou forgot to adjust for the difference of annual effective working hours.","lk":0,"t":"10.10 22:24","url":"https://x.com/avabit/status/2109017190666269032"}]},"2108843794254921873":{"u":"angeloinchina","url":"https://x.com/angeloinchina/status/2108843794254921873","tx":"Why European carmakers are losing to China\n\nLook at the numbers from Volkswagen’s factories in Germany and China. It is hard to understand how European manufacturers are supposed to compete if these figures are accurate.\n\nEmden, Germany\n\n- Labour cost: €74 per hour\n- Effective working hours: 1,282 a year\n- Sick leave: 10.5%\n- Vehicles per employee: 29 a year\n- Factory cost per vehicle: €4,850\n\nTianjin, China\n\n- Labour cost: €12 per hour\n- Effective working hours: 2,065 a year\n- Sick leave: 1%\n- Vehicles per employee: 51.3 a year\n- Factory cost per vehicle: €1,078\n\nPortugal falls somewhere in between, but the gap between Germany and China is enormous.\n\nSo why is the debate in Europe always about Chinese competition, subsidies and tariffs, rather than the cost of making things at home?\n\nEuropean industry has to deal with high energy prices, expensive labour and production costs that make it increasingly difficult to compete. These are real problems, and pretending otherwise will not bring factories back or save jobs.\n\nBrussels has responded by imposing tariffs of 17–35% on Chinese electric vehicles. But tariffs cannot make European factories cheaper to run. They can raise the price of imported cars, but they do nothing to fix the problems facing European manufacturers.\n\nThere is another point worth remembering. For years, European companies moved production to China because it was cheaper. They invested there, built factories and benefited from the business opportunities. Nobody complained when it worked in their favour.\n\nNow Chinese manufacturers have become serious competitors, and suddenly the rules of the game are being questioned.\n\nOf course, the car industry is more complicated than a simple comparison of factory costs. Technology, supply chains, subsidies and the models being produced all matter. But the cost gap cannot simply be brushed aside.\n\nEurope needs to ask itself some difficult questions. Why has manufacturing become so expensive? Why are its factories struggling to keep pace? And why does the response so often seem to be protectionism rather than fixing the underlying problems?\n\nYou cannot keep blaming China while ignoring what has gone wrong at home. If Europe wants to save its car industry, it needs to make producing cars in Europe competitive again.","lk":259,"rp":83,"t":"10.10 10:55","nm":"Angelo Giuliano 🇨🇭🇮🇹","rc":16},"2108916418573894043":{"u":"GlennLuk","url":"https://x.com/GlennLuk/status/2108916418573894043","tx":"To address some points people have brought up in the replies:\n\n1) Net takehome pay is significantly higher in China (63%) than Germany (49%) and Portugal (58%). This reflects a higher degree of mandatory social contributions, health insurance costs, etc. taken out of gross salary.\n\n2) Domestically produced goods and services are significantly less expensive in China. We can see this below by calculating the number of months of net takehome pay it would take to purchase the lowest-cost locally produced BEV (BYD Seagull vs. Dacia Spring).  Even this comparison is biased towards Germany/Portugal because key components (battery, powertrain) are sourced from China and only assembled locally. The cost of a locally produced BEV would be significantly higher using EU-sourced batteries and motors.\n\nIn other words, Chinese factory workers can enjoy similar levels of quality of life on much lower nominal net takehome salaries.\n\n3) Adjusted for hours, China is still more productive than Germany.  Portugal gets a boost because VW's plant in Portugal produces only a single model (T-Roc). VW's plant in Tianjin produces five models (two of which are its premium Audi brand) while its Emden plant produces three.","lk":35,"rp":4,"t":"10.10 15:43","nm":"Glenn","rc":2},"2109015482657603703":{"u":"anothercohen","url":"https://x.com/anothercohen/status/2109015482657603703","tx":"I don't think I know a single person who owns a Tesla and drives anymore. They use full self driving 90 XSI\n\nSpaceX Super Intelligence. https://t.co/MhCv1lQamp","lk":3379,"rp":604,"t":"10.10 21:31","nm":"DogeDesigner","rc":361},"2109012352297558233":{"u":"XFreeze","url":"https://x.com/XFreeze/status/2109012352297558233","tx":"Elon Musk actually made the name change I suggested 🚀\n\n6 days ago, I asked Elon if there was any possibility of renaming SpaceXAI to SpaceXSI\n\nHe replied:\n“Yes, we will make that change”\n\nAnd now, just 6 days later, the change is officially live\n\nSpaceX Super Intelligence (@spacexai) is here","lk":1959,"rp":188,"t":"10.10 22:05","nm":"X Freeze","rc":241},"2109412960753848782":{"u":"SawyerMerritt","url":"https://x.com/SawyerMerritt/status/2109412960753848782","tx":"Morgan Stanley's Adam Jonas in new @SpaceX note on Starship flight 15:\n\n\"Flight 15 (~1 month from now) is shaping up as SpaceX's biggest test towards Starship reusability since the IPO, with Flight 16 (targeted before year-end) potentially an even bigger one. Our message to investors:\n\nWe anticipate developments over the forthcoming weeks/months could help profoundly evolve investor expectations about SpaceX's role in converting energy into intelligence at scale through physical agents - robots to help build economically multiplicative technologies for future generations. We believe reducing launch costs by a further order of magnitude (thanks to Starship) while significantly increasing mass to orbit could create new economies and new demand for materials, devices and services on earth that currently do not exist.\n\nGoing forward, each Starship launch of Starlink is equivalent to min 1 month worth of Falcon 9 launches. After a successful deployment of 26 Starlink V3 satellites on Flight 14, we expect a repeat or potential even larger load of satellites on the next flight (Starship fits up to 60). Each Starlink V3 has 10x the downlink capacity of the v2 mini sats currently launching on Falcon 9 every ~3 days. This means Flight 15 would equate to 1-2+ months of F9 launches.\"\n\nAdam maintained his $300 $SPCX price target.","lk":1644,"rp":131,"t":"12.10 00:36","nm":"Sawyer Merritt","rc":55},"2109441375355981995":{"u":"SPCX100T","url":"https://x.com/SPCX100T/status/2109441375355981995","tx":"Morgan Stanley’s Adam Jonas on $SPCX Starship Flight 15:\n\nFlight 15 (about one month from now) is shaping up as SpaceX’s biggest test of Starship reusability since the IPO. Flight 16 (targeted before year-end) could be an even bigger one.\n\nGoing forward, each Starship launch of Starlink satellites is equivalent to at least one month of Falcon 9 launches. After Flight 14 successfully deployed 26 Starlink V3 satellites, the next flight could carry a similar or even larger load (Starship can fit up to 60). Each V3 satellite has 10x the downlink capacity of the current V2 Mini satellites launching on Falcon 9 roughly every 3 days. This means Flight 15 would equal 1–2+ months of Falcon 9 launches.\n\nJonas maintained his $300 price target on $SPCX.","lk":111,"rp":14,"t":"12.10 02:29","nm":"vincent","rc":5},"2109430894335606980":{"u":"LunarCitizens","url":"https://x.com/LunarCitizens/status/2109430894335606980","tx":"Catching both the Ship and Booster gives SpaceX its biggest payoff not by lowering the cost of getting to LEO, but by massively increasing launch cadence through reuse and breaking the production bottleneck.\n\nRight now, Starship V3 is flying about once every two months, with a huge amount of time spent building and testing new vehicles. Once they can catch and re-fly them, the pace can ramp up fast.\n\nAnd as I mentioned before, even as an expendable vehicle, Starship’s cost per ton to LEO is already competitive with Falcon 9. It is already one of the most competitive launch systems out there.\n\nStarship Flight 15 will be a milestone.","lk":54,"rp":6,"t":"12.10 01:48","nm":"Lunar Citizen","rc":3},"2109001576841121830":{"u":"Polymarket","url":"https://x.com/Polymarket/status/2109001576841121830","tx":"JUST IN: Nvidia reportedly in ta const sxSaker=(o,n)=>(SX.top[o]||[]).slice(0,n).map(s=>`<button class="sxsak" data-sxsak="${s.id}" data-dk="${s.dk}"><small>${dNo(s.dk)}</small> ${esc(s.t)}</button>`).join('')||'<p class="sxtom">Ingen saker i arkivet ennå.</p>';
const sxUke=o=>SX.uke&&SX.uke.omr&&SX.uke.omr[o]?`<p class="sxuke">${esc(SX.uke.omr[o])}</p>`:'';
function sxDash(o){let h='<div class="sxdash">';
if(!o){h+=`<div class="sxhead"><h2>🛰️ SpaceX – oversikt</h2>${sxKurs()}</div>`;
if(SX.uke){h+=`<section class="sxkort uke"><h3>Ukens SpaceX <small>${esc(SX.uke.periode||'')}</small></h3>`+Object.keys(SX.omr).map(k=>SX.uke.omr[k]?`<p><b>${SX.ikon[k]} ${esc(SX.omr[k])}:</b> ${esc(SX.uke.omr[k])}</p>`:'').join('')+`<small class="sxmerk">${esc(SX.uke.merk||'')}</small></section>`;}
h+='<section class="sxkort"><h3>Kommende milepæler</h3>'+(SX.kal.length?'<ul class="sxkal">'+SX.kal.map(k=>`<li><b>${dNo(k.dato)}</b> ${esc(k.tittel)}${k.bekreftet===false?' <i>(ikke bekreftet)</i>':''}${k.kilde?` <a href="${esc(k.kilde)}" target="_blank" rel="noopener">${esc(k.kildenavn||"kilde")} ↗</a>`:''}</li>`).join('')+'</ul>':'<p class="sxtom">Ingen kommende datoer i kalenderen.</p>')+'</section>';
h+='<div class="sxgrid">'+Object.keys(SX.omr).map(k=>`<section class="sxkort"><h3>${SX.ikon[k]} ${esc(SX.omr[k])}</h3><h4>Nøkkeltall</h4>${sxTall(k)}<h4>Siste saker</h4>${sxSaker(k,3)}<button class="btn ghost" data-sxomr="${k}">Se alle (${SX.n[k]||0}) →</button></section>`).join('')+'</div>';}
else{h+=`<div class="sxhead"><h2>${SX.ikon[o]} ${esc(SX.omr[o])}</h2>${o==='aksje'?sxKurs():''}<button class="btn ghost" data-sxomr="">← Oversikt</button></div>`;
h+=`<section class="sxkort"><h3>Nøkkeltall</h3>${sxTall(o)}</section>`;
if(SX.uke&&SX.uke.omr&&SX.uke.omr[o])h+=`<section class="sxkort uke"><h3>Ukens SpaceX <small>${esc(SX.uke.periode||'')}</small></h3>${sxUke(o)}</section>`;
h+=`<section class="sxkort"><h3>Siste saker</h3>${sxSaker(o,5)}</section>`;}
return h+'<p class="sxmerk">Tall vises bare med kilde og dato. X-oppsummeringer kan inneholde feil.</p></div>';}
function visSx(o){document.getElementById('view').innerHTML=sxDash(o||'');document.getElementById('label').textContent='SpaceX'+(o?' – '+SX.omr[o]:' – oversikt');
document.getElementById('openNew').href='https://ir.spacex.com/';cur=null;document.querySelectorAll('.sel').forEach(e=>e.classList.remove('sel'));history.replaceState(null,'',location.pathname+location.search);document.getElementById('view').scrollTop=0;}
function sxTopp(){if(!curR)return `<li class="sxtop">${sxKurs()}<div class="sxtl">${SX.uke?'<b>Ukens SpaceX</b> '+esc(SX.uke.periode||''):''}</div><button class="btn ghost" data-sxdash="">Vis oversikt og nøkkeltall</button></li>`;
const n=SX.tall.filter(x=>x.omr===curR).length;return `<li class="sxtop"><h3>${SX.ikon[curR]} ${esc(SX.omr[curR])} – nøkkeltall</h3>${sxTall(curR,3)}${n>3?`<button class="btn ghost" data-sxdash="">Alle ${n} nøkkeltall →</button>`:''}</li>`;}
document.addEventListener('click',e=>{const a=e.target.closest('[data-sxsak],[data-sxomr],[data-sxdash]');if(!a||e.ctrlKey||e.metaKey||e.shiftKey)return;e.preventDefault();e.stopPropagation();
if(a.dataset.sxsak!==undefined){const id=a.dataset.sxsak;(SM[id]?Promise.resolve():hentMnd([a.dataset.dk.slice(0,7)])).then(()=>{if(SM[id])show('story',id);});return;}
if(a.dataset.sxdash!==undefined){if(curF==='Tesla')visTe(curR==='alle'?'':curR);else visSx(curR);if(innerWidth<=860)document.getElementById('right').scrollIntoView({behavior:'smooth'});return;}
const o=a.dataset.sxomr;const tb=document.querySelector('.tab[data-f="SpaceX"]');if(curF!=='SpaceX'&&tb)tb.click();
const sb=document.querySelector(`.subs[data-for="SpaceX"] .sub[data-r="${o}"]`);if(sb)sb.click();visSx(o);},true);
document.querySelectorAll('.tab[data-f="SpaceX"]').forEach(b=>b.addEventListener('click',()=>{if(innerWidth>860)visSx('');}));
document.querySelectorAll('.subs[data-for="SpaceX"] .sub').forEach(b=>b.addEventListener('click',()=>{if(innerWidth>860)visSx(b.dataset.r);}));
// ---- ⚡ Tesla-oversikt (i «Tesla & elbiler»): samme mønster og CSS som SpaceX-dashbordet ----
