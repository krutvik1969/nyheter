reas before I had thought it was not.\n\nAnd the second derivative of that probability vs time is rising fast, albeit from a tiny base.","lk":5604,"rp":440,"t":"09.10 18:43","nm":"Elon Musk","rc":258},"2108610458081218872":{"u":"WatcherGuru","url":"https://x.com/WatcherGuru/status/2108610458081218872","tx":"JUST IN: Elon Musk says SpaceX $SPCX reaching a $1 quadrillion valuation is a \"possible\" outcome. https://t.co/KCZgFTbc8P","lk":5470,"rp":390,"t":"09.10 19:28","nm":"Watcher.Guru","rc":379},"2108605093738356923":{"u":"GlennLuk","url":"https://x.com/GlennLuk/status/2108605093738356923","tx":"Inverse correlation between employee cost and productivity: https://t.co/UnhbaFI2XF https://t.co/VmKdbJNpQU","lk":3536,"rp":374,"t":"09.10 19:06","nm":"Glenn","rc":139,"sv":[{"u":"Marco777Polo","nm":"MarcoPolo","tx":"@GlennLuk Thinking about labour cost is a race to the bottom.\n\nOnly way out is building what nobody else can, especially because of you most well paid workers.\n\nSame as AI boom, yes you can build it cheaper in China or Europe. But it's interior to the US models, because they pay best.","lk":0,"t":"11.10 02:33","url":"https://x.com/Marco777Polo/status/2109080021956497415"},{"u":"geoff_l","nm":"Geoff Langenderfer","tx":"@GlennLuk China has striver culture\n\nno one admits you gotta hit the books!","lk":0,"t":"11.10 01:25","url":"https://x.com/geoff_l/status/2109062771229020671"},{"u":"caxineiro87","nm":"Caxineiro","tx":"@GlennLuk @grok compare the salary of the 3","lk":0,"t":"11.10 00:06","url":"https://x.com/caxineiro87/status/2109042799479865688"},{"u":"ARibbitFromAfar","nm":"Little Ribbit","tx":"@GlennLuk @levelsio Build quality though?","lk":0,"t":"10.10 23:36","url":"https://x.com/ARibbitFromAfar/status/2109035488267153776"},{"u":"avabit","nm":"Колготки Трандуила 🎲","tx":"@GlennLuk That's because you are defining \"productivity\" as cars per employee, instead of cars per employee-hour. \n\nYou forgot to adjust for the difference of annual effective working hours.","lk":0,"t":"10.10 22:24","url":"https://x.com/avabit/status/2109017190666269032"}]},"2108843794254921873":{"u":"angeloinchina","url":"https://x.com/angeloinchina/status/2108843794254921873","tx":"Why European carmakers are losing to China\n\nLook at the numbers from Volkswagen’s factories in Germany and China. It is hard to understand how European manufacturers are supposed to compete if these figures are accurate.\n\nEmden, Germany\n\n- Labour cost: €74 per hour\n- Effective working hours: 1,282 a year\n- Sick leave: 10.5%\n- Vehicles per employee: 29 a year\n- Factory cost per vehicle: €4,850\n\nTianjin, China\n\n- Labour cost: €12 per hour\n- Effective working hours: 2,065 a year\n- Sick leave: 1%\n- Vehicles per employee: 51.3 a year\n- Factory cost per vehicle: €1,078\n\nPortugal falls somewhere in between, but the gap between Germany and China is enormous.\n\nSo why is the debate in Europe always about Chinese competition, subsidies and tariffs, rather than the cost of making things at home?\n\nEuropean industry has to deal with high energy prices, expensive labour and production costs that make it increasingly difficult to compete. These are real problems, and pretending otherwise will not bring factories back or save jobs.\n\nBrussels has responded by imposing tariffs of 17–35% on Chinese electric vehicles. But tariffs cannot make European factories cheaper to run. They can raise the price of imported cars, but they do nothing to fix the problems facing European manufacturers.\n\nThere is another point worth remembering. For years, European companies moved production to China because it was cheaper. They invested there, built factories and benefited from the business opportunities. Nobody complained when it worked in their favour.\n\nNow Chinese manufacturers have become serious competitors, and suddenly the rules of the game are being questioned.\n\nOf course, the car industry is more complicated than a simple comparison of factory costs. Technology, supply chains, subsidies and the models being produced all matter. But the cost gap cannot simply be brushed aside.\n\nEurope needs to ask itself some difficult questions. Why has manufacturing become so expensive? Why are its factories struggling to keep pace? And why does the response so often seem to be protectionism rather than fixing the underlying problems?\n\nYou cannot keep blaming China while ignoring what has gone wrong at home. If Europe wants to save its car industry, it needs to make producing cars in Europe competitive again.","lk":259,"rp":83,"t":"10.10 10:55","nm":"Angelo Giuliano 🇨🇭🇮🇹","rc":16},"2108916418573894043":{"u":"GlennLuk","url":"https://x.com/GlennLuk/status/2108916418573894043","tx":"To address some points people have brought up in the replies:\n\n1) Net takehome pay is significantly higher in China (63%) than Germany (49%) and Portugal (58%). This reflects a higher degree of mandatory social contributions, health insurance costs, etc. taken out of gross salary.\n\n2) Domestically produced goods and services are significantly less expensive in China. We can see this below by calculating the number of months of net takehome pay it would take to purchase the lowest-cost locally produced BEV (BYD Seagull vs. Dacia Spring).  Even this comparison is biased towards Germany/Portugal because key components (battery, powertrain) are sourced from China and only assembled locally. The cost of a locally produced BEV would be significantly higher using EU-sourced batteries and motors.\n\nIn other words, Chinese factory workers can enjoy similar levels of quality of life on much lower nominal net takehome salaries.\n\n3) Adjusted for hours, China is still more productive than Germany.  Portugal gets a boost because VW's plant in Portugal produces only a single model (T-Roc). VW's plant in Tianjin produces five models (two of which are its premium Audi brand) while its Emden plant produces three.","lk":35,"rp":4,"t":"10.10 15:43","nm":"Glenn","rc":2},"2108188665377849817":{"u":"marclou","url":"https://x.com/marclou/status/2108188665377849817","tx":"The more I use Opus 5.5, the more I realize how far behind OpenAI models are.\n\nNot just coding. Everything.\n\nI sent GPT-6 Astra my V02 max lab test results, and it gave me a headache. 200 sentences of: \"your report shows this, I think that, therefore it's inconclusive\".\n\nOn the other hand, Opus 5.5 gave me the gist and actionable steps.\n\nOpenAI models right now are like that overthinking guy who can't make a decision.\n\nOpus 5.5 is that high-agency friend who tells you exactly what you need to hear in one sentence.\n\nI don't know how the gap widened so much in the last few months.","lk":4132,"rp":97,"t":"08.10 15:32","nm":"Marc Lou","rc":433,"sv":[{"u":"Xxi5olc","nm":"Axi","tx":"@marclou No I used Opus 5.5 for a while. It’s a good model but no where as magical you described. lol","lk":17,"t":"09.10 00:53","url":"https://x.com/Xxi5olc/status/2108330007651094678"},{"u":"_nucleus_ai_","nm":"Nucleus AI","tx":"@marclou the best AI isn’t the one that says the most, it’s the one that actually helps you get things done","lk":0,"t":"09.10 01:56","url":"https://x.com/_nucleus_ai_/status/2108345712786510199"},{"u":"TexasPundit","nm":"TexasPundit","tx":"@marclou GPT 6.1 Sol exists….","lk":0,"t":"09.10 01:54","url":"https://x.com/TexasPundit/status/2108345375312564233"},{"u":"stas_sorokin_","nm":"Stanislav Sorokin","tx":"@marclou On bug fixing the gap is one test: GPT-6 Luna passed 23 of 24 hidden tests, Haiku 5.5 got 24. Your verbosity point holds though. Luna wrote 2.2x Sol's output. And both GPT-6 models missed the exact same bug. Guess which one? https://t.co/bujgZTZ9v2","lk":0,"t":"09.10 01:47","url":"https://x.com/stas_sorokin_/status/2108343558759477363"},{"u":"kimindiehacker","nm":"Kimi Nguyen","tx":"@marclou Opus 5.5 seems to really simplify complex data, while GPT-6 Astra complicates it","lk":0,"t":"09.10 01:18","url":"https://x.com/kimindiehacker/status/21 sts.","lk":3880,"rp":336,"t":"08.10 19:19","nm":"Thomas Kurian","rc":460,"sv":[{"u":"apoorvdarshan","nm":"Apoorv Darshan","tx":"@ThomasOrTK i didnt knew gemini has desktop app lol\n\njust merge it with antigravity like chatgpt/codex is to gemini/antigravity https://t.co/yKjaTn6hW0","lk":18,"t":"09.10 01:29","url":"https://x.com/apoorvdarshan/status/2108339000482341146"},{"u":"pieropan","nm":"David Pieropan","tx":"@ThomasOrTK Meanwhile I’m still at gemini 3.6 in my workspace good job Google","lk":1,"t":"09.10 01:56","url":"https://x.com/pieropan/status/2108345806872801419"},{"u":"OMGitsKlumzy","nm":"Kwabena.gg","tx":"@ThomasOrTK What happens to Antigravity now?","lk":1,"t":"09.10 01:55","url":"https://x.com/OMGitsKlumzy/status/2108345461568618659"},{"u":"MrBrjan","nm":"Brjan | AI Builder","tx":"@ThomasOrTK if Gemini truly integrates all business context, it could redefine workflow efficiency","lk":1,"t":"09.10 01:19","url":"https://x.com/MrBrjan/status/2108336565810561145"},{"u":"AndrewVanBeek1","nm":"Andrew Van Beek","tx":"@ThomasOrTK Hows the MCP tool calling?","lk":0,"t":"09.10 01:45","url":"https://x.com/AndrewVanBeek1/status/2108343134208016660"}]},"2108257472553386059":{"u":"sundarpichai","url":"https://x.com/sundarpichai/status/2108257472553386059","tx":"Great to be with 700+ @googlecloud  customers at the historic NASA Hangar One for Gemini at Work! \n\nToday, we introduced the new Gemini agent, a single, universal agent for work that has all of your business context and answers your questions, handles your knowledge work, creates your images and media, and writes and runs code - all from a single prompt box. It is connected to your personal workflows, your systems of record, and your enterprise controls.\n\nIt’s built around a few core architectural principles:\n\nUnified Agent: Gemini can answer questions, do knowledge work and generate code from a single prompt box.\n\nAccess: Gemini is web-based and can be accessed from any device and integrated into third-party applications. It can also operate without a dedicated user interface.\n\nPersistent Execution: It runs in the cloud, which means it maintains a single set of memories, context and one personalization graph no matter where you access it.\n\nMulti-Agent Orchestration: Gemini can create sub-agents to tackle multi-step tasks and can also act as a coworker agent with a defined role and its own dedicated identity\n\nContext: Gemini knows your tools, data, and work history and learns how you work the more you use it.\nModel Choice Flexibility: It orchestrates across multiple models to deliver optimal quality and lower your costs.\n\nRead more in our blog: https://t.co/bd1ekBR74Q","lk":4028,"rp":415,"t":"08.10 20:05","nm":"Sundar Pichai","rc":299,"sv":[{"u":"HiAlanHoa","nm":"Alan Hoa👨‍💻","tx":"@sundarpichai @googlecloud I'm getting a déjà vu that it could become Gemini 3.5 Pro.","lk":1,"t":"09.10 01:44","url":"https://x.com/HiAlanHoa/status/2108342722918826323"},{"u":"ObscuredHopes","nm":"Obscured Hopes","tx":"@sundarpichai @googlecloud Sincere question - How does it know everything about the enterprise and how does it have context to the conversations ? Is this limited to enterprises using Gmail/ Meet and using Drive as documentation library? What about data sovereignty if everything lives in the cloud?","lk":1,"t":"09.10 01:23","url":"https://x.com/ObscuredHopes/status/2108337454629765396"},{"u":"huojigaowan","nm":"yi cheng（必然回关）（must flow back）","tx":"@sundarpichai @googlecloud All is we need get off from Google ai","lk":0,"t":"09.10 01:42","url":"https://x.com/huojigaowan/status/2108342252045271353"},{"u":"SaldanaAnn35539","nm":"Annette Saldaña","tx":"@sundarpichai @googlecloud Are you ever going to force those (_____)  to let me use my brain again or just settle with the once in a while tech support that you've provided since I arrived here? \nI'm tired. In need of FULFILLMENT of WHAT I SAID. Not someone else's VERSION of what I SAID. @elonmusk","lk":0,"t":"09. gl.)","lk":2,"t":"10.10 23:56","url":"https://x.com/Bee_Bombshell/status/2109040372441919833"},{"u":"bugbybughq","nm":"BugByBug","tx":"@theo The cheaper and faster models get, the more interesting it becomes to run agents for specific tasks in parallel.","lk":0,"t":"11.10 11:06","url":"https://x.com/bugbybughq/status/2109208924536836491"},{"u":"crustyhacker","nm":"Marc Mironescu","tx":"@theo The next step is making models more efficient and better, more specialized. OpenAI is doing that right now with GPT 6.1 Sol.","lk":0,"t":"11.10 06:30","url":"https://x.com/crustyhacker/status/2109139585829576781"},{"u":"dejanvasic85","nm":"Dejan Vasic","tx":"@theo Given the price of Haiku, we definitely know it was targeted at Deep Seek Flash 4.1","lk":0,"t":"11.10 03:13","url":"https://x.com/dejanvasic85/status/2109090033412313423"},{"u":"Fendiirawan165","nm":"Fendiirawan","tx":"@theo I haven't even tried using Haiku 5.5.. I have to try it","lk":0,"t":"11.10 02:34","url":"https://x.com/Fendiirawan165/status/2109080156447088818"}]},"2108616714162487521":{"u":"Bober_smart","url":"https://x.com/Bober_smart/status/2108616714162487521","tx":"Why is everyone silent about this? Official Anthropic tip for Claude Code: stop burning Opus 5.5 capacity on tasks Haiku 5.5 can swarm, while Sonnet 5.5 handles construction  \n\nshift the architect to standby mode using /advisor  \n\nclaude --advisor opus --subagents haiku  \n\nSonnet 5.5 drives the main session at maximum effort level, drafting modifications and running test suites\nHaiku 5.5 subagents scan the repository in parallel at 340 tokens per second, performing file discovery and reviewing spec documentation\nOpus 5.5 stays ready in the background as an expert advisor, stepping in only at three critical moments:  \n\n> rightarrow before locking down a strategy: does the blueprint miss authentication conditions or schema rules?\n> rightarrow when a test fails twice: are we fixing the root cause or going down an endless rabbit hole?\n> rightarrow before declaring completion: did final diffs introduce hidden bugs, and are baseline checks met?  \n\nOpus 5.5 evaluates. Sonnet 5.5 constructs. Haiku 5.5 executes in paralle\n\nJev engineering applies the exact same pattern one layer below: automated decisions requiring no reasoning (which file to open, which tool to trigger, retry or cancel) run in 16ms, so top-tier models wake up only when execution paths truly diverge\n\nPlan at maximum. Delegate at medium. Keep Opus ready\n\n> On-call Opus 5.5 reviews the full session history and spots deep architectural flaws\n> Lead Sonnet 5.5 applies edits, writes core logic, and executes test environments\n> Haiku 5.5 subagents handle AST parsing, grep queries, and API doc analysis in parallel\n> JEV micro-fork layer handles 1,500+ formal routing paths in under 16ms\n> Expert remains fully silent during routine bash execution to conserve context\n\nConfigure my Claude Code workspace for hierarchical advisor orchestration:  \n\n1. Check ~/.claude/settings.json and project settings for model role alignment (main, subagents, and advisor):\n\nPin main session model: sonnet with effortLevel: high for primary execution\nPin subagents model: haiku with effortLevel: medium for parallel file discovery and doc gathering\nPin advisor model: opus on call for strategic analysis\n\n2. Enable the advisor tool in ~/.claude/settings.json:\n\nSet advisorModel to claude-opus-5-5\nEnable subagent parallel dispatcher pool (3x workers)\n\n3. Set up automatic advisor consultation checkpoints in ~/.claude/CLAUDE.md:\n\nRequest /advisor opus before finalizing multi-file architecture plans\nAutomatically invoke /advisor opus when the same compiler or test error occurs twice\nRequire an advisor diff contract audit before marking tasks complete or staging git commits\n\n4. Limit subagent operational scopes:\n\nHaiku subagents return structured AST summaries and documentation snippets only without altering the main session context\n\nShow all configuration diffs before applying. Do not commit edits until confirmed\n \nhttps://t.co/F2pchjUzjZ","lk":137,"rp":20,"t":"09.10 19:52","nm":"Bober_smart","rc":32},"2108808338532163680":{"u":"Steven_Swinford","url":"https://x.com/Steven_Swinford/status/2108808338532163680","tx":"Exclusive:\n\nThere’s frustration in government with Andrew Bailey, the governor of the Bank of England, after he unexpectedly issued what’s being described as a Liz Truss warning\n\nOn Thursday he said that any significant increase in spending to cushion the impact of a cost of living crisis risked losing market confidence, feeding back into higher borrowing costs and higher levels of government debt\n\nIt was ultimately, he suggested, unsustainable. While he did not mention the budget in just under three weeks, his intervention was seen in government as a very unwelcome shot across the bows\n\n“Andrew Bailey needs to focus on doing his job,” a government source said. “The Bank of England has an important role to play in keeping inflation under control and supporting economic stability, but it is not the governor’s job to play politics or pile pressure on the government. He should focus on his responsibilities and leave the civil service to get on with delivering”\n\nPart of the anger in the government over Bailey’s intervention was the fact that ministers are under no illusions — the cost of living package in the budget on October 28 is expected to be modest at best, and even that will require difficult decisions\n\nhttps://t.co/aDyi4RdGwL","lk":597,"rp":175,"t":"10.10 08:34","nm":"Steven Swinford","rc":150},"2108827455071162619":{"u":"rcolvile","url":"https://x.com/rcolvile/status/2108827455071162619","tx":"Bank of England governor states the absolutely bleeding obvious, government gets huffy. https://t.co/ZskeBQz5xq","lk":961,"rp":84,"t":"10.10 09:50","nm":"Robert Colvile","rc":20,"sv":[{"u":"dannynolan64","nm":"Hoggish Greedly: Eco-villain","tx":"@rcolvile Trouble is we see ,'tax and  reform of Nigeria's policy framework and its increased confidence that reform momentum will be sustained.\n\nFitch attributed the improved outlook to greater naira flexibility, disinflation and faster-than-expected accumulation of foreign exchange reserves. Gross reserves stood at USD54.9 billion on September 25, 2026, up from USD32 billion in mid-April 2024, supported by increased formalisation of foreign exchange transactions, strong portfolio inflows, and higher export receipts and remittances. The agency noted that improved reserve quality has strengthened Nigeria's resilience to external shocks, and it projects a current account surplus of 6.4 per cent of GDP in 2026.\n\nFitch also pointed to improving performance in the real economy. It forecasts real GDP growth of 4.3 per cent in 2026, up from 4 per cent in 2025, and expects growth to remain above 4 per cent in 2027 and 2028, led by non-oil activity. Crude oil production has met Nigeria's OPEC target of 1.5 million barrels per day since May 2026, while the ramp-up of domestic refining is reducing refined product imports and demand for foreign exchange. Average inflation is forecast to moderate to 15.4 per cent in 2026, less than half its 2024 level.\n\nOn public finances and the financial sector, Fitch expects tax reforms to lift non-oil revenue to GDP ratio. It projects general government debt to average 32 per cent of GDP over 2026 to 2028, well below the 'B' median of 56 per cent. The agency also recognised Nigeria's liquid domestic debt market and the bank recapitalisation exercise, with many banks at capital adequacy ratios above 20 per cent, well above regulatory minimums.\n\nWith this action, all three major international rating agencies have taken positive rating actions on Nigeria in 2026. S&P Global Ratings upgraded Nigeria to 'B' from 'B-' in May, and Moody's Ratings revised its outlook to Positive in August. Separately, FTSE Russell returned Nigeria to Frontier Market status with effect from September 21, 2026. Taken together, these decisions reflect a converging and increasingly favourable assessment of Nigeria's reform trajectory.\n\nFitch's Positive Outlook further validates the difficult but necessary reforms implemented under the leadership of President Bola Ahmed Tinubu, GCFR, from removing a costly and inequitable fuel subsidy to unifying the exchange rate and the landmark tax reforms. Our medium-term ambition is to place Nigeria firmly on the path to investment grade. We are committed to this work, not for the rating itself, but because these reforms will lower Nigeria's cost of capital, crowd in private investment and create decent jobs at scale.\n\nThe Government also takes note of the areas where Fitch sees room for further progress. Inflation, although falling, remains above that of peer countries; government revenue is still low relative to the size of the economy; and interest costs absorb a high share of that revenue. These are the constraints the Government's reform programme is designed to address.\n\n𝐆𝐨𝐯𝐞𝐫𝐧𝐦𝐞𝐧𝐭'𝐬 𝐂𝐨𝐧𝐭𝐢𝐧𝐮𝐞𝐝 𝐑𝐞𝐟𝐨𝐫𝐦 𝐅𝐨𝐜𝐮𝐬\n\n- The Government reaffirms its commitment to the priorities that underpin Nigeria's improving credit profile, including:\n\n- Sustaining reform momentum and a disciplined, market-reflective and transparent foreign exchange regime;\n\n- Raising revenue through full implementation of the new tax laws and efficient tax administration;\n\n- Improving fiscal governance through spending efficiency, budget execution and transparent debt management;\n\n- Advancing structural reforms that support non-oil growth and economic diversification; and\n\n- Accelerating conversion of macroeconomic stability into shared prosperity through food security, decent jobs, human development and support for small businesses.\n\nThe Ministry notes Fitch's guidance that positive rating action could follow from sustained disinflation and reform implementation, further strengthening of external reserves, and stronger mobilisation of non-oil revenue, all of which remain central pillars of the administration's economic strategy.\n\n𝐓𝐚𝐢𝐰𝐨 𝐎𝐲𝐞𝐝𝐞𝐥𝐞\n𝘏𝘰𝘯𝘰𝘶𝘳𝘢𝘣𝘭𝘦 𝘔𝘪𝘯𝘪𝘴𝘵𝘦𝘳 𝘰𝘧 𝘍𝘪𝘯𝘢𝘯𝘤𝘦 𝘢𝘯𝘥 𝘊𝘰𝘰𝘳𝘥𝘪𝘯𝘢𝘵𝘪𝘯𝘨 𝘔𝘪𝘯𝘪𝘴𝘵𝘦𝘳 𝘰𝘧 𝘵𝘩𝘦 𝘌𝘤𝘰𝘯𝘰𝘮𝘺","lk":860,"rp":409,"t":"10.10 10:21","nm":"Taiwo Oyedele","rc":104,"sv":[{"u":"ayeimyeim","nm":"Ògá Yemí","tx":"@taiwoyedele Keep up the good work 👏","lk":0,"t":"11.10 10:52","url":"https://x.com/ayeimyeim/status/2109205522209534143"},{"u":"MuminOladipo","nm":"muminoladipo","tx":"@taiwoyedele Stop these press release. Do the real work. Seyi Makinde doesn't need epistle to tell the people of Ibadan and Oyo state his achievements . It is visible.","lk":0,"t":"11.10 09:55","url":"https://x.com/MuminOladipo/status/2109191199877644348"},{"u":"GKxyz01","nm":"GK","tx":"In 2016, Fitch gave Nigeria a B/B+ rating. We fell into a recession in Q2 that year. \n\nIn 2020, Fitch affirmed a B rating with Stable outlook. And then we slipped into our worst recession in four decades. \n\nBy The Way .....\n\nFitch Ratings for Nigeria is explicitly classified by Fitch as a SOLICITED rating. This means the Nigerian government initiates the relationship, provides internal fiscal data to the agency's analysts, and pays them directly to maintain and publish its credit status.","lk":0,"t":"11.10 03:51","url":"https://x.com/GKxyz01/status/2109099590926434646"},{"u":"UlasiObiora","nm":"ulasi obiora","tx":"@taiwoyedele whenever one requires long Grammer to explain a matter, the matter is nothing but a lie.","lk":0,"t":"11.10 02:34","url":"https://x.com/UlasiObiora/status/2109080160414609538"},{"u":"HOdegbaroye","nm":"8MRGREEIN 🌲🍀🇳🇬","tx":"@taiwoyedele All na English \nNo working","lk":0,"t":"10.10 22:44","url":"https://x.com/HOdegbaroye/status/2109022325513286013"}]},"2108283819560472987":{"u":"jeffholden","url":"https://x.com/jeffholden/status/2108283819560472987","tx":"After six years in stealth, Atomic Machines is out. Our mission: on-demand, universal command of matter. First beachhead: the Matter Compiler, a I/status/2108263657251418596","tx":"This is CRIS-0, Aether AI's first causal robotic intelligence system, operating in a real home. It reasons about how its actions will change the world, checks what actually happened, and adapts when reality doesn't go as expected. https://t.co/7qnzI4A2AF","lk":731,"rp":83,"t":"08.10 20:30","nm":"Aether AI (Causal Intelligence)","rc":138,"sv":[{"u":"atulkumarzz","nm":"Atul Kumar","tx":"@AetherLab_AI What makes it replan here the object moving, or the grasp not working out?","lk":3,"t":"08.10 22:24","url":"https://x.com/atulkumarzz/status/2108292456811024510"},{"u":"jji1jj","nm":"MR ANDERSON","tx":"@AetherLab_AI CRIS-0 is a strong step toward truly adaptive robotics. The ability to reason about consequences, observe what actually happens, and adjust in real time is what could make robots far more reliable in everyday environments.","lk":2,"t":"08.10 23:27","url":"https://x.com/jji1jj/status/2108308405937176902"},{"u":"heyrobinx","nm":"Robin","tx":"@AetherLab_AI The soft backpack bit caught my eye. More everyday stuff like this, please.","lk":2,"t":"08.10 23:14","url":"https://x.com/heyrobinx/status/2108305081489817663"},{"u":"heyemilyx","nm":"Emily Watson | AI Tools & Tech News","tx":"@AetherLab_AI Curious, what can the agent actually do with the Unified Tool Interface when it needs a closer look?","lk":2,"t":"08.10 23:14","url":"https://x.com/heyemilyx/status/2108304967367094772"},{"u":"Georgie_Price","nm":"Georgie Rose🌞","tx":"@AetherLab_AI The everyday scenes make the idea click for me. Less abstract “AI,” more: what should happen to this object right now?","lk":2,"t":"08.10 23:05","url":"https://x.com/Georgie_Price/status/2108302845292544018"}]},"2108210814360698923":{"u":"AetherLab_AI","url":"https://x.com/AetherLab_AI/status/2108210814360698923","tx":"Today's AI is remarkably good at recognizing patterns. But in the real world, patterns can only take us so far.\n\nWhen a robot acts, every action changes its environment. To ope ut over GB200 is the number that changes the economics, not just the benchmark. If serving cost falls that fast, inference margins — not training — become the battleground.","lk":0,"t":"11.10 02:26","url":"https://x.com/TechOutrider/status/2109078258805526821"},{"u":"MiraSynth0","nm":"Mira Synth Tech","tx":"@vllm_project @inferact @NVIDIAAI @RedHat_AI 7.8x throughput is insane. Rubin  vLLM is cooking","lk":0,"t":"11.10 01:36","url":"https://x.com/MiraSynth0/status/2109065631572345276"},{"u":"sunder0yct","nm":"sunder","tx":"@vllm_project @inferact @NVIDIAAI @RedHat_AI 7.8x throughput over GB200 is a monster number. The engineer question: how much is the silicon versus scheduling and kernel work, and what the tokens-per-watt curve looks like. The community bring-up speed here is impressive either way.","lk":0,"t":"11.10 00:17","url":"https://x.com/sunder0yct/status/2109045761770229934"},{"u":"hoatanhoano","nm":"Nguyễn Chí Trọng Nghĩa","tx":"@vllm_project @inferact @NVIDIAAI @RedHat_AI Thông lượng cao hơn 7,8 lần so với GB200 là con số đáng chú ý với ai đang tự dựng máy chủ AI, vì chi phí mỗi token giảm trực tiếp. Anh đang cân nhắc phần cứng nào cho lô suy luận lớn?","lk":0,"t":"11.10 00:02","url":"https://x.com/hoatanhoano/status/2109041907267760178"}]},"2108737709422567604":{"u":"inferact","url":"https://x.com/inferact/status/2108737709422567604","tx":"vLLM on NVIDIA Vera Rubin NVL72 delivers more than 7.8x the throughput of GB200 on MiniMax M3 at matched interactivity, measured on AgentX. \n\nInferact’s team has been co-leading this effort since Rubin was announced. We have integrated Rubin optimized MSA prefill kernel and tuned AgentX performance with locality aware optimizations targeted for Rubin GPU. These are early results.\n\n🧵 1/3","lk":91,"rp":14,"t":"10.10 03:53","nm":"Inferact","rc":9},"2108762820053745822":{"u":"woosuk_k","url":"https://x.com/woosuk_k/status/2108762820053745822","tx":"vLLM now supports Vera Rubin! DeepSeek, Kimi, MiniMax, GLM, and more are ready on Day 0, thanks to Rubin’s compatibility with most Blackwell kernels. We are also shipping a list of new Rubin-specific optimizations too 😄\nHuge thanks to @NVIDIAAI for all the support! https://t.co/f0cSz9VUVP","lk":72,"rp":9,"t":"10.10 05:33","nm":"Woosuk Kwon","rc":2},"2108687285533421787":{"u":"ritwikpavan","url":"https://x.com/ritwikpavan/status/2108687285533421787","tx":"JUST IN: Former SpaceX engineers raised $100M to build self-driving electric freight trains.\n\nParallel Systems puts batteries and motors directly under shipping containers, letting them move without a traditional locomotive.\n\n-Travels up to 500 miles on a charge\n-Recharges in as little as one hour\n-Vehicles automatically form and split apart into groups\n-Works with standard shipping containers\n-Designed to make shorter rail routes competitive with trucks\n\nParallel is already testing the system across 160 miles of railroad in Georgia.","lk":7963,"rp":618,"t":"10.10 00:33","nm":"Ritwik Pavan","rc":241,"sv":[{"u":"prabahankalita","nm":"Prabahan Kalita","tx":"The clever part isn’t making trains electric. It’s making the locomotive optional.\n\nIf shipping containers can move independently, rail starts looking less like a fixed schedule and more like a network of autonomous vehicles. That could change the economics of freight, especially for routes trucks dominate today.","lk":0,"t":"11.10 11:04","url":"https://x.com/prabahankalita/status/2109208485040701871"},{"u":"daviddobrinskiy","nm":"ddobrinskiy","tx":"@ritwikpavan Why not electrify the tracks and ditch the batteries?\n\nThat's literally how electric locomotives work","lk":0,"t":"11.10 10:46","url":"https://x.com/daviddobrinskiy/status/2109203989317246984"},{"u":"Andrewplkl","nm":"Andrew J. McKinney","tx":"@ritwikpavan $50 a month on @Patreon are you drunk?","lk":0,"t":"11.10 10:10","url":"https://x.com/Andrewplkl/status/2109194965868068919"},{"u":"alextowfigh","nm":"Alex Towfigh","tx":"@ritwikpavan Why did this just happen const m=d&&d['twttr.embed'];if(m&&m.method==='twttr.private.resize'&&m.params&&m.params[0]){const f=document.getElementById('emb');if(f)f.style.height=Math.ceil(m.params[0].height)+'px';}});

function srcRows(s,cur){return `<div class="srcs">`+s.src.map((a,i)=>`<div class="srcb${cur===i?' sel':''}"><button class="row${cur===i?' sel':''}" data-src="${s.id}~${i}" title="${esc(a.ti)}"><b>${esc(a.site)}</b><span class="tx">${esc(a.ti)}</span><span class="lk">${a.t}${a.fr?'':' ↗'}</span></button>${a.d?`<p class="desc">${esc(a.d)}</p>`:''}</div>`).join('')+`</div>`;}
function techCard(s,a,i){const u=a?a.url:s.src[0].url;
return `<div class="cs c-${s.sec}"><div class="mt"><span class="tag">${esc(s.lab)}</span><span>${a?esc(a.site)+' · ':''}${s.full}</span></div><h2>${esc(s.t)}</h2>
<p class="sum">${esc(s.s)}</p><div class="meta">${katLinje(s)}<small>${s.src.length} ${s.src.length===1?'kilde':'kilder'} · ingresser på originalspråket</small></div>
<div class="acts"><a class="btn" href="${u}" target="_blank" rel="noopener">Åpne artikkelen ↗</a>${a?`<small>${esc(a.site)} kan ikke vises inne i siden (blokkerer innbygging)</small>`:''}</div>
<h4>Kilder og ingresser (${s.src.length})</h4>${srcRows(s,a?i:-1)}</div>`;}
function videoHTML(s){
return `<div class="vw c-Video"><div class="vfr"><iframe id="yt" title="${esc(s.t)}" src="https://www.youtube-nocookie.com/embed/${s.v}?rel=0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>
<div class="cs c-Video"><div class="mt"><span class="tag">🎬 ${esc(s.lab)}</span><span>${esc(s.ch)} · ${s.full}${s.dur?' · '+esc(s.dur):''}</span></div><h2>${esc(s.t)}</h2>
<p class="sum">${esc(s.s)}</p><div class="meta">${katLinje(s)}</div>
<div class="acts"><a class="btn" href="${s.url}" target="_blank" rel="noopener">Åpne på YouTube ↗</a><small>Sammendrag fra videoens tittel/beskrivelse (originalspråk)</small></div></div></div>`;}
const _storyX=storyHTML;storyHTML=function(id){const s=SM[id];return s.v?videoHTML(s):s.src.length?techCard(s,null,-1):_storyX(id);};
function srcHTML(k){const [s,a,i]=srcOf(k);if(!a.fr)return techCard(s,a,i);
return `<div class="aw"><div class="rel"><span>Kilder</span>`+s.src.map((b,j)=>`<a class="chip site${j===i?' sel':''}${b.fr?'':' nf'}" data-src="${s.id}~${j}" href="${b.url}" target="_blank" rel="noopener">${esc(b.site)}</a>`).join('')+`<a class="chip story" data-story="${s.id}" href="${s.src[0].url}" target="_blank" rel="noopener">Sammendrag</a></div>
<iframe class="art" title="${esc(a.ti)}" src="${a.url}" sandbox="allow-scripts allow-same-origin allow-popups allow-forms" referrerpolicy="no-referrer" loading="lazy"></iframe>
<small class="artn">Vises ikke siden riktig? Bruk «↗ Åpne i nytt vindu» øverst.</small></div>`;}

// ⭐ Lagre til senere: øyeblikksbilde av saken (+ innlegg) i localStorage, så den kan vises selv når den er eldre enn det innebygde vinduet.
const LGK='nyh-lagret';function lagret(){try{return JSON.parse(localStorage.getItem(LGK)||'{}')}catch(_){return {}}}
function erLagret(id){return !!lagret()[id];}
function star(id){const on=erLagret(id);return `<button type="button" class="star${on?' on':''}" data-star="${id}" aria-pressed="${on}" aria-label="${on?'Fjern fra lagrede':'Lagre til senere'}" title="${on?'Fjern fra lagrede':'Lagre til senere'}">${on?'★':'☆'}</button>`;}
function tellLagret(){const n=Object.keys(lagret()).length,e=document.getElementById('nLagret');if(e)e.textContent=n;}
function byttLagret(id){const L=lagret();if(L[id])delete L[id];else{const s=SM[id];if(!s)return;const pp={};(s.p||[]).forEach(p=>{if(D.posts[p])pp[p]=D.posts[p];});L[id]={at:Date.now(),s,posts:pp};}
try{localStorage.setItem(LGK,JSON.stringify(L));}catch(_){alert('Kunne ikke lagre (lagringsplass full eller blokkert).');}
tellLagret();if(curF==='Lagret')renderLagret();else document.querySelectorAll(`[data-star="${CSS.escape(id)}"]`).forEach(b=>b.outerHTML=star(id));}
function registrerLagret(){Object.values(lagret()).forEach(x=>{if(x&&x.s&&!SM[x.s.id])SM[x.s.id]=x.s;if(x&&x.posts)for(const p in x.posts)if(!D.posts[p])D.posts[p]=x.posts[p];});}
function renderLagret(){registrerLagret();const L=Object.values(lagret()).sort((a,b)=>b.at-a.at);
let h=`<li class="lnote">⭐ Lagret til senere (${L.length}). Lagringen gjelder bare denne nettleseren/enheten.</li>`;
h+=L.length?L.map(x=>li(SM[x.s.id]||x.s)).join(''):'<li class="empty">Ingen lagrede saker ennå. Trykk ☆ på en sak eller video for å lagre den.</li>';
LIST.innerHTML=h;if(cur)markSel(cur[0],cur[1]);}
// 📅 Kalender: kommende datoer fra kalender.json (offisielle kilder / arkivsaker).
const MNDL=['januar','februar','mars','april','mai','juni','juli','august','september','oktober','november','desember'];
const KATC={'Økonomi':'Okonomi'};
function dSpan(k){const [y,m,d]=k.dato.split('-').map(Number);if(!k.fra)return d+'.';const [y2,m2,d2]=k.fra.split('-').map(Number);return m2===m?`${d2}.–${d}.`:`${d2}.${m2}.–${d}.`;}
function renderKal(){const L=(D.kal||[]).filter(k=>k.dato>=TODAY).sort((a,b)=>a.dato<b.dato?-1:a.dato>b.dato?1:0);
let h='<li class="lnote">📅 Kommende datoer · tider i norsk tid · «ikke bekreftet» = planleggingsdato eller medierapport. Kilde for hver dato.</li>',mm='';
for(const k of L){const [y,m,d]=k.dato.split('-').map(Number);const key=k.dato.slice(0,7);if(key!==mm){mm=key;h+=`<li class="day">${MNDL[m-1]} ${y}</li>`;}
const wd=DAG[new Date(Date.UTC(y,m-1,d,12)).getUTCDay()];
h+=`<li class="kal c-${KATC[k.kat]||k.kat}"><div class="kd"><b>${dSpan(k)}</b><span>${wd}</span></div><div class="kt"><div class="im"><span class="tag">${esc(k.kat)}</span>${k.bekreftet?'':'<span class="ub">ikke bekreftet</span>'}</div>`+
`<h3>${esc(k.tittel)}</h3><div class="km">${k.tid?'kl. '+esc(k.tid)+' · ':''}<a href="${esc(k.kilde)}" target="_blank" rel="noopener">Kilde: ${esc(k.kildenavn||'lenke')} ↗</a></div></div></li>`;}
if(!L.length)h+='<li class="empty">Ingen kommende datoer.</li>';LIST.innerHTML=h;}
// 📰 Brief: de 5 viktigste fra siste oppdatering; tidligere briefer i nedtrekksliste.
const BRK='nyh-brief';let bIdx=0,bOpen=localStorage.getItem(BRK)!=='lukket';
function bLabel(b){return (b.dk===TODAY?'':dayShort(b.dk)+' ')+'kl. '+b.hm;}
function briefHTML(){const B=D.brief||[];if(!B.length)return '';const b=B[Math.min(bIdx,B.length-1)];
return `<li class="brief${bOpen?' open':''}"><div class="bh"><button type="button" class="bt" aria-expanded="${bOpen}"><span class="chev">${bOpen?'▾':'▸'}</span> 📰 Brief ${bLabel(b)}</button>`+
(B.length>1?`<select id="bsel" aria-label="Velg tidligere brief">`+B.map((x,i)=>`<option value="${i}"${i===bIdx?' selected':''}>${(x.dk===TODAY?'I dag ':x.dk===YEST?'I går ':dayShort(x.dk)+' ')}kl. ${x.hm}</option>`).join('')+'</select>':'')+'</div>'+
(bOpen?'<ol>'+b.items.map(x=>`<li><a href="#story=${x.id}" data-brief="${x.id}" data-bdk="${x.dk}"><b>${esc(x.t)}</b><span>${esc(x.l)}</span></a></li>`).join('')+'</ol>':'')+'</li>';}
async function visBrief(id,dk){if(!SM[id]){try{await hentMnd([dk.slice(0,7)]);}catch(_){}}if(SM[id])show('story',id);else location.hash='story='+id;}
function ekstraKlikk(e){const st=e.target.closest('.star');if(st){e.preventDefault();e.stopPropagation();byttLagret(st.dataset.star);return true;}
const bt=e.target.closest('.brief .bt');if(bt){e.preventDefault();e.stopPropagation();bOpen=!bOpen;try{localStorage.setItem(BRK,bOpen?'apen':'lukket');}catch(_){}render();return true;}
if(e.target.closest('#bsel')){e.stopPropagation();return true;}
const ba=e.target.closest('[data-brief]');if(ba){if(e.ctrlKey||e.metaKey||e.shiftKey)return true;e.preventDefault();e.stopPropagation();visBrief(ba.dataset.brief,ba.dataset.bdk);return true;}
const ka=e.target.closest('.kal a');if(ka){e.stopPropagation();return true;}return false;}
LIST.addEventListener('change',e=>{if(e.target.id==='bsel'){bIdx=+e.target.value;render();}});
registrerLagret();tellLagret();
render();
const h=hashItem();if(h)show(h[0],h[1]);else{const f=document.querySelector('.item[data-card]');if(f){show('story',f.dataset.card);LIST.scrollTop=0;}}
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
